volumes:
  postgres-data:
  redis-data:
  rabbitmq_data:
  elasticsearch-data:
  kibana-data:
  filebeat-config:  # Filebeat 配置文件卷（可选）

services:
  db:
    container_name: postgresdb
    image: postgres:18
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  # 新增 Redis 服务
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --bind 0.0.0.0

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.5-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      # RABBITMQ_ERLANG_COOKIE: "my_secret_cookie"
    ports:
      # AMQP 协议端口
      - "5672:5672"
      # HTTP 管理界面端口
      - "15672:15672"
    networks:
      - app-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Elasticsearch 9.3.2 - 日志存储和搜索（包含 IK 中文分词插件）
  elasticsearch:
    container_name: elasticsearch
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: windblog-elasticsearch:9.3.2-ik
    restart: unless-stopped
    environment:
      # 单节点模式
      discovery.type: single-node
      # JVM 内存配置
      ES_JAVA_OPTS: "-Xms1g -Xmx2g"
      # 启用 xpack 安全
      xpack.security.enabled: "true"
      # 集群名称
      cluster.name: windblog-cluster
      # 节点名称
      node.name: windblog-node-1
      # 认证密钥（从环境变量读取）
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ports:
      # HTTP API 端口（供宿主机上的 Quarkus 应用访问）
      # Windows 当前环境中 9200 位于 excluded port range，改用 19200 避免宿主机无法绑定
      - "19200:9200"
      # Transport 端口
      - "9300:9300"
    networks:
      - app-network
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -kf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Kibana 9.3.2 - 日志可视化
  kibana:
    container_name: kibana
    image: elastic.1ms.run/kibana/kibana:9.3.2
    restart: unless-stopped
    environment:
      # 连接 Elasticsearch（使用 HTTPS）
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # Elasticsearch 认证（使用 kibana_system 服务账户）
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: ${KIBANA_SERVICE_ACCOUNT_TOKEN}
      # 启用 xpack 安全
      xpack.security.enabled: "true"
      # 语言设置
      I18N_LOCALE: zh-CN
      # Kibana 加密密钥（用于加密 session 等敏感数据）
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      # Kibana 服务器密钥（用于生成和验证 JWT）
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY}
      # 启用 SSL（可选，开发环境可禁用）
      # SERVER_SSL_ENABLED: "true"
      # SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/kibana.crt
      # SERVER_SSL_KEY: /usr/share/kibana/config/certs/kibana.key
    ports:
      # HTTP 端口
      - "5601:5601"
    networks:
      - app-network
    volumes:
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Filebeat - 日志收集器
  filebeat:
    container_name: filebeat
    image: elastic.1ms.run/beats/filebeat:9.3.2
    restart: unless-stopped
    user: root  # 需要 root 权限读取日志文件
    networks:
      - app-network
    volumes:
      # 挂载应用日志目录
      - ./logs:/var/log/windblog:ro
      # 挂载 Filebeat 配置文件
      - ./filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_SSL_VERIFY=none
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "filebeat", "test", "output" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 使用 --strict.perms=false 跳过权限检查（Windows Docker 挂载文件权限问题）
    command: [ "filebeat", "-e", "--strict.perms=false" ]

networks:
  app-network:
    driver: bridge
