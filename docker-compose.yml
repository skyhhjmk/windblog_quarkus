services:
  db:
    container_name: postgresdb
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:-windblog}
      POSTGRES_DB: ${POSTGRES_DB:-windblog}
    expose:
      - "5432"

  codex-creator-db-init:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: "no"
    networks:
      - app-network
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-windblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-windblog}
      CODEX_CREATOR_DB_NAME: ${CODEX_CREATOR_DB_NAME:-codex_creator}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        if ! psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
            -tAc "SELECT 1 FROM pg_database WHERE datname = '$${CODEX_CREATOR_DB_NAME}'" | grep -q 1; then
          psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
            -c "CREATE DATABASE \"$${CODEX_CREATOR_DB_NAME}\" OWNER \"$${POSTGRES_USER}\""
        fi
        psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${CODEX_CREATOR_DB_NAME}" \
          -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"

  windblog:
    container_name: windblog
    image: ${WINDBLOG_IMAGE:-ghcr.io/skyhhjmk/windblog_quarkus:latest-native}
    pull_policy: ${WINDBLOG_PULL_POLICY:-always}
    # 本地证书目录保持 0600；rootless Podman 的容器 root 仍映射到当前宿主用户。
    user: "0:0"
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - app-network
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      QUARKUS_LOG_FILE_ENABLED: "true"
      WINDBLOG_SITE_PUBLIC_URL: ${WINDBLOG_SITE_PUBLIC_URL:-https://your-domain.example}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-windblog}
      POSTGRES_USER: ${POSTGRES_USER:-windblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-windblog}}
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-windblog}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-windblog}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      ELASTICSEARCH_SSL_VERIFY: ${ELASTICSEARCH_SSL_VERIFY:-full}
      ELASTICSEARCH_SSL_TRUST_ALL: ${ELASTICSEARCH_SSL_TRUST_ALL:-false}
      WIND_BLOG_MEDIA_VIRUS_SCAN_ENABLED: ${WIND_BLOG_MEDIA_VIRUS_SCAN_ENABLED:-true}
      WIND_BLOG_MEDIA_VIRUS_SCAN_REQUIRED: ${WIND_BLOG_MEDIA_VIRUS_SCAN_REQUIRED:-true}
      WIND_BLOG_MEDIA_VIRUS_SCAN_AUTO_DETECT: ${WIND_BLOG_MEDIA_VIRUS_SCAN_AUTO_DETECT:-true}
      WIND_BLOG_MEDIA_VIRUS_SCAN_HOST: ${WIND_BLOG_MEDIA_VIRUS_SCAN_HOST:-clamav}
      WIND_BLOG_MEDIA_VIRUS_SCAN_PORT: "3310"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?USER_JWT_SECRET must be set}
      SECURITY_EVENT_HASH_SECRET: ${SECURITY_EVENT_HASH_SECRET:?SECURITY_EVENT_HASH_SECRET must be set}
      WINDBLOG_CODEX_CREATOR_EVENTS_ENABLED: ${WINDBLOG_CODEX_CREATOR_EVENTS_ENABLED:-false}
      WINDBLOG_CODEX_CREATOR_PREFER: ${WINDBLOG_CODEX_CREATOR_PREFER:-true}
      WINDBLOG_CODEX_CREATOR_ENDPOINT: ${WINDBLOG_CODEX_CREATOR_ENDPOINT:-http://codex-creator:8681}
      # The host .env has one source of truth; this key is the WindBlog
      # container-side name expected by application.properties.
      WINDBLOG_CODEX_CREATOR_SHARED_SECRET: ${CODEX_CREATOR_INTERNAL_SHARED_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SECURITY_FAIL_ON_DEFAULT_SECRETS_IN_PROD: ${SECURITY_FAIL_ON_DEFAULT_SECRETS_IN_PROD:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      SECURITY_HEADERS_HSTS_ENABLED: ${SECURITY_HEADERS_HSTS_ENABLED:-true}
      SECURITY_HEADERS_CSP_ENFORCE: ${SECURITY_HEADERS_CSP_ENFORCE:-true}
      SECURITY_HEADERS_CSP_TRUSTED_TYPES_ENABLED: ${SECURITY_HEADERS_CSP_TRUSTED_TYPES_ENABLED:-true}
      SECURITY_HEADERS_CSP_IMG_SOURCES: ${SECURITY_HEADERS_CSP_IMG_SOURCES:-none}
      SECURITY_HEADERS_CSP_CONNECT_SOURCES: ${SECURITY_HEADERS_CSP_CONNECT_SOURCES:-none}
      GRPC_SERVER_PLAINTEXT: ${GRPC_SERVER_PLAINTEXT:-false}
      GRPC_SERVER_CLIENT_AUTH: ${GRPC_SERVER_CLIENT_AUTH:-required}
      GRPC_SERVER_CERTIFICATE: ${GRPC_SERVER_CERTIFICATE:-/deployments/certs/ca/server.crt}
      GRPC_SERVER_KEY: ${GRPC_SERVER_KEY:-/deployments/certs/ca/server.key}
      GRPC_SERVER_TRUST_STORE: ${GRPC_SERVER_TRUST_STORE:-/deployments/certs/ca/truststore.p12}
      GRPC_SERVER_TRUST_STORE_PASSWORD: ${GRPC_SERVER_TRUST_STORE_PASSWORD:-changeit}
      GRPC_CLIENT_CA_CERTIFICATE: ${GRPC_CLIENT_CA_CERTIFICATE:-/deployments/certs/ca/ca.crt}
      GRPC_CLIENT_CERTIFICATE: ${GRPC_CLIENT_CERTIFICATE:-/deployments/certs/ca/client.crt}
      GRPC_CLIENT_KEY: ${GRPC_CLIENT_KEY:-/deployments/certs/ca/client.key}
      GRPC_CLIENT_ALLOW_PLAINTEXT_FALLBACK: ${GRPC_CLIENT_ALLOW_PLAINTEXT_FALLBACK:-false}
      MEDIA_UPLOAD_DIR: /deployments/uploads
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/windblog-logs:/deployments/logs
      - ${WINDBLOG_DATA_DIR:-.}/uploads:/deployments/uploads
      - ${WINDBLOG_CERT_DIR:-./certs}:/deployments/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${WINDBLOG_HOST_PORT:-8080}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-127.0.0.1}"
      - target: 9000
        published: "${WINDBLOG_GRPC_HOST_PORT:-9000}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-127.0.0.1}"
    expose:
      - "8080"
      - "9000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready >/dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  codex-creator:
    container_name: codex-creator
    image: ${CODEX_CREATOR_IMAGE:-ghcr.io/skyhhjmk/codex-creator:latest-native}
    pull_policy: ${CODEX_CREATOR_PULL_POLICY:-always}
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - app-network
    environment:
      CODEX_CREATOR_DB_JDBC_URL: jdbc:postgresql://db:5432/${CODEX_CREATOR_DB_NAME:-codex_creator}
      CODEX_CREATOR_DB_USERNAME: ${CODEX_CREATOR_DB_USERNAME:-${POSTGRES_USER:-windblog}}
      CODEX_CREATOR_DB_PASSWORD: ${CODEX_CREATOR_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
      CODEX_CREATOR_REDIS_URL: redis://redis:6379
      CODEX_CREATOR_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CODEX_CREATOR_ADMIN_TOKEN: ${CODEX_CREATOR_ADMIN_TOKEN:-}
      # Use the same host .env value as the WindBlog service above.
      CODEX_CREATOR_INTERNAL_SHARED_SECRET: ${CODEX_CREATOR_INTERNAL_SHARED_SECRET:-}
      CODEX_CREATOR_MCP_BEARER_TOKEN: ${CODEX_CREATOR_MCP_BEARER_TOKEN:-}
      CODEX_CREATOR_WINDBLOG_ENDPOINT: ${CODEX_CREATOR_WINDBLOG_ENDPOINT:-http://windblog:8080}
      CODEX_CREATOR_WINDBLOG_SHARED_SECRET: ${CODEX_CREATOR_WINDBLOG_SHARED_SECRET:-${CODEX_CREATOR_INTERNAL_SHARED_SECRET:-}}
      CODEX_CREATOR_WINDBLOG_MAX_IMAGE_BYTES: ${CODEX_CREATOR_WINDBLOG_MAX_IMAGE_BYTES:-8388608}
      CODEX_CREATOR_PROMPT_VERSION: ${CODEX_CREATOR_PROMPT_VERSION:-2}
      CODEX_CREATOR_ARTICLE_REASONING_EFFORT: ${CODEX_CREATOR_ARTICLE_REASONING_EFFORT:-high}
      CODEX_CREATOR_TOPIC_REASONING_EFFORT: ${CODEX_CREATOR_TOPIC_REASONING_EFFORT:-medium}
      CODEX_CREATOR_ARTICLE_MAX_QUALITY_ATTEMPTS: ${CODEX_CREATOR_ARTICLE_MAX_QUALITY_ATTEMPTS:-2}
      CODEX_CREATOR_ARTICLE_MIN_CJK_CHARACTERS: ${CODEX_CREATOR_ARTICLE_MIN_CJK_CHARACTERS:-1200}
      CODEX_CREATOR_ARTICLE_MIN_WORDS: ${CODEX_CREATOR_ARTICLE_MIN_WORDS:-900}
      CODEX_CREATOR_ARTICLE_MIN_SOURCES: ${CODEX_CREATOR_ARTICLE_MIN_SOURCES:-2}
      CODEX_APP_SERVER_ENABLED: ${CODEX_APP_SERVER_ENABLED:-false}
      CODEX_COMMAND: ${CODEX_COMMAND:-codex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/codex-creator-data:/data/codex-creator
      - ${WINDBLOG_DATA_DIR:-.}/codex-creator-logs:/deployments/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-creator-db-init:
        condition: service_completed_successfully
    expose:
      - "8681"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8681/q/health/ready >/dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # 新增 Redis 服务
  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/redis-data:/data
    ports:
      - target: 6379
        published: "${REDIS_HOST_PORT:-6379}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.5-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    cpus: "1.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 30m
        max-file: "5"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      # RABBITMQ_ERLANG_COOKIE: "my_secret_cookie"
    expose:
      - "5672"
      - "15672"
    ports:
      - target: 5672
        published: "${RABBITMQ_HOST_PORT:-5672}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
      - target: 15672
        published: "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
    networks:
      - app-network
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/rabbitmq_data:/var/lib/rabbitmq
      # - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl authenticate_user \"$${RABBITMQ_DEFAULT_USER}\" \"$${RABBITMQ_DEFAULT_PASS}\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Elasticsearch 9.3.2 - 日志存储和搜索（包含 IK 中文分词插件）
  elasticsearch:
    container_name: elasticsearch
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: windblog-elasticsearch:9.3.2-ik
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    environment:
      # 单节点模式
      discovery.type: single-node
      # JVM 内存配置
      ES_JAVA_OPTS: "-Xms1g -Xmx2g"
      # 启用 xpack 安全
      xpack.security.enabled: "true"
      # 集群名称
      cluster.name: windblog-cluster
      # 节点名称
      node.name: windblog-node-1
      # 认证密钥（从环境变量读取）
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
    expose:
      - "9200"
    ports:
      - target: 9200
        published: "${ELASTICSEARCH_HOST_PORT:-9200}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
    networks:
      - app-network
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -kf -u elastic:\"$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Kibana 9.3.2 - 日志可视化
  kibana:
    container_name: kibana
    image: elastic.1ms.run/kibana/kibana:9.3.2
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 30m
        max-file: "5"
    environment:
      # 连接 Elasticsearch（使用 HTTPS）
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # Elasticsearch 认证（使用 kibana_system 服务账户）
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: ${KIBANA_SERVICE_ACCOUNT_TOKEN:?KIBANA_SERVICE_ACCOUNT_TOKEN must be set}
      # 启用 xpack 安全
      xpack.security.enabled: "true"
      # 语言设置
      I18N_LOCALE: zh-CN
      # Kibana 加密密钥（用于加密 session 等敏感数据）
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY must be set}
      # Kibana 服务器密钥（用于生成和验证 JWT）
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:?KIBANA_REPORTING_KEY must be set}
      # 启用 SSL（可选，开发环境可禁用）
      # SERVER_SSL_ENABLED: "true"
      # SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/kibana.crt
      # SERVER_SSL_KEY: /usr/share/kibana/config/certs/kibana.key
    expose:
      - "5601"
    ports:
      - target: 5601
        published: "${KIBANA_HOST_PORT:-5601}"
        host_ip: "${WINDBLOG_HOST_BIND_IP:-0.0.0.0}"
    networks:
      - app-network
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Filebeat - 日志收集器
  filebeat:
    container_name: filebeat
    image: elastic.1ms.run/beats/filebeat:9.3.2
    restart: unless-stopped
    user: root  # 需要 root 权限读取日志文件
    cpus: "0.5"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - app-network
    volumes:
      # 与 WindBlog 共享应用日志卷
      - ${WINDBLOG_DATA_DIR:-.}/windblog-logs:/var/log/windblog:ro
      # 挂载 Filebeat 配置文件
      - ./filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-full}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "filebeat", "test", "output", "--strict.perms=false" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 使用 --strict.perms=false 跳过权限检查（Windows Docker 挂载文件权限问题）
    command: [ "filebeat", "-e", "--strict.perms=false" ]

  clamav:
    container_name: clamav
    image: clamav/clamav:stable
    profiles:
      - security
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 30m
        max-file: "5"
    networks:
      - app-network
    environment:
      # ClamAV 默认 StreamMaxLength 只有 25M，无法扫描管理端允许的 103MB/512MB 媒体。
      CLAMD_CONF_StreamMaxLength: "${CLAMAV_STREAM_MAX_LENGTH:-512M}"
      CLAMD_CONF_MaxFileSize: "${CLAMAV_MAX_FILE_SIZE:-512M}"
      CLAMD_CONF_MaxScanSize: "${CLAMAV_MAX_SCAN_SIZE:-1G}"
      CLAMD_CONF_MaxScanTime: "${CLAMAV_MAX_SCAN_TIME:-600000}"
    volumes:
      - ${WINDBLOG_DATA_DIR:-.}/clamav-data:/var/lib/clamav
    ports:
      - target: 3310
        published: "${CLAMAV_HOST_PORT:-3310}"
        host_ip: "${CLAMAV_HOST_BIND_IP:-127.0.0.1}"
    healthcheck:
      test: [ "CMD-SHELL", "clamdscan --ping 1 --wait /etc/hostname >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

networks:
  app-network:
    driver: bridge
