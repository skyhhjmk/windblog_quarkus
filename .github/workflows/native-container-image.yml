name: Native Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-image:
    name: Build native image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x ./mvnw

      - name: Calculate version and publish policy
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          PUSH_IMAGE="false"
          ADD_LATEST="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              PUSH_IMAGE="true"
              ADD_LATEST="true"
            else
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" && ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            PUSH_IMAGE="true"
            ADD_LATEST="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            PUSH_IMAGE="false"
            ADD_LATEST="false"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "add_latest=${ADD_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "image=docker.io/biliwind/windblog" >> "${GITHUB_OUTPUT}"

      - name: Set Maven project version
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${{ steps.release.outputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Verify Maven version
        shell: bash
        run: |
          CURRENT_VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${CURRENT_VERSION}" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Expected Maven version ${{ steps.release.outputs.version }}, got ${CURRENT_VERSION}" >&2
            exit 1
          fi

      - name: Login to Docker Hub
        if: steps.release.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build native image with Quarkus container-image
        id: quarkus_container_image
        continue-on-error: true
        shell: bash
        run: |
          QUARKUS_IMAGE_ARGS=()
          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            QUARKUS_IMAGE_ARGS+=("-Dquarkus.container-image.additional-tags=latest")
          fi

          ./mvnw -B package \
            -DskipTests \
            -Dnative \
            -Dquarkus.application.version=${{ steps.release.outputs.version }} \
            -Dquarkus.native.container-build=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=${{ steps.release.outputs.push_image }} \
            "${QUARKUS_IMAGE_ARGS[@]}"

      - name: Fallback build with Dockerfile.native
        if: steps.quarkus_container_image.outcome == 'failure'
        shell: bash
        run: |
          # 双轨制保底：Quarkus container-image 应优先使用 src/main/docker/Dockerfile.native。
          # 如果扩展行为变化或 Dockerfile 复用失败，这里保留现有手工 docker build 发布路线。
          echo "Quarkus container-image build failed. Falling back to src/main/docker/Dockerfile.native."

          ./mvnw -B package \
            -DskipTests \
            -Dnative \
            -Dquarkus.application.version=${{ steps.release.outputs.version }} \
            -Dquarkus.native.container-build=true \
            -Dquarkus.container-image.build=false \
            -Dquarkus.container-image.push=false

          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -f src/main/docker/Dockerfile.native \
            -t "${IMAGE}:${VERSION}" \
            .

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          fi

          if [[ "${{ steps.release.outputs.push_image }}" == "true" ]]; then
            docker push "${IMAGE}:${VERSION}"

            if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
              docker push "${IMAGE}:latest"
            fi
          fi
