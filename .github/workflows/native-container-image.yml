name: Native Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-native-image:
    name: Build native image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      CONTAINER_IMAGE_GROUP: ${{ vars.CONTAINER_IMAGE_GROUP }}
      CONTAINER_IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x ./mvnw

      - name: Calculate version and publish policy
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_IMAGE="false"
          ADD_LATEST="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              RELEASE_IMAGE="true"
              ADD_LATEST="true"
            else
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" && ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            RELEASE_IMAGE="true"
            ADD_LATEST="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_IMAGE="false"
            ADD_LATEST="false"
          fi

          IMAGE_GROUP="${CONTAINER_IMAGE_GROUP:-hhjmk}"
          IMAGE_NAME="${CONTAINER_IMAGE_NAME:-windblog_quarkus}"
          IMAGE="${IMAGE_GROUP}/${IMAGE_NAME}"
          PUSH_IMAGE="false"

          if [[ -n "${CONTAINER_REGISTRY}" ]]; then
            IMAGE="${CONTAINER_REGISTRY}/${IMAGE}"
          fi

          if [[ "${RELEASE_IMAGE}" == "true" ]]; then
            if [[ -n "${CONTAINER_REGISTRY}" && -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_PASSWORD}" ]]; then
              PUSH_IMAGE="true"
            else
              echo "Registry configuration is incomplete. The image will be built but not pushed."
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "add_latest=${ADD_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "image_group=${IMAGE_GROUP}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set Maven project version
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${{ steps.release.outputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Verify Maven version
        shell: bash
        run: |
          CURRENT_VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${CURRENT_VERSION}" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Expected Maven version ${{ steps.release.outputs.version }}, got ${CURRENT_VERSION}" >&2
            exit 1
          fi

      - name: Login to container registry
        if: steps.release.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build JVM application
        shell: bash
        run: |
          ./mvnw -B package \
            -DskipTests \
            -Dquarkus.application.version=${{ steps.release.outputs.version }} \
            -Dquarkus.container-image.build=false \
            -Dquarkus.container-image.push=false

      - name: Build JVM container image
        shell: bash
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -f src/main/docker/Dockerfile.jvm \
            -t "${IMAGE}:${VERSION}-jvm" \
            .

      - name: Build native application
        shell: bash
        run: |
          ./mvnw -B package \
            -DskipTests \
            -Dnative \
            -Dquarkus.application.version=${{ steps.release.outputs.version }} \
            -Dquarkus.native.container-build=true \
            -Dquarkus.container-image.build=false \
            -Dquarkus.container-image.push=false

      - name: Build native container image variants
        shell: bash
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          # native-micro 是边缘节点默认镜像，因此同时占用无后缀主版本标签。
          docker build \
            -f src/main/docker/Dockerfile.native-micro \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${VERSION}-native-micro" \
            .

          docker build \
            -f src/main/docker/Dockerfile.native \
            -t "${IMAGE}:${VERSION}-native" \
            .

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            docker tag "${IMAGE}:${VERSION}-native-micro" "${IMAGE}:latest-native-micro"
            docker tag "${IMAGE}:${VERSION}-native" "${IMAGE}:latest-native"
            docker tag "${IMAGE}:${VERSION}-jvm" "${IMAGE}:latest-jvm"
          fi

      - name: Push container image variants
        if: steps.release.outputs.push_image == 'true'
        shell: bash
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"

          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}-native-micro"
          docker push "${IMAGE}:${VERSION}-native"
          docker push "${IMAGE}:${VERSION}-jvm"

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:latest-native-micro"
            docker push "${IMAGE}:latest-native"
            docker push "${IMAGE}:latest-jvm"
          fi
