name: Native Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/skyhhjmk/windblog_quarkus

jobs:
  build-native-image:
    name: Build ${{ matrix.variant }} native image
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: WindBlog
            profile: prod
            dockerfile: src/main/docker/Dockerfile.native
            suffix: "-native"
          - variant: edge
            profile: edge
            dockerfile: src/main/docker/Dockerfile.native-micro
            suffix: ""
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x ./mvnw

      - name: Calculate version and publish policy
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          PUSH_IMAGE="false"
          ADD_LATEST="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              PUSH_IMAGE="true"
              ADD_LATEST="true"
            else
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" &&
                  ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            PUSH_IMAGE="true"
            ADD_LATEST="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PUSH_IMAGE="false"
            ADD_LATEST="false"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "add_latest=${ADD_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Set Maven project version
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${{ steps.release.outputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Verify Maven version
        shell: bash
        run: |
          CURRENT_VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${CURRENT_VERSION}" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Expected Maven version ${{ steps.release.outputs.version }}, got ${CURRENT_VERSION}" >&2
            exit 1
          fi

      - name: Login to GHCR
        if: steps.release.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Hub credentials
        if: steps.release.outputs.push_image == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required for image publishing." >&2
            exit 1
          fi

      - name: Login to Docker Hub
        if: steps.release.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.variant }} native application
        shell: bash
        run: |
          # Public runners have 16 GB; keep the 6 GB cap for smaller runners.
          # The full application can otherwise spend most of universe building in GC.
          NATIVE_HEAP_GB=6
          if awk '/MemTotal/ { exit !($2 >= 14 * 1024 * 1024) }' /proc/meminfo; then
            NATIVE_HEAP_GB=10
          fi
          echo "Native image maximum heap: ${NATIVE_HEAP_GB} GB"
          ./mvnw -B -ntp clean package \
            -DskipTests \
            -Dnative \
            -Dquarkus.profile=${{ matrix.profile }} \
            -Dquarkus.application.version="${{ steps.release.outputs.version }}" \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx="${NATIVE_HEAP_GB}g" \
            -Dquarkus.container-image.build=false \
            -Dquarkus.container-image.push=false \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=skyhhjmk \
            -Dquarkus.container-image.name=windblog_quarkus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag ${{ matrix.variant }} native image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          VARIANT: ${{ matrix.variant }}
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          docker buildx build \
            --load \
            --cache-from "type=gha,scope=buildx-${VARIANT}" \
            --cache-to "type=gha,mode=max,scope=buildx-${VARIANT}" \
            -f "${DOCKERFILE}" \
            -t "${IMAGE}:${VERSION}${IMAGE_SUFFIX}" \
            -t "${IMAGE}:sha-${SHORT_SHA}${IMAGE_SUFFIX}" \
            .

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${VERSION}${IMAGE_SUFFIX}" "${IMAGE}:latest${IMAGE_SUFFIX}"
          fi

      - name: Push ${{ matrix.variant }} native image to GHCR
        if: steps.release.outputs.push_image == 'true'
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          bash scripts/push-image-with-retry.sh "${IMAGE}:${VERSION}${IMAGE_SUFFIX}"
          bash scripts/push-image-with-retry.sh "${IMAGE}:sha-${SHORT_SHA}${IMAGE_SUFFIX}"

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            bash scripts/push-image-with-retry.sh "${IMAGE}:latest${IMAGE_SUFFIX}"
          fi

      - name: Push ${{ matrix.variant }} native image to Docker Hub
        if: steps.release.outputs.push_image == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          SOURCE_IMAGE="${{ steps.release.outputs.image }}"
          DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/windblog_quarkus"
          VERSION="${{ steps.release.outputs.version }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          docker tag "${SOURCE_IMAGE}:${VERSION}${IMAGE_SUFFIX}" "${DOCKERHUB_IMAGE}:${VERSION}${IMAGE_SUFFIX}"
          docker tag "${SOURCE_IMAGE}:sha-${SHORT_SHA}${IMAGE_SUFFIX}" "${DOCKERHUB_IMAGE}:sha-${SHORT_SHA}${IMAGE_SUFFIX}"

          bash scripts/push-image-with-retry.sh "${DOCKERHUB_IMAGE}:${VERSION}${IMAGE_SUFFIX}"
          bash scripts/push-image-with-retry.sh "${DOCKERHUB_IMAGE}:sha-${SHORT_SHA}${IMAGE_SUFFIX}"

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker tag "${SOURCE_IMAGE}:latest${IMAGE_SUFFIX}" "${DOCKERHUB_IMAGE}:latest${IMAGE_SUFFIX}"
            bash scripts/push-image-with-retry.sh "${DOCKERHUB_IMAGE}:latest${IMAGE_SUFFIX}"
          fi
