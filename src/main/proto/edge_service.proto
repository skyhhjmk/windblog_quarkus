syntax = "proto3";
package windblog.edge;

option java_multiple_files = false;
option java_package = "com.biliwind.blog.edge";
option java_outer_classname = "EdgeServiceProto";

service EdgeNodeService {

  // 从节点主动建立的双向持久通道。主节点通过该通道下发同步事件，
  // 从节点通过该通道上报心跳并转发需要写数据库的请求。
  rpc OpenNodeChannel(stream EdgeChannelMessage) returns (stream EdgeChannelMessage);

  // 心跳注册 + 状态上报 + 附带最新配置
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // 拉取最新存储权重配置表
  rpc GetStorageConfig(ConfigRequest) returns (StorageConfigResponse);

  // 回源查询单个媒体的完整元数据和存储状态
  rpc GetMediaMetadata(MediaQueryRequest) returns (MediaMetadataResponse);

  // 回源流式下载文件（用于边缘节点无缓存时的 fallback）
  rpc DownloadMedia(MediaDownloadRequest) returns (stream DownloadChunk);

  // 数据同步接口：主节点向从节点推送数据
  rpc SyncData(SyncDataRequest) returns (SyncDataResponse);

  // 主动轮询接口：主节点调用从节点，推送配置并获取状态
  rpc Poll(PollRequest) returns (PollResponse);
}

message SyncDataRequest {
  string action = 1; // UPSERT, DELETE
  string entity_type = 2; // POST, TAG
  string payload = 3; // JSON 格式的数据内容
  int64 entity_id = 4; // DELETE 可不带 payload，但必须带实体 id
  int64 entity_version = 5;
}

message SyncDataResponse {
  bool success = 1;
  string message = 2;
}

message PollRequest {
  string main_node_id = 1;
  StorageConfigResponse config = 2;
}

message PollResponse {
  string node_id = 1;
  string region = 2;
  map<string, string> metrics = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  string region = 2;
  int64 timestamp = 3;
  map<string, string> metrics = 4;
  int32 grpc_port = 5;
}

message HeartbeatResponse {
  bool accepted = 1;
  int32 heartbeat_interval_seconds = 2;
  StorageConfigResponse config = 3;
}

message ConfigRequest {
  string node_id = 1;
}

message StorageConfigResponse {
  repeated StorageNodeConfig nodes = 1;
  int64 config_version = 2;
}

message StorageNodeConfig {
  string name = 1;
  bool is_primary = 2;
  string role = 3;
  int32 priority = 4;
  string cdn_domain = 5;
  bool cdn_enabled = 6;
  repeated string supported_types = 7;
}

message MediaQueryRequest {
  string node_id = 1;
  int64 media_id = 2;
}

message MediaMetadataResponse {
  int64 media_id = 1;
  string storage_key = 2;
  string mime_type = 3;
  map<string, VariantInfo> variants = 4;
  int64 version = 5;
}

message VariantInfo {
  string best_url = 1;
  map<string, NodeVariantStatus> nodes = 2;
}

message NodeVariantStatus {
  string path = 1;
  string status = 2;
  int64 size = 3;
}

message MediaDownloadRequest {
  string node_id = 1;
  int64 media_id = 2;
  string provider_name = 3;
  string variant_type = 4;
}

message DownloadChunk {
  bytes data = 1;
  int64 offset = 2;
  bool is_last = 3;
}

message EdgeChannelMessage {
  string request_id = 1;
  string node_id = 2;
  int64 timestamp = 3;

  oneof payload {
    EdgeHeartbeatMessage heartbeat = 10;
    EdgeNodeStatusMessage node_status = 11;
    SyncDataRequest sync_data = 12;
    RoutedHttpRequest routed_http_request = 13;
    RoutedHttpResponse routed_http_response = 14;
    CertificateRenewalMessage certificate_renewal = 15;
    CertificateRenewalResult certificate_renewal_result = 16;
    CertificateActivationMessage certificate_activation = 17;
    LinkProbeRequest link_probe_request = 18;
    LinkProbeResponse link_probe_response = 19;
  }
}

message LinkProbeRequest {
  string url = 1;
  string site_url = 2;
}

message LinkProbeResponse {
  bool reachable = 1;
  int32 status_code = 2;
  int32 load_time_ms = 3;
  bool backlink_found = 4;
  string error_message = 5;
}

message CertificateRenewalMessage {
  string renewal_id = 1;
  string certificate_pem = 2;
  string private_key_pem = 3;
  string ca_certificate_pem = 4;
  string serial_number = 5;
  int64 expiry_epoch_seconds = 6;
}

message CertificateRenewalResult {
  string renewal_id = 1;
  bool success = 2;
  string message = 3;
}

message CertificateActivationMessage {
  string renewal_id = 1;
}

message EdgeHeartbeatMessage {
  string region = 1;
  map<string, string> metrics = 2;
  int32 grpc_port = 3;
  int64 last_sync_version = 4;
}

message EdgeNodeStatusMessage {
  bool primary_online = 1;
  bool read_only = 2;
  string message = 3;
}

message RoutedHttpRequest {
  string method = 1;
  string path = 2;
  string query = 3;
  map<string, string> headers = 4;
  bytes body = 5;
}

message RoutedHttpResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  string error_message = 4;
}
