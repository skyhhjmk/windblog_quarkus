    <h1>隐私政策</h1>
    <p>我们只在提供账号、评论、订阅和安全功能所必需的范围内处理个人信息。</p>
    <h2>收集的信息</h2>
    <p>注册时会保存用户名、邮箱和密码哈希。密码重置令牌只保存哈希值，并在使用或过期后失效。</p>
    <h2>邮件</h2>
    <p>邮箱验证、密码重置和您主动订阅的通知会通过站点配置的邮件服务发送。我们不会在页面或日志中展示密码和令牌。</p>
    <h2>您的权利</h2>
    <p>如需更正或删除账号信息，请通过站点公布的联系方式联系管理员。</p>
