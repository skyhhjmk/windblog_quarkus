<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1"
     data-page-title="{pageTitle}">
{#if pjaxRequest}
<template id="pjax-head-metadata">
{#include fragments/head-metadata.html /}
</template>
{/if}
    <div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / <a href="{languagePrefix}/tools" class="hover:text-accent transition-colors">tools</a> / curl-converter</div>

    <section class="space-y-8" id="curlConverterToolApp">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-border/60 pb-6">
            <div class="space-y-2">
                <div class="flex items-center gap-2">
                    <a href="{languagePrefix}/tools" class="text-xs font-mono text-meta hover:text-accent transition-colors flex items-center gap-1">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        <span>返回工具箱</span>
                    </a>
                    <span class="text-xs text-meta/40">•</span>
                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-accent/10 text-accent border border-accent/20">HTTP &amp; URL</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-main tracking-tight">cURL 转代码与 URL 参数拆解器</h1>
                <p class="text-body text-xs md:text-sm">将浏览器 Copy as cURL 命令一键转换为 fetch / Python / Java / Go 代码，同时可视化拆解与编辑 URL Query 参数。</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono">
                <button type="button" id="btnCurlSample" class="px-3 py-1.5 rounded-lg bg-input-bg border border-border text-meta hover:text-accent transition-colors">加载示例 cURL</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-card border border-border rounded-2xl p-5 space-y-3 flex flex-col">
                <div class="flex items-center justify-between text-xs font-mono">
                    <label for="curlInput" class="font-bold text-main">cURL 命令或 URL</label>
                    <span id="curlParsedMeta" class="text-accent">GET</span>
                </div>
                <textarea id="curlInput" rows="12" placeholder="粘贴 curl 'https://api.example.com/v1/items?page=1' -H 'Authorization: Bearer xxx' -d '{&quot;ok&quot;:true}'"
                          class="w-full flex-1 bg-input-bg border border-border rounded-xl p-3 text-main font-mono text-xs md:text-sm focus:border-accent outline-none resize-y"></textarea>
            </div>

            <div class="bg-card border border-border rounded-2xl p-5 space-y-3 flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-mono">
                    <div class="flex flex-wrap gap-1.5" id="curlTargetTabs">
                        <button type="button" data-curl-lang="fetch" class="px-2.5 py-1 rounded-lg bg-accent text-[var(--accent-foreground)] font-bold">JS fetch</button>
                        <button type="button" data-curl-lang="python" class="px-2.5 py-1 rounded-lg bg-input-bg border border-border text-meta hover:text-main">Python</button>
                        <button type="button" data-curl-lang="java" class="px-2.5 py-1 rounded-lg bg-input-bg border border-border text-meta hover:text-main">Java</button>
                        <button type="button" data-curl-lang="go" class="px-2.5 py-1 rounded-lg bg-input-bg border border-border text-meta hover:text-main">Go</button>
                    </div>
                    <button type="button" id="btnCopyCurlCode" class="px-2.5 py-1 rounded bg-input-bg border border-border text-meta hover:text-accent">
                        <i class="fa-regular fa-copy mr-1"></i>复制
                    </button>
                </div>
                <pre id="curlCodeOutput" class="flex-1 bg-input-bg border border-border rounded-xl p-3 text-xs font-mono text-accent overflow-x-auto whitespace-pre-wrap break-words min-h-[16rem]"></pre>
            </div>
        </div>

        <!-- URL Query 拆解编辑器 -->
        <div class="bg-card border border-border rounded-2xl p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-border/40 pb-3">
                <h3 class="text-xs font-mono font-bold text-main">URL 协议与 Query 参数可视化拆解</h3>
                <button type="button" id="btnAddUrlParam" class="px-3 py-1 rounded-lg bg-input-bg border border-border text-xs font-mono text-meta hover:text-accent self-start sm:self-auto">+ 新增参数</button>
            </div>
            <input id="urlInspectorInput" type="text" placeholder="https://www.geekcorelab.com/search?q=quarkus&lang=zh-cn"
                   class="w-full bg-input-bg border border-border rounded-xl px-3 py-2 text-xs md:text-sm font-mono text-main focus:border-accent outline-none" />
            <div id="urlPartsSummary" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs font-mono"></div>
            <div id="urlParamsList" class="space-y-2"></div>
        </div>
    </section>
</div>
