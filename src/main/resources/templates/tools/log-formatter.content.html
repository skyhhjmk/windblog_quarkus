<div id="pjax-content-root" data-page-robots="index,follow" data-seeray-layout-version="windblog-pjax-v1"
     data-page-title="{pageTitle}"
     data-page-description="{pageDescription}"
     data-page-keywords="{pageKeywords}">
    <div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / <a href="/tools" class="hover:text-accent transition-colors">tools</a> / log-formatter</div>

    <section class="space-y-8" id="logFormatterToolApp">
        <!-- 头部 -->
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-border/60 pb-6">
            <div class="space-y-2">
                <div class="flex items-center gap-2">
                    <a href="/tools" class="text-xs font-mono text-meta hover:text-accent transition-colors flex items-center gap-1">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        <span>返回工具箱</span>
                    </a>
                    <span class="text-xs text-meta/40">•</span>
                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-accent/10 text-accent border border-accent/20">LOG PARSER</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-main tracking-tight">
                    开发者日志高亮与结构化清洗工具
                </h1>
                <p class="text-body text-xs md:text-sm">
                    支持 JSON 结构化日志/NDJSON 展开格式化、Spring/Java 堆栈跟踪美化、Nginx 访问日志解构、级别着色 (ERROR/WARN/INFO) 与关键词瞬时过滤。
                </p>
            </div>
            <!-- 预设示例 -->
            <div class="flex flex-wrap gap-2 items-center text-xs">
                <span class="text-meta">填入示例:</span>
                <button type="button" class="btn-log-example px-2.5 py-1 rounded bg-card border border-border text-meta hover:text-accent font-mono" data-type="json">JSON日志</button>
                <button type="button" class="btn-log-example px-2.5 py-1 rounded bg-card border border-border text-meta hover:text-accent font-mono" data-type="stacktrace">Java堆栈异常</button>
                <button type="button" class="btn-log-example px-2.5 py-1 rounded bg-card border border-border text-meta hover:text-accent font-mono" data-type="nginx">Nginx访问日志</button>
            </div>
        </header>

        <!-- 工具操作栏 -->
        <div class="bg-card border border-border rounded-2xl p-4 md:p-5 flex flex-wrap items-center justify-between gap-4 text-xs font-mono">
            <div class="flex flex-wrap items-center gap-3">
                <button type="button" id="btnFormatLog" class="bg-accent text-[var(--accent-foreground)] font-bold py-1.5 px-4 rounded-lg hover:opacity-90 transition-all flex items-center gap-1.5 shadow-[0_0_12px_rgba(6,182,212,0.25)]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>美化与格式化</span>
                </button>
                <button type="button" id="btnClearLog" class="bg-input-bg border border-border text-meta hover:text-main py-1.5 px-3 rounded-lg transition-all">
                    清空
                </button>
                <div class="h-4 w-[1px] bg-border hidden sm:block"></div>
                <div class="flex items-center gap-2">
                    <span class="text-meta">日志级别过滤:</span>
                    <select id="logLevelFilter" class="bg-input-bg border border-border rounded-lg px-2.5 py-1 text-main outline-none focus:border-accent">
                        <option value="ALL">全部级别 (ALL)</option>
                        <option value="ERROR">仅看 ERROR / FATAL</option>
                        <option value="WARN">WARN 及以上</option>
                        <option value="INFO">INFO 及以上</option>
                    </select>
                </div>
            </div>

            <!-- 关键词高亮/过滤 -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input id="logKeywordSearch" type="text" placeholder="实时正则/关键词筛选..."
                       class="bg-input-bg border border-border rounded-lg px-3 py-1.5 text-main text-xs focus:border-accent outline-none w-full sm:w-56" />
                <button type="button" id="btnCopyLogResult" class="bg-input-bg border border-border hover:border-accent/40 text-meta hover:text-main py-1.5 px-3 rounded-lg transition-all" title="复制处理后的日志">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- 编辑与视图分栏 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 输入编辑区 -->
            <div class="bg-card border border-border rounded-2xl p-4 md:p-5 flex flex-col space-y-3">
                <div class="flex items-center justify-between text-xs font-mono text-meta">
                    <span>原始日志 (Raw Log Input)</span>
                    <span id="rawLogStats">0 行 · 0 字符</span>
                </div>
                <textarea id="rawLogTextarea" rows="18" placeholder="在此粘贴日志文本、JSON、Java Exception 堆栈跟踪或容器 stdout 输出..."
                          class="w-full flex-1 bg-input-bg border border-border rounded-xl p-3 text-main font-mono text-xs md:text-sm focus:border-accent outline-none leading-relaxed resize-y"></textarea>
            </div>

            <!-- 结构化高亮预览区 -->
            <div class="bg-card border border-border rounded-2xl p-4 md:p-5 flex flex-col space-y-3">
                <div class="flex items-center justify-between text-xs font-mono text-meta">
                    <div class="flex items-center gap-2">
                        <span>解析与着色视图</span>
                        <span id="logSummaryBadge" class="px-2 py-0.5 rounded bg-accent/10 text-accent text-[10px]">就绪</span>
                    </div>
                    <span id="formattedLogStats">显示 0 / 0 行</span>
                </div>
                <div id="logRenderContainer" class="w-full flex-1 min-h-[360px] max-h-[500px] overflow-y-auto bg-input-bg border border-border rounded-xl p-3 font-mono text-xs md:text-sm space-y-1 select-text">
                    <p class="text-meta/60 italic text-center py-12">在左侧粘贴日志或点击右上角示例体验...</p>
                </div>
            </div>
        </div>
    </section>
</div>
