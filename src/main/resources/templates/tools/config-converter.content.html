<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1"
     data-page-title="{pageTitle}">
{#if pjaxRequest}
<template id="pjax-head-metadata">
{#include fragments/head-metadata.html /}
</template>
{/if}
    <div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / <a href="{languagePrefix}/tools" class="hover:text-accent transition-colors">tools</a> / config-converter</div>

    <section class="space-y-8" id="configConverterToolApp">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-border/60 pb-6">
            <div class="space-y-2">
                <div class="flex items-center gap-2">
                    <a href="{languagePrefix}/tools" class="text-xs font-mono text-meta hover:text-accent transition-colors flex items-center gap-1">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                        <span>返回工具箱</span>
                    </a>
                    <span class="text-xs text-meta/40">•</span>
                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-accent/10 text-accent border border-accent/20">CONFIG TOOLS</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-main tracking-tight">YAML / JSON / Properties / .env 互转</h1>
                <p class="text-body text-xs md:text-sm">纯前端配置格式双向互转与语法校验，适配 Quarkus / Spring Boot <code class="text-accent">application.properties</code>、YAML、JSON 与 <code class="text-accent">.env</code>。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2 text-xs font-mono">
                <button type="button" id="btnConfigSample" class="px-3 py-1.5 rounded-lg bg-input-bg border border-border text-meta hover:text-accent transition-colors">加载示例</button>
                <button type="button" id="btnConfigSendToDiff" class="px-3 py-1.5 rounded-lg bg-input-bg border border-border text-meta hover:text-accent transition-colors">JSON → JSON Diff</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-card border border-border rounded-2xl p-5 space-y-3 flex flex-col">
                <div class="flex items-center justify-between gap-2 text-xs font-mono">
                    <span class="font-bold text-main">源格式 (Input)</span>
                    <select id="configSourceFormat" class="bg-input-bg border border-border rounded-lg px-2.5 py-1 text-main outline-none focus:border-accent">
                        <option value="yaml">YAML (.yml / .yaml)</option>
                        <option value="json">JSON (.json)</option>
                        <option value="properties">Properties (.properties)</option>
                        <option value="env">.env (KEY=VALUE)</option>
                    </select>
                </div>
                <textarea id="configInput" rows="16" placeholder="粘贴 YAML、JSON、application.properties 或 .env 内容..."
                          class="w-full flex-1 bg-input-bg border border-border rounded-xl p-3 text-main font-mono text-xs md:text-sm focus:border-accent outline-none resize-y"></textarea>
                <div id="configErrorMsg" class="hidden text-xs font-mono text-rose-400"></div>
            </div>

            <div class="bg-card border border-border rounded-2xl p-5 space-y-3 flex flex-col">
                <div class="flex items-center justify-between gap-2 text-xs font-mono">
                    <span class="font-bold text-main">目标格式 (Output)</span>
                    <div class="flex items-center gap-2">
                        <select id="configTargetFormat" class="bg-input-bg border border-border rounded-lg px-2.5 py-1 text-main outline-none focus:border-accent">
                            <option value="properties">Properties (.properties)</option>
                            <option value="yaml">YAML (.yml / .yaml)</option>
                            <option value="json">JSON (.json)</option>
                            <option value="env">.env (KEY=VALUE)</option>
                        </select>
                        <button type="button" id="btnCopyConfigOutput" class="px-2.5 py-1 rounded bg-input-bg border border-border text-meta hover:text-accent">
                            <i class="fa-regular fa-copy mr-1"></i>复制
                        </button>
                    </div>
                </div>
                <textarea id="configOutput" rows="16" readonly
                          class="w-full flex-1 bg-input-bg border border-border rounded-xl p-3 text-accent font-mono text-xs md:text-sm focus:border-accent outline-none resize-y"></textarea>
            </div>
        </div>
    </section>
</div>
