<div id="pjax-content-root" data-page-robots="index,follow" data-seeray-layout-version="windblog-pjax-v1"
     data-page-title="{pageTitle}"
     data-page-description="{pageDescription}"
     data-page-keywords="{pageKeywords}">
    <div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / tools</div>

    <section class="space-y-8 md:space-y-10">
        <!-- Header Section -->
        <header class="space-y-3 border-b border-border/60 pb-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 border border-accent/20 text-accent text-xs font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
                <i class="fa-solid fa-toolbox text-[11px]"></i>
                <span>{i18n.t('tools.badge')}</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-main tracking-tight">{i18n.t('tools.title')}</h1>
            <p class="text-body text-xs md:text-sm max-w-2xl leading-relaxed">
                {i18n.t('tools.desc')}
            </p>
        </header>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5 md:gap-6">
            {#for tool in tools}
            <a href="{languagePrefix}{tool.url}" class="group relative block p-5 sm:p-6 rounded-2xl bg-card border border-border hover:border-accent/40 hover:shadow-xl transition-all duration-300">
                <div class="flex items-start gap-4">
                    <div class="w-11 h-11 rounded-xl bg-input-bg border border-border/80 flex items-center justify-center text-accent text-lg shrink-0 group-hover:scale-105 group-hover:border-accent/40 group-hover:bg-accent/10 transition-all duration-300 shadow-sm">
                        <i class="{tool.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <h2 class="text-base font-bold text-main group-hover:text-accent transition-colors truncate">
                                {i18n.t(tool.nameKey)}
                            </h2>
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-accent/10 text-accent border border-accent/20 font-medium shrink-0">
                                {i18n.t(tool.tagKey)}
                            </span>
                        </div>
                        <p class="text-xs text-body line-clamp-2 leading-relaxed mb-4 font-normal">
                            {i18n.t(tool.descriptionKey)}
                        </p>
                        <div class="flex items-center text-xs font-semibold text-meta group-hover:text-accent gap-1.5 transition-colors">
                            <span>{i18n.t('tools.use')}</span>
                            <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </div>
                </div>
            </a>
            {/for}
        </div>
    </section>
</div>
