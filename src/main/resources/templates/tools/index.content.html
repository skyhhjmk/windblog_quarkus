<div id="pjax-content-root" data-page-robots="index,follow" data-seeray-layout-version="windblog-pjax-v1"
     data-page-title="{pageTitle}"
     data-page-description="{pageDescription}"
     data-page-keywords="{pageKeywords}">
    <div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / tools</div>

    <section class="space-y-10">
        <!-- Header Section -->
        <header class="space-y-4 text-center md:text-left border-b border-border/60 pb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 border border-accent/20 text-accent text-xs font-mono">
                <i class="fa-solid fa-toolbox"></i>
                <span>ONLINE TOOLS</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-main tracking-tight">常用在线工具箱</h1>
            <p class="text-body text-sm md:text-base max-w-2xl">
                为开发者、网络工程师及日常极客打造的高效纯前端/交互式工具集合。纯本地即时计算，数据不上传，安全高效。
            </p>
        </header>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
            {#for tool in tools}
            <a href="{tool.url}" class="group relative block p-6 rounded-2xl bg-card border border-border hover:border-accent/50 hover:shadow-xl transition-all duration-300">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 flex items-center justify-center text-accent text-xl group-hover:scale-110 group-hover:bg-accent group-hover:text-bg transition-all duration-300">
                        <i class="{tool.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <h2 class="text-lg font-bold text-main group-hover:text-accent transition-colors truncate">
                                {tool.name}
                            </h2>
                            <span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded bg-accent/10 text-accent border border-accent/20">
                                {tool.tag}
                            </span>
                        </div>
                        <p class="text-sm text-body line-clamp-3 leading-relaxed mb-4">
                            {tool.description}
                        </p>
                        <div class="flex items-center text-xs font-semibold text-accent gap-1 group-hover:translate-x-1 transition-transform">
                            <span>立即使用</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </div>
                    </div>
                </div>
            </a>
            {/for}
        </div>

        <!-- Future Tools Placeholder -->
        <div class="rounded-2xl border border-dashed border-border/70 p-8 text-center bg-card/30">
            <div class="w-10 h-10 mx-auto mb-3 rounded-full bg-border/40 flex items-center justify-center text-meta text-base">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h3 class="text-sm font-bold text-main mb-1">更多实用工具持续扩充中</h3>
            <p class="text-xs text-meta max-w-md mx-auto">
                后续将持续增加时间戳/Cron/正则调试、哈希加解密、JSON可视化对比等高频硬核工具。欢迎反馈所需工具！
            </p>
        </div>
    </section>
</div>
