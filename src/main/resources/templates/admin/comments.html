{#include admin/base.html}
    {#title}评论管理 - WindBlog 管理后台{/title}
    {#pageTitle}评论管理{/pageTitle}
    {#activePage}comments{/activePage}
    
    {#content}
        <div class="space-y-6">
            <div class="flex gap-4 items-center">
                <input type="text" id="searchInput" placeholder="搜索评论内容..." 
                    class="flex-1 max-w-md px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    oninput="searchComments()">
                <select id="statusFilter" onchange="loadComments()" 
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">全部状态</option>
                    <option value="pending">待审核</option>
                    <option value="approved">已通过</option>
                    <option value="rejected">已拒绝</option>
                </select>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">评论 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文章</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">评论者</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">内容</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="commentsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="7" class="px-6 py-4 text-center text-gray-500">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="flex justify-between items-center"></div>
        </div>
    {/content}
    
    {#scripts}
    <script src="/admin/assets/js/admin.js"></script>
    <script>
        let allComments = [];
        let filteredComments = [];
        let currentPage = 1;
        const pageSize = 10;

        async function loadComments() {
            try {
                const statusFilter = document.getElementById('statusFilter').value;
                let url = '/comments?page=' + currentPage + '&pageSize=' + pageSize;
                if (statusFilter) {
                    url += '&status=' + statusFilter;
                }
                
                const response = await AdminUtils.get(url);
                allComments = response.items || [];
                filteredComments = allComments;
                renderComments();
                renderPagination(response.total || 0);
            } catch (error) {
                console.error('加载评论失败:', error);
                document.getElementById('commentsTableBody').innerHTML = 
                    '<tr><td colspan="7" class="px-6 py-4 text-center text-red-500">加载失败</td></tr>';
            }
        }

        function searchComments() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                filteredComments = allComments;
            } else {
                filteredComments = allComments.filter(comment => 
                    (comment.content && comment.content.toLowerCase().includes(keyword)) ||
                    (comment.author && comment.author.toLowerCase().includes(keyword))
                );
            }
            currentPage = 1;
            renderComments();
        }

        function renderComments() {
            const tbody = document.getElementById('commentsTableBody');
            if (filteredComments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无评论</td></tr>';
                return;
            }

            tbody.innerHTML = filteredComments.map(comment => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">#` + comment.id + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">` + escapeHtml(comment.postTitle || '-') + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ` + escapeHtml(comment.author || '匿名') + `
                        <div class="text-xs text-gray-500">` + (comment.email || '-') + `</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">` + escapeHtml(comment.content || '') + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 py-1 rounded-full text-xs ` + getStatusClass(comment.status) + `">` + getStatusText(comment.status) + `</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + formatDate(comment.createTime) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        ` + getActionButtons(comment) + `
                    </td>
                </tr>
            `).join('');
        }

        function getActionButtons(comment) {
            let buttons = '';
            if (comment.status === 'pending') {
                buttons += '<button onclick="approveComment(' + comment.id + ')" class="text-green-600 hover:text-green-900 mr-3">通过</button>';
                buttons += '<button onclick="rejectComment(' + comment.id + ')" class="text-yellow-600 hover:text-yellow-900 mr-3">拒绝</button>';
            }
            buttons += '<button onclick="deleteComment(' + comment.id + ')" class="text-red-600 hover:text-red-900">删除</button>';
            return buttons;
        }

        function getStatusClass(status) {
            switch(status) {
                case 'approved': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function getStatusText(status) {
            switch(status) {
                case 'approved': return '已通过';
                case 'rejected': return '已拒绝';
                case 'pending': return '待审核';
                default: return status;
            }
        }

        async function approveComment(id) {
            try {
                await AdminUtils.request('/comments/' + id + '/approve', { method: 'POST' });
                alert('评论已通过');
                loadComments();
            } catch (error) {
                alert('操作失败：' + (error.message || '未知错误'));
            }
        }

        async function rejectComment(id) {
            try {
                await AdminUtils.request('/comments/' + id + '/reject', { method: 'POST' });
                alert('评论已拒绝');
                loadComments();
            } catch (error) {
                alert('操作失败：' + (error.message || '未知错误'));
            }
        }

        async function deleteComment(id) {
            if (!confirm('确定要删除此评论吗？')) return;

            try {
                await AdminUtils.request('/comments/' + id, { method: 'DELETE' });
                alert('评论删除成功');
                loadComments();
            } catch (error) {
                alert('删除失败：' + (error.message || '未知错误'));
            }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '<span class="text-sm text-gray-700">共 ' + total + ' 条记录</span>';
            html += '<div class="flex gap-2">';
            
            if (currentPage > 1) {
                html += '<button onclick="changePage(' + (currentPage - 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>';
            }
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += '<button class="px-3 py-1 border rounded bg-blue-600 text-white">' + i + '</button>';
                } else {
                    html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 border rounded hover:bg-gray-50">' + i + '</button>';
                }
            }
            
            if (currentPage < totalPages) {
                html += '<button onclick="changePage(' + (currentPage + 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>';
            }
            
            html += '</div>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadComments();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        async function initPage() {
            await loadComments();
        }
    </script>
    {/scripts}
{/include}
