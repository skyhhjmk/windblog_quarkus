{#include admin/base.html}
    {#title}标签管理 - WindBlog 管理后台{/title}
    {#pageTitle}标签管理{/pageTitle}
    {#activePage}tags{/activePage}
    
    {#content}
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <button onclick="createTag()" class="btn-primary px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新建标签
                </button>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">标签 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">别名</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文章数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tagsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="px-6 py-4 text-center text-gray-500">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    {/content}
    
    {#scripts}
    <script src="/admin/assets/js/admin.js"></script>
    <script>
        let allTags = [];

        async function loadTags() {
            try {
                const response = await AdminUtils.get('/tags');
                allTags = response.data || [];
                renderTags();
            } catch (error) {
                console.error('加载标签失败:', error);
                document.getElementById('tagsTableBody').innerHTML = 
                    '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">加载失败</td></tr>';
            }
        }

        function renderTags() {
            const tbody = document.getElementById('tagsTableBody');
            if (allTags.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">暂无标签</td></tr>';
                return;
            }

            tbody.innerHTML = allTags.map(tag => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">#` + tag.id + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">` + escapeHtml(tag.name) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + (tag.slug || '-') + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + (tag.postCount || 0) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + formatDate(tag.createTime) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="editTag(` + tag.id + `)" class="text-blue-600 hover:text-blue-900 mr-3">编辑</button>
                        <button onclick="deleteTag(` + tag.id + `)" class="text-red-600 hover:text-red-900">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function createTag() {
            const name = prompt('请输入标签名称:');
            if (!name || !name.trim()) return;

            try {
                await AdminUtils.request('/tags', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.trim() })
                });
                alert('标签创建成功');
                loadTags();
            } catch (error) {
                alert('创建失败：' + (error.message || '未知错误'));
            }
        }

        async function editTag(id) {
            const tag = allTags.find(t => t.id === id);
            if (!tag) return;

            const name = prompt('编辑标签名称:', tag.name);
            if (!name || !name.trim()) return;

            try {
                await AdminUtils.request('/tags/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.trim() })
                });
                alert('标签更新成功');
                loadTags();
            } catch (error) {
                alert('更新失败：' + (error.message || '未知错误'));
            }
        }

        async function deleteTag(id) {
            if (!confirm('确定要删除此标签吗？')) return;

            try {
                await AdminUtils.request('/tags/' + id, { method: 'DELETE' });
                alert('标签删除成功');
                loadTags();
            } catch (error) {
                alert('删除失败：' + (error.message || '未知错误'));
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        async function initPage() {
            await loadTags();
        }
    </script>
    {/scripts}
{/include}
