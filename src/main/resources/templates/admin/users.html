{#include admin/base.html}
    {#title}用户管理 - WindBlog 管理后台{/title}
    {#pageTitle}用户管理{/pageTitle}
    {#activePage}users{/activePage}
    
    {#content}
        <div class="space-y-6">
            <div class="flex gap-4 items-center">
                <input type="text" id="searchInput" placeholder="搜索用户名或邮箱..." 
                    class="flex-1 max-w-md px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    oninput="searchUsers()">
                <select id="roleFilter" onchange="loadUsers()" 
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">全部角色</option>
                    <option value="ADMIN">管理员</option>
                    <option value="USER">普通用户</option>
                </select>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户名</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">邮箱</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">角色</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">注册时间</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="7" class="px-6 py-4 text-center text-gray-500">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="flex justify-between items-center"></div>
        </div>
    {/content}
    
    {#scripts}
    <script src="/admin/assets/js/admin.js"></script>
    <script>
        let allUsers = [];
        let filteredUsers = [];
        let currentPage = 1;
        const pageSize = 10;

        async function loadUsers() {
            try {
                const response = await AdminUtils.get('/users?page=' + currentPage + '&pageSize=' + pageSize);
                allUsers = response.items || [];
                filteredUsers = allUsers;
                renderUsers();
                renderPagination(response.total || 0);
            } catch (error) {
                console.error('加载用户失败:', error);
                document.getElementById('usersTableBody').innerHTML = 
                    '<tr><td colspan="7" class="px-6 py-4 text-center text-red-500">加载失败</td></tr>';
            }
        }

        function searchUsers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                filteredUsers = allUsers;
            } else {
                filteredUsers = allUsers.filter(user => 
                    (user.username && user.username.toLowerCase().includes(keyword)) ||
                    (user.email && user.email.toLowerCase().includes(keyword))
                );
            }
            currentPage = 1;
            renderUsers();
        }

        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            if (filteredUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无用户</td></tr>';
                return;
            }

            tbody.innerHTML = filteredUsers.map(user => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">#` + user.id + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">` + escapeHtml(user.username) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + escapeHtml(user.email) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 py-1 rounded-full text-xs ` + getRoleClass(user.roleName) + `">` + getRoleText(user.roleName) + `</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 py-1 rounded-full text-xs ` + getStatusClass(user.status) + `">` + getStatusText(user.status) + `</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">` + formatDate(user.createdAt) + `</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="changeRole(` + user.id + `)" class="text-blue-600 hover:text-blue-900 mr-3">修改角色</button>
                        <button onclick="deleteUser(` + user.id + `)" class="text-red-600 hover:text-red-900">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function getRoleClass(roleName) {
            return roleName && roleName.toUpperCase() === 'ADMIN' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800';
        }

        function getRoleText(roleName) {
            return roleName && roleName.toUpperCase() === 'ADMIN' ? '管理员' : '普通用户';
        }

        function getStatusClass(status) {
            return status === 1 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
        }

        function getStatusText(status) {
            return status === 1 ? '正常' : '禁用';
        }

        async function changeRole(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const newRole = prompt('请输入新角色 (ADMIN 或 USER):', user.roleName);
            if (!newRole || !['ADMIN', 'USER'].includes(newRole.toUpperCase())) {
                alert('无效的角色');
                return;
            }

            try {
                await AdminUtils.request('/users/' + userId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole.toUpperCase() })
                });
                alert('用户角色更新成功');
                loadUsers();
            } catch (error) {
                alert('更新失败：' + (error.message || '未知错误'));
            }
        }

        async function deleteUser(id) {
            if (!confirm('确定要删除此用户吗？此操作不可恢复！')) return;

            try {
                await AdminUtils.request('/users/' + id, { method: 'DELETE' });
                alert('用户删除成功');
                loadUsers();
            } catch (error) {
                alert('删除失败：' + (error.message || '未知错误'));
            }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '<span class="text-sm text-gray-700">共 ' + total + ' 条记录</span>';
            html += '<div class="flex gap-2">';
            
            if (currentPage > 1) {
                html += '<button onclick="changePage(' + (currentPage - 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>';
            }
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += '<button class="px-3 py-1 border rounded bg-blue-600 text-white">' + i + '</button>';
                } else {
                    html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 border rounded hover:bg-gray-50">' + i + '</button>';
                }
            }
            
            if (currentPage < totalPages) {
                html += '<button onclick="changePage(' + (currentPage + 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>';
            }
            
            html += '</div>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadUsers();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        async function initPage() {
            await loadUsers();
        }
    </script>
    {/scripts}
{/include}
