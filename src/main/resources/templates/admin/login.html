<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-lg shadow-md p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">WindBlog</h1>
                <p class="text-gray-600 mt-2">管理后台</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="account" class="block text-sm font-medium text-gray-700 mb-2">
                        账号（用户名或邮箱）
                    </label>
                    <input
                        type="text"
                        id="account"
                        name="account"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="请输入账号"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        密码
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="请输入密码"
                    >
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
                    <p class="text-sm"></p>
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    登录
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/" class="text-sm text-gray-600 hover:text-gray-800">
                    &larr; 返回博客首页
                </a>
            </div>
        </div>
    </div>

    <script>
        // 登录表单处理
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const account = document.getElementById('account').value.trim();
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('submitBtn');
                const errorMessage = document.getElementById('errorMessage');
                
                console.log('开始登录，账号:', account);
                
                submitBtn.disabled = true;
                submitBtn.textContent = '登录中...';
                errorMessage.classList.add('hidden');
                
                try {
                    const url = '/api/admin/auth/login';
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ account, password })
                    });
                    
                    console.log('响应状态:', response.status, response.ok);
                    
                    // 先读取文本
                    const responseText = await response.text();
                    console.log('原始响应:', responseText);
                    
                    // 检查响应状态
                    if (!response.ok) {
                        throw new Error('登录失败，HTTP 状态码：' + response.status);
                    }
                    
                    // 解析 JSON
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (parseError) {
                        console.error('JSON 解析失败:', parseError);
                        throw new Error('服务器返回了无效的数据格式');
                    }
                    
                    console.log('解析后的数据:', data);
                    
                    // 检查返回的数据
                    if (!data || !data.token) {
                        console.error('响应数据异常:', data);
                        throw new Error('服务器返回的数据格式不正确');
                    }
                    
                    console.log('登录成功，准备跳转');
                    
                    // 登录成功，保存 token 到 localStorage 和 cookie
                    localStorage.setItem('admin_token', data.token);
                    const tokenValue = data.token;
                    document.cookie = 'admin_token=' + tokenValue + '; path=/; max-age=86400; SameSite=Strict';
                    
                    // 等待一小段时间确保 storage 和 cookie 已保存
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                    console.log('token 已保存，跳转到管理后台');
                    window.location.href = '/admin/';
                } catch (error) {
                    console.error('登录失败:', error);
                    errorMessage.querySelector('p').textContent = error.message || '登录失败，请重试';
                    errorMessage.classList.remove('hidden');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登录';
                }
            });
        });
    </script>
</body>
</html>
