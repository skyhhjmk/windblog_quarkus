{#include admin/base.html}
    {#title}分类管理 - WindBlog 管理后台{/title}
    {#pageTitle}分类管理{/pageTitle}
    {#activePage}categories{/activePage}
    
    {#content}
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-800">分类列表</h3>
                <button onclick="createCategory()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                    新建分类
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">描述</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文章数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    {/content}
    
    {#scripts}
    <script>
        async function initPage() {
            await loadCategories();
        }
        
        async function loadCategories() {
            try {
                const categories = await AdminUtils.get('/categories');
                
                const tbody = document.getElementById('categoriesTableBody');
                tbody.innerHTML = '';
                
                if (categories && categories.length > 0) {
                    categories.forEach(cat => {
                        const row = createCategoryRow(cat);
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">暂无分类</td></tr>';
                }
            } catch (error) {
                console.error('加载分类失败:', error);
                AdminUtils.showToast('加载分类失败', 'error');
            }
        }
        
        function createCategoryRow(cat) {
            const row = document.createElement('tr');
            row.innerHTML = 
                '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + cat.id + '</td>' +
                '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">' + cat.name + '</td>' +
                '<td class="px-6 py-4 text-sm text-gray-500">' + (cat.description || '-') + '</td>' +
                '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + (cat.postCount || 0) + '</td>' +
                '<td class="px-6 py-4 whitespace-nowrap text-sm font-medium">' +
                    '<button onclick="editCategory(' + cat.id + ')" class="text-blue-600 hover:text-blue-900 mr-3">编辑</button>' +
                    '<button onclick="deleteCategory(' + cat.id + ')" class="text-red-600 hover:text-red-900">删除</button>' +
                '</td>';
            return row;
        }
        
        function createCategory() {
            const name = prompt('请输入分类名称:');
            if (!name) return;
            
            AdminUtils.post('/categories', { name })
                .then(() => {
                    AdminUtils.showToast('创建成功', 'success');
                    loadCategories();
                })
                .catch(err => {
                    AdminUtils.showToast('创建失败', 'error');
                });
        }
        
        function editCategory(id) {
            AdminUtils.showToast('分类编辑功能正在开发中', 'info');
        }
        
        async function deleteCategory(id) {
            const confirmed = await Modal.confirm('确定要删除这个分类吗？');
            if (!confirmed) return;
            
            try {
                await AdminUtils.delete('/categories/' + id);
                AdminUtils.showToast('删除成功', 'success');
                await loadCategories();
            } catch (error) {
                console.error('删除失败:', error);
                AdminUtils.showToast('删除失败', 'error');
            }
        }
    </script>
    {/scripts}
{/include}
