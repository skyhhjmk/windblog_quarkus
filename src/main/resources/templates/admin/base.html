<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#insert title}WindBlog 管理后台{/insert}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-gray-800 text-white flex-shrink-0">
            <div class="p-4">
                <h1 class="text-2xl font-bold">WindBlog</h1>
                <p class="text-gray-400 text-sm mt-1">管理后台</p>
            </div>
            
            <nav class="mt-6">
                <a href="/admin/dashboard" id="dashboard-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="dashboard">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    概览
                </a>
                
                <a href="/admin/posts" id="posts-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="posts">
                    文章管理
                </a>
                
                <a href="/admin/categories" id="categories-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="categories">
                    分类管理
                </a>
                
                <a href="/admin/tags" id="tags-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="tags">
                    标签管理
                </a>
                
                <a href="/admin/comments" id="comments-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="comments">
                    评论管理
                </a>
                
                <a href="/admin/users" id="users-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="users">
                    用户管理
                </a>
                
                <a href="/admin/media" id="media-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="media">
                    媒体库
                </a>
                
                <a href="/admin/queues" id="queues-nav" 
                   class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition"
                   data-page="queues">
                    队列管理
                </a>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">{#insert pageTitle}页面标题{/insert}</h2>
                    
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold">{userAvatar}</div>
                            <span id="userName" class="text-gray-700">{userName}</span>
                        </div>
                        
                        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-6">
                {#insert content}
                    <p>内容区域</p>
                {/insert}
            </main>
        </div>
    </div>
    
    <!-- 全局 JS -->
    <script src="/admin/assets/js/admin.js"></script>
    <script>
        // 页面加载时的通用初始化
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('base.html 初始化开始');
            console.log('localStorage token:', localStorage.getItem('admin_token'));
            
            // 设置当前激活的导航项
            const currentPage = '{activePage}';
            if (currentPage && currentPage !== '') {
                const activeNav = document.getElementById(currentPage + '-nav');
                if (activeNav) {
                    activeNav.classList.remove('text-gray-300', 'hover:bg-gray-700', 'hover:text-white');
                    activeNav.classList.add('bg-gray-700', 'text-white');
                }
            }
            
            // 验证登录状态
            console.log('开始验证登录状态...');
            const isAuth = await AdminUtils.checkAuth();
            console.log('验证结果:', isAuth);
            if (!isAuth) {
                console.log('未授权，已跳转到登录页');
                return;
            }
            
            // 加载用户信息（如果模板中未提供）
            const userName = '{userName}';
            console.log('模板中的用户名:', userName);
            if (!userName || userName === '') {
                try {
                    console.log('从 API 加载用户信息...');
                    const user = await AdminUtils.get('/auth/me');
                    console.log('用户信息:', user);
                    if (user.user) {
                        document.getElementById('userName').textContent = user.user.username;
                        const firstLetter = user.user.username.charAt(0).toUpperCase();
                        document.getElementById('userAvatar').textContent = firstLetter;
                    }
                } catch (error) {
                    console.error('加载用户信息失败:', error);
                }
            }
            
            // 登出功能
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                const confirmed = await Modal.confirm('确定要退出登录吗？');
                if (confirmed) {
                    await AdminUtils.logout();
                }
            });
            
            // 页面特定的初始化（由子模板实现）
            if (typeof initPage === 'function') {
                await initPage();
            }
        });
    </script>
    
    {#insert scripts}{/insert}
</body>
</html>
