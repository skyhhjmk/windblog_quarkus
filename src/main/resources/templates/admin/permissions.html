{#include admin/base.html}
    {#title}权限管理 - WindBlog 管理后台{/title}
    {#pageTitle}权限管理{/pageTitle}
    {#activePage}permissions{/activePage}

    {#content}
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">角色列表</h3>
                <button onclick="showCreateRoleDialog()"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新建角色
                </button>
            </div>

            <div id="rolesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-center text-gray-500 col-span-full py-8">加载中...</div>
            </div>
        </div>

        <!-- 创建/编辑角色模态框 -->
        <div id="roleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">新建角色</h3>
                </div>
                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">角色名称</label>
                        <input type="text" id="roleName" placeholder="如: EDITOR"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">显示名称</label>
                        <input type="text" id="roleDisplayName" placeholder="如: 编辑者"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                        <textarea id="roleDescription" rows="2" placeholder="角色描述..."
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">允许的 MIME 类型（逗号分隔）</label>
                        <input type="text" id="roleMimeTypes" placeholder="如: image/jpeg, image/png"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">单文件最大大小（字节）</label>
                            <input type="number" id="roleMaxSingle" placeholder="如: 10485760"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">总最大大小（字节）</label>
                            <input type="number" id="roleMaxTotal" placeholder="如: 104857600"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="roleCanUpload"
                               class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="roleCanUpload" class="ml-2 text-sm text-gray-700">允许上传文件</label>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                    <button onclick="closeRoleModal()"
                            class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">取消
                    </button>
                    <button onclick="saveRole()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">保存
                    </button>
                </div>
            </div>
        </div>
    {/content}

    {#scripts}
        <script src="/admin/assets/js/admin.js"></script>
        <script>
            let roles = [];
            let editingRole = null;
            const defaultRoles = ['SUPER_ADMIN', 'ADMIN', 'USER', 'GUEST'];

            async function loadRoles() {
                try {
                    const response = await AdminUtils.get('/permissions/roles');
                    roles = response.data || [];
                    renderRoles();
                } catch (error) {
                    console.error('加载角色失败:', error);
                    document.getElementById('rolesContainer').innerHTML =
                        '<div class="text-center text-red-500 col-span-full py-8">加载失败: ' + (error.message || '未知错误') + '</div>';
                }
            }

            function renderRoles() {
                const container = document.getElementById('rolesContainer');
                if (roles.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 col-span-full py-8">暂无角色</div>';
                    return;
                }

                container.innerHTML = roles.map(role => {
                    const isDefault = defaultRoles.includes(role.name);
                    const actionHtml = isDefault
                        ? '<span class="text-gray-400 text-sm">默认角色</span>'
                        : '<button onclick="deleteRole(\'' + escapeHtml(role.name) + '\')" class="text-red-600 hover:text-red-800 text-sm">删除</button>';

                    return `
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="font-semibold text-gray-800">${escapeHtml(role.displayName || role.name)}</h4>
                            <span class="text-xs text-gray-500">${escapeHtml(role.name)}</span>
                        </div>
                        ${role.canUpload ? '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded">可上传</span>' : ''}
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${escapeHtml(role.description || '无描述')}</p>
                    <div class="text-xs text-gray-500 mb-3">
                        <div>允许类型: ${role.allowedMimeTypes && role.allowedMimeTypes.length > 0 ? escapeHtml(role.allowedMimeTypes.join(', ')) : '无限制'}</div>
                        <div>单文件限制: ${role.maxSingleUploadBytes ? formatBytes(role.maxSingleUploadBytes) : '无限制'}</div>
                        <div>总限制: ${role.maxTotalUploadBytes ? formatBytes(role.maxTotalUploadBytes) : '无限制'}</div>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button onclick="editRole('${escapeHtml(role.name)}')" class="text-blue-600 hover:text-blue-800 text-sm">编辑</button>
                        ${actionHtml}
                    </div>
                </div>
            `
                }).join('');
            }

            function showCreateRoleDialog() {
                editingRole = null;
                document.getElementById('modalTitle').textContent = '新建角色';
                document.getElementById('roleName').value = '';
                document.getElementById('roleName').disabled = false;
                document.getElementById('roleDisplayName').value = '';
                document.getElementById('roleDescription').value = '';
                document.getElementById('roleMimeTypes').value = '';
                document.getElementById('roleMaxSingle').value = '';
                document.getElementById('roleMaxTotal').value = '';
                document.getElementById('roleCanUpload').checked = false;
                document.getElementById('roleModal').classList.remove('hidden');
            }

            async function editRole(name) {
                const role = roles.find(r => r.name === name);
                if (!role) return;

                editingRole = role;
                document.getElementById('modalTitle').textContent = '编辑角色';
                document.getElementById('roleName').value = role.name;
                document.getElementById('roleName').disabled = true;
                document.getElementById('roleDisplayName').value = role.displayName || '';
                document.getElementById('roleDescription').value = role.description || '';
                document.getElementById('roleMimeTypes').value = (role.allowedMimeTypes || []).join(', ');
                document.getElementById('roleMaxSingle').value = role.maxSingleUploadBytes || '';
                document.getElementById('roleMaxTotal').value = role.maxTotalUploadBytes || '';
                document.getElementById('roleCanUpload').checked = role.canUpload || false;
                document.getElementById('roleModal').classList.remove('hidden');
            }

            function closeRoleModal() {
                document.getElementById('roleModal').classList.add('hidden');
                editingRole = null;
            }

            async function saveRole() {
                const name = document.getElementById('roleName').value.trim();
                const displayName = document.getElementById('roleDisplayName').value.trim();
                const description = document.getElementById('roleDescription').value.trim();
                const mimeTypesStr = document.getElementById('roleMimeTypes').value.trim();
                const maxSingle = document.getElementById('roleMaxSingle').value.trim();
                const maxTotal = document.getElementById('roleMaxTotal').value.trim();
                const canUpload = document.getElementById('roleCanUpload').checked;

                if (!name) {
                    alert('请输入角色名称');
                    return;
                }

                const requestBody = {
                    displayName: displayName,
                    description: description,
                    canUpload: canUpload,
                    allowedMimeTypes: mimeTypesStr ? mimeTypesStr.split(',').map(s => s.trim()).filter(s => s) : [],
                    maxSingleUploadBytes: maxSingle ? parseInt(maxSingle) : null,
                    maxTotalUploadBytes: maxTotal ? parseInt(maxTotal) : null
                };

                if (!editingRole) {
                    requestBody.name = name;
                }

                try {
                    if (editingRole) {
                        await AdminUtils.request('/permissions/roles/' + encodeURIComponent(editingRole.name), {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(requestBody)
                        });
                    } else {
                        await AdminUtils.request('/permissions/roles', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(requestBody)
                        });
                    }
                    alert(editingRole ? '角色更新成功' : '角色创建成功');
                    closeRoleModal();
                    loadRoles();
                } catch (error) {
                    alert('保存失败: ' + (error.message || '未知错误'));
                }
            }

            async function deleteRole(name) {
                if (!confirm('确定要删除角色 "' + name + '" 吗？')) return;

                try {
                    await AdminUtils.request('/permissions/roles/' + encodeURIComponent(name), {method: 'DELETE'});
                    alert('角色删除成功');
                    loadRoles();
                } catch (error) {
                    alert('删除失败: ' + (error.message || '未知错误'));
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatBytes(bytes) {
                if (!bytes) return '-';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
                return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
            }

            async function initPage() {
                await loadRoles();
            }
        </script>
    {/scripts}
{/include}
