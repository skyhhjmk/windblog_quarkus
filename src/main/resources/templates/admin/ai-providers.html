{#include admin/base.html}
{#title}AI 配置 - WindBlog 管理后台{/title}
{#pageTitle}AI 配置{/pageTitle}
{#activePage}ai-providers{/activePage}

{#content}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">AI 服务商配置</h3>
        <p class="text-sm text-gray-600 mb-6">配置 AI 服务商的端点、模型和 API Key。启用状态决定是否使用该服务商。</p>

        <div id="providersContainer" class="space-y-6">
            <div class="text-center text-gray-500 py-8">加载中...</div>
        </div>
    </div>
</div>
{/content}

{#scripts}
<script src="/admin/assets/js/admin.js"></script>
<script>
    let providers = [];

    async function loadProviders() {
        try {
            const response = await AdminUtils.get('/ai/providers');
            providers = response.data || [];
            renderProviders();
        } catch (error) {
            console.error('加载 AI 配置失败:', error);
            document.getElementById('providersContainer').innerHTML =
                '<div class="text-center text-red-500 py-8">加载失败: ' + (error.message || '未知错误') + '</div>';
        }
    }

    function renderProviders() {
        const container = document.getElementById('providersContainer');
        if (providers.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无 AI 配置</div>';
            return;
        }

        container.innerHTML = providers.map(provider => `
                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <h4 class="font-semibold text-gray-800">${escapeHtml(provider.provider)}</h4>
                            <span class="px-2 py-1 text-xs rounded ${provider.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}">
                                ${provider.enabled ? '已启用' : '已禁用'}
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-sm text-gray-600">启用</label>
                            <input type="checkbox" id="enabled-${escapeHtml(provider.provider)}"
                                ${provider.enabled ? 'checked' : ''}
                                onchange="updateProvider('${escapeHtml(provider.provider)}', 'enabled', this.checked)"
                                class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        </div>
                    </div>

                    ${provider.updatedAt ? '<p class="text-xs text-gray-500 mb-4">最后更新: ' + formatDate(provider.updatedAt) + '</p>' : ''}

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">端点 URL</label>
                            <input type="text" id="endpoint-${escapeHtml(provider.provider)}"
                                value="${escapeHtml(provider.endpoint || '')}"
                                placeholder="https://api.example.com/v1/chat/completions"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">模型名称</label>
                            <input type="text" id="model-${escapeHtml(provider.provider)}"
                                value="${escapeHtml(provider.model || '')}"
                                placeholder="gpt-4o-mini"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                            <div class="relative">
                                <input type="password" id="apiKey-${escapeHtml(provider.provider)}"
                                    value="${escapeHtml(provider.apiKey || '')}"
                                    placeholder="sk-..."
                                    class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <button type="button" onclick="toggleApiKeyVisibility('${escapeHtml(provider.provider)}')"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                    <svg id="eye-icon-${escapeHtml(provider.provider)}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button onclick="saveProvider('${escapeHtml(provider.provider)}')"
                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                                保存配置
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    function toggleApiKeyVisibility(provider) {
        const input = document.getElementById('apiKey-' + provider);
        const icon = document.getElementById('eye-icon-' + provider);
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
        } else {
            input.type = 'password';
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        }
    }

    async function updateProvider(provider, field, value) {
        try {
            const endpoint = document.getElementById('endpoint-' + provider).value.trim();
            const model = document.getElementById('model-' + provider).value.trim();
            const apiKey = document.getElementById('apiKey-' + provider).value.trim();

            await AdminUtils.request('/ai/providers/' + encodeURIComponent(provider), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    enabled: field === 'enabled' ? value : document.getElementById('enabled-' + provider).checked,
                    endpoint: endpoint,
                    model: model,
                    apiKey: apiKey
                })
            });
            AdminUtils.showToast('配置已更新', 'success');
            loadProviders();
        } catch (error) {
            console.error('更新配置失败:', error);
            AdminUtils.showToast('更新失败: ' + (error.message || '未知错误'), 'error');
            loadProviders();
        }
    }

    async function saveProvider(provider) {
        const endpoint = document.getElementById('endpoint-' + provider).value.trim();
        const model = document.getElementById('model-' + provider).value.trim();
        const apiKey = document.getElementById('apiKey-' + provider).value.trim();
        const enabled = document.getElementById('enabled-' + provider).checked;

        try {
            await AdminUtils.request('/ai/providers/' + encodeURIComponent(provider), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    enabled: enabled,
                    endpoint: endpoint,
                    model: model,
                    apiKey: apiKey
                })
            });
            AdminUtils.showToast('配置已保存', 'success');
            loadProviders();
        } catch (error) {
            console.error('保存配置失败:', error);
            AdminUtils.showToast('保存失败: ' + (error.message || '未知错误'), 'error');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleString('zh-CN');
    }

    async function initPage() {
        await loadProviders();
    }
</script>
{/scripts}
{/include}
