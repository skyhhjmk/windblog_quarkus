{#include admin/base.html}
    {#title}媒体库 - WindBlog 管理后台{/title}
    {#pageTitle}媒体库{/pageTitle}
    {#activePage}media{/activePage}
    
    {#content}
        <div class="space-y-6">
            <div class="flex justify-between items-center">
                <div class="flex gap-4 items-center">
                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadFile()">
                    <button onclick="document.getElementById('fileInput').click()" 
                        class="btn-primary px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition-colors flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        上传文件
                    </button>
                    <div id="uploadProgress" class="hidden">
                        <div class="w-64 bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                
                <select id="typeFilter" onchange="loadMedia()" 
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">全部类型</option>
                    <option value="image">图片</option>
                    <option value="video">视频</option>
                    <option value="audio">音频</option>
                    <option value="document">文档</option>
                </select>
            </div>

            <div id="mediaGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
                <div class="col-span-full text-center py-12 text-gray-500">加载中...</div>
            </div>

            <div id="pagination" class="flex justify-between items-center"></div>
        </div>
    {/content}
    
    {#scripts}
    <script src="/admin/assets/js/admin.js"></script>
    <script>
        let allMedia = [];
        let currentPage = 1;
        const pageSize = 12;

        async function loadMedia() {
            try {
                const typeFilter = document.getElementById('typeFilter').value;
                let url = '/media?page=' + currentPage + '&pageSize=' + pageSize;
                if (typeFilter) {
                    url += '&type=' + typeFilter;
                }
                
                const response = await AdminUtils.get(url);
                allMedia = response.data || [];
                renderMedia();
                renderPagination(response.total || 0);
            } catch (error) {
                console.error('加载媒体失败:', error);
                document.getElementById('mediaGrid').innerHTML = 
                    '<div class="col-span-full text-center py-12 text-red-500">加载失败</div>';
            }
        }

        function renderMedia() {
            const grid = document.getElementById('mediaGrid');
            if (allMedia.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">暂无媒体文件</div>';
                return;
            }

            grid.innerHTML = allMedia.map(item => `
                <div class="bg-white rounded-lg shadow overflow-hidden group relative">
                    <div class="aspect-square bg-gray-100 flex items-center justify-center overflow-hidden">
                        ` + getMediaPreview(item) + `
                    </div>
                    <div class="p-3">
                        <div class="text-sm font-medium text-gray-900 truncate" title="` + escapeHtml(item.filename) + `">` + escapeHtml(item.filename) + `</div>
                        <div class="text-xs text-gray-500 mt-1">` + formatFileSize(item.size) + `</div>
                        <div class="text-xs text-gray-400 mt-1">` + formatDate(item.uploadTime) + `</div>
                    </div>
                    <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="deleteMedia(` + item.id + `)" class="bg-red-600 text-white p-2 rounded-full hover:bg-red-700 shadow-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getMediaPreview(item) {
            const url = item.url || '/api' + item.path;
            if (item.type === 'image') {
                return '<img src="' + url + '" alt="' + escapeHtml(item.filename) + '" class="w-full h-full object-cover">';
            } else if (item.type === 'video') {
                return '<video src="' + url + '" class="w-full h-full object-cover"></video>';
            } else if (item.type === 'audio') {
                return '<audio src="' + url + '" controls class="w-full"></audio>';
            } else {
                return '<div class="text-gray-400"><svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>';
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            progressDiv.classList.remove('hidden');

            try {
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', function() {
                    progressDiv.classList.add('hidden');
                    progressBar.style.width = '0%';
                    
                    if (xhr.status === 200) {
                        alert('文件上传成功');
                        loadMedia();
                    } else {
                        alert('上传失败：' + xhr.responseText);
                    }
                    fileInput.value = '';
                });

                xhr.addEventListener('error', function() {
                    progressDiv.classList.add('hidden');
                    progressBar.style.width = '0%';
                    alert('上传失败：网络错误');
                    fileInput.value = '';
                });

                xhr.open('POST', '/api/media/upload');
                const token = localStorage.getItem('admin_token');
                if (token) {
                    xhr.setRequestHeader('Authorization', token);
                }
                xhr.send(formData);
            } catch (error) {
                progressDiv.classList.add('hidden');
                progressBar.style.width = '0%';
                alert('上传失败：' + (error.message || '未知错误'));
                fileInput.value = '';
            }
        }

        async function deleteMedia(id) {
            if (!confirm('确定要删除此媒体文件吗？')) return;

            try {
                await AdminUtils.request('/media/' + id, { method: 'DELETE' });
                alert('媒体文件删除成功');
                loadMedia();
            } catch (error) {
                alert('删除失败：' + (error.message || '未知错误'));
            }
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '<span class="text-sm text-gray-700">共 ' + total + ' 条记录</span>';
            html += '<div class="flex gap-2">';
            
            if (currentPage > 1) {
                html += '<button onclick="changePage(' + (currentPage - 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>';
            }
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += '<button class="px-3 py-1 border rounded bg-blue-600 text-white">' + i + '</button>';
                } else {
                    html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 border rounded hover:bg-gray-50">' + i + '</button>';
                }
            }
            
            if (currentPage < totalPages) {
                html += '<button onclick="changePage(' + (currentPage + 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>';
            }
            
            html += '</div>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadMedia();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        async function initPage() {
            await loadMedia();
        }
    </script>
    {/scripts}
{/include}
