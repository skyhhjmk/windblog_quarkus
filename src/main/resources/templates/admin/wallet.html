{#include admin/base.html}
    {#title}钱包管理 - WindBlog 管理后台{/title}
    {#pageTitle}钱包管理{/pageTitle}
    {#activePage}wallet{/activePage}

    {#content}
        <div class="space-y-6">
            <!-- 用户选择 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">选择用户</h3>
                <div class="flex gap-4">
                    <input type="text" id="searchInput" placeholder="搜索用户名或邮箱..."
                           class="flex-1 max-w-md px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchUsers()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        搜索
                    </button>
                </div>

                <div id="userList" class="mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div class="text-center text-gray-500 py-4 col-span-full">请搜索用户</div>
                </div>

                <div id="pagination" class="mt-4 flex justify-between items-center"></div>
            </div>

            <!-- 钱包信息 -->
            <div id="walletSection" class="hidden">
                <div class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg shadow-lg p-6 text-white mb-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-blue-100 text-sm mb-1">用户: <span id="walletUsername"
                                                                              class="font-semibold"></span></p>
                            <p class="text-4xl font-bold my-4"><span id="walletBalance">0</span> <span class="text-xl">积分</span>
                            </p>
                            <p class="text-blue-100 text-sm">版本号: v<span id="walletVersion">0</span></p>
                        </div>
                        <button onclick="showAdjustDialog()"
                                class="px-4 py-2 bg-white text-blue-600 rounded-lg hover:bg-blue-50 transition-colors font-semibold">
                            调整积分
                        </button>
                    </div>
                </div>

                <!-- 交易记录 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">交易记录</h3>
                    <div id="transactionsContainer">
                        <div class="text-center text-gray-500 py-8">加载中...</div>
                    </div>
                    <div id="txPagination" class="mt-4 flex justify-between items-center"></div>
                </div>
            </div>
        </div>

        <!-- 调整积分模态框 -->
        <div id="adjustModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">调整积分</h3>
                </div>
                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">新余额</label>
                        <input type="number" id="newBalance" min="0" placeholder="请输入新的积分余额"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">调整说明</label>
                        <textarea id="adjustDescription" rows="2" placeholder="请输入调整原因..."
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                    <button onclick="closeAdjustModal()"
                            class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">取消
                    </button>
                    <button onclick="submitAdjust()"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">确认调整
                    </button>
                </div>
            </div>
        </div>
    {/content}

    {#scripts}
        <script src="/admin/assets/js/admin.js"></script>
        <script>
            let users = [];
            let currentUser = null;
            let currentPage = 1;
            let txPage = 1;
            const pageSize = 12;
            const txPageSize = 20;

            async function searchUsers() {
                const keyword = document.getElementById('searchInput').value.trim();
                currentPage = 1;
                await loadUsers(keyword);
            }

            async function loadUsers(keyword) {
                try {
                    let url = '/users?page=' + currentPage + '&pageSize=' + pageSize;
                    if (keyword) {
                        url += '&keyword=' + encodeURIComponent(keyword);
                    }
                    const response = await AdminUtils.get(url);
                    users = response.data || [];
                    renderUsers();
                    renderPagination(response.total || 0);
                } catch (error) {
                    console.error('加载用户失败:', error);
                    document.getElementById('userList').innerHTML =
                        '<div class="text-center text-red-500 py-4 col-span-full">加载失败: ' + (error.message || '未知错误') + '</div>';
                }
            }

            function renderUsers() {
                const container = document.getElementById('userList');
                if (users.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-4 col-span-full">暂无用户</div>';
                    return;
                }

                container.innerHTML = users.map(user => `
                <div onclick="selectUser(${user.id}, '${escapeHtml(user.username)}')"
                    class="p-4 border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 cursor-pointer transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold">
                            ${escapeHtml(user.username || '?').charAt(0).toUpperCase()}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-medium text-gray-800 truncate">${escapeHtml(user.username)}</p>
                            <p class="text-sm text-gray-500 truncate">${escapeHtml(user.email)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            }

            function renderPagination(total) {
                const totalPages = Math.ceil(total / pageSize);
                const pagination = document.getElementById('pagination');

                if (totalPages <= 1) {
                    pagination.innerHTML = '<span class="text-sm text-gray-600">共 ' + total + ' 条记录</span><div></div>';
                    return;
                }

                let html = '<span class="text-sm text-gray-600">共 ' + total + ' 条记录</span><div class="flex gap-2">';

                if (currentPage > 1) {
                    html += '<button onclick="changePage(' + (currentPage - 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>';
                }

                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        html += '<button class="px-3 py-1 border rounded bg-blue-600 text-white">' + i + '</button>';
                    } else {
                        html += '<button onclick="changePage(' + i + ')" class="px-3 py-1 border rounded hover:bg-gray-50">' + i + '</button>';
                    }
                }

                if (currentPage < totalPages) {
                    html += '<button onclick="changePage(' + (currentPage + 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>';
                }

                html += '</div>';
                pagination.innerHTML = html;
            }

            function changePage(page) {
                currentPage = page;
                const keyword = document.getElementById('searchInput').value.trim();
                loadUsers(keyword);
            }

            async function selectUser(userId, username) {
                currentUser = {id: userId, username: username};
                document.getElementById('walletUsername').textContent = username;
                document.getElementById('walletSection').classList.remove('hidden');
                await loadWallet();
                await loadTransactions();
            }

            async function loadWallet() {
                if (!currentUser) return;

                try {
                    const response = await AdminUtils.get('/users/' + currentUser.id + '/wallet');
                    document.getElementById('walletBalance').textContent = response.pointsBalance || 0;
                    document.getElementById('walletVersion').textContent = response.version || 0;
                } catch (error) {
                    console.error('加载钱包失败:', error);
                    document.getElementById('walletBalance').textContent = '加载失败';
                }
            }

            async function loadTransactions() {
                if (!currentUser) return;

                try {
                    const response = await AdminUtils.get('/users/' + currentUser.id + '/wallet/transactions?page=' + txPage + '&pageSize=' + txPageSize);
                    renderTransactions(response.data || []);
                    renderTxPagination(response.total || 0);
                } catch (error) {
                    console.error('加载交易记录失败:', error);
                    document.getElementById('transactionsContainer').innerHTML =
                        '<div class="text-center text-red-500 py-8">加载失败: ' + (error.message || '未知错误') + '</div>';
                }
            }

            function renderTransactions(transactions) {
                const container = document.getElementById('transactionsContainer');
                if (transactions.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无交易记录</div>';
                    return;
                }

                container.innerHTML = transactions.map(tx => `
                <div class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${tx.changeAmount >= 0 ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${tx.changeAmount >= 0 ? '↓' : '↑'}
                        </div>
                        <div>
                            <p class="font-medium text-gray-800">${escapeHtml(tx.bizType || '未知')}</p>
                            <p class="text-sm text-gray-500">${escapeHtml(tx.description || '-')}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-semibold ${tx.changeAmount >= 0 ? 'text-green-600' : 'text-red-600'}">
                            ${tx.changeAmount >= 0 ? '+' : ''}${tx.changeAmount}
                        </p>
                        <p class="text-sm text-gray-500">余额: ${tx.balanceAfter}</p>
                    </div>
                </div>
            `).join('');
            }

            function renderTxPagination(total) {
                const totalPages = Math.ceil(total / txPageSize);
                const pagination = document.getElementById('txPagination');

                if (totalPages <= 1) {
                    pagination.innerHTML = '<span class="text-sm text-gray-600">共 ' + total + ' 条记录</span><div></div>';
                    return;
                }

                let html = '<span class="text-sm text-gray-600">共 ' + total + ' 条记录</span><div class="flex gap-2">';

                if (txPage > 1) {
                    html += '<button onclick="changeTxPage(' + (txPage - 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">上一页</button>';
                }

                html += '<span class="px-3 py-1">第 ' + txPage + ' / ' + totalPages + ' 页</span>';

                if (txPage < totalPages) {
                    html += '<button onclick="changeTxPage(' + (txPage + 1) + ')" class="px-3 py-1 border rounded hover:bg-gray-50">下一页</button>';
                }

                html += '</div>';
                pagination.innerHTML = html;
            }

            function changeTxPage(page) {
                txPage = page;
                loadTransactions();
            }

            function showAdjustDialog() {
                document.getElementById('newBalance').value = '';
                document.getElementById('adjustDescription').value = '';
                document.getElementById('adjustModal').classList.remove('hidden');
            }

            function closeAdjustModal() {
                document.getElementById('adjustModal').classList.add('hidden');
            }

            async function submitAdjust() {
                if (!currentUser) return;

                const newBalance = document.getElementById('newBalance').value.trim();
                const description = document.getElementById('adjustDescription').value.trim();

                if (!newBalance || isNaN(parseInt(newBalance)) || parseInt(newBalance) < 0) {
                    alert('请输入有效的积分余额（非负整数）');
                    return;
                }

                try {
                    await AdminUtils.request('/users/' + currentUser.id + '/wallet/adjust', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            newBalance: parseInt(newBalance),
                            description: description || '管理员手动调整'
                        })
                    });
                    alert('积分调整成功');
                    closeAdjustModal();
                    await loadWallet();
                    txPage = 1;
                    await loadTransactions();
                } catch (error) {
                    console.error('调整积分失败:', error);
                    alert('调整失败: ' + (error.message || '未知错误'));
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function initPage() {
                await loadUsers('');
            }
        </script>
    {/scripts}
{/include}
