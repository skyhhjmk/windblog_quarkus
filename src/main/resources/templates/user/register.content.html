<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1" data-page-title="用户注册">
<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">用户注册</h1>

        <form id="registerForm" data-no-debounce="true" action="/user/api/register" method="post" class="space-y-4">
            <input type="hidden" name="redirect" value="{redirect}"/>

            <div>
                <label for="username" class="block text-sm mb-1">用户名</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       minlength="3"
                       maxlength="20"
                       pattern="[a-zA-Z0-9_]+"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="3-20位字母数字下划线"/>
                <p class="text-xs text-gray-500 mt-1">仅支持字母、数字、下划线</p>
            </div>

            <div>
                <label for="email" class="block text-sm mb-1">邮箱</label>
                <input type="email"
                       id="email"
                       name="email"
                       required
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="请输入有效邮箱地址"/>
            </div>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="subscribeArticleUpdates"/>
                接收新文章更新</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="subscribePromotions"/> 接收推广通知</label>

            <div>
                <label for="password" class="block text-sm mb-1">密码</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="6"
                       maxlength="32"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="6-32位密码"/>
                <p class="text-xs text-gray-500 mt-1">建议使用字母、数字组合</p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm mb-1">确认密码</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       required
                       minlength="6"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="再次输入密码"/>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="agreement" name="agreement" required/>
                <label for="agreement" class="text-sm">
                    我已阅读并同意 <a href="/terms" class="text-[var(--accent)] hover:underline">用户协议</a>
                    和 <a href="/privacy" class="text-[var(--accent)] hover:underline">隐私政策</a>
                </label>
            </div>

            <div id="errorMessage" class="hidden text-red-400 text-sm text-center"></div>

            <button type="submit"
                    id="registerSubmit"
                    data-shortcut="enter"
                    aria-keyshortcuts="Enter"
                    class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="btn-text">注册（回车）</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>已有账号?</span>
            <a href="/user/login?redirect={redirect}" class="text-[var(--accent)] hover:underline ml-1"
               >立即登录</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div data-page-title="用户注册" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / register</div>
<div id="pjax-sidebar-html" class="hidden">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">注册须知</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>用户名唯一且不可修改</li>
                <li>邮箱用于找回密码</li>
                <li>注册即表示同意用户协议</li>
            </ul>
        </section>
    </div>
</div>
</div>
