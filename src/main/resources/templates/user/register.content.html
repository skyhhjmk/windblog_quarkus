<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1" data-page-title="{i18n.t('user.register_title')}">
<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">{i18n.t('user.register_title')}</h1>

        <form id="registerForm" data-no-debounce="true" data-seeray-form="register" action="/user/api/register" method="post" class="space-y-4">
            <input type="hidden" name="redirect" value="{redirect}"/>

            <div>
                <label for="username" class="block text-sm mb-1">{i18n.t('user.username')}</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       minlength="3"
                       maxlength="20"
                       pattern="[a-zA-Z0-9_]+"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.username_placeholder')}"/>
                <p class="text-xs text-gray-500 mt-1">{i18n.t('user.username_hint')}</p>
            </div>

            <div>
                <label for="email" class="block text-sm mb-1">{i18n.t('user.email')}</label>
                <input type="email"
                       id="email"
                       name="email"
                       required
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.email_placeholder')}"/>
            </div>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="subscribeArticleUpdates"/>
                {i18n.t('user.subscribe_updates')}</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="subscribePromotions"/> {i18n.t('user.subscribe_promotions')}</label>

            <div>
                <label for="password" class="block text-sm mb-1">{i18n.t('user.password')}</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="6"
                       maxlength="32"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.password_placeholder_6_32')}"/>
                <p class="text-xs text-gray-500 mt-1">{i18n.t('user.password_hint')}</p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm mb-1">{i18n.t('user.confirm_password')}</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       required
                       minlength="6"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.confirm_password_placeholder')}"/>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="agreement" name="agreement" required/>
                <label for="agreement" class="text-sm">
                    {i18n.t('user.terms_prefix')} <a href="{languagePrefix}/terms" class="text-[var(--accent)] hover:underline">{i18n.t('user.terms')}</a>
                    {i18n.t('user.and')} <a href="{languagePrefix}/privacy" class="text-[var(--accent)] hover:underline">{i18n.t('user.privacy')}</a>
                </label>
            </div>

            <div id="errorMessage" class="hidden text-red-400 text-sm text-center"></div>

            <button type="submit"
                    id="registerSubmit"
                    data-seeray-goal="registration_submit"
                    data-shortcut="enter"
                    aria-keyshortcuts="Enter"
                    class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="btn-text">{i18n.t('user.register_button')}</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>{i18n.t('user.have_account')}</span>
            <a href="{languagePrefix}/user/login?redirect={redirect}" class="text-[var(--accent)] hover:underline ml-1"
               >{i18n.t('user.login_now')}</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div data-page-title="{i18n.t('user.register_title')}" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / register</div>
<div id="pjax-sidebar-html" class="hidden">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">注册须知</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>用户名唯一且不可修改</li>
                <li>邮箱用于找回密码</li>
                <li>注册即表示同意用户协议</li>
            </ul>
        </section>
    </div>
</div>
</div>
