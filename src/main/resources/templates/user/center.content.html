<div class="max-w-4xl mx-auto space-y-12">
    <!-- Profile Header -->
    <header class="flex items-center justify-between p-8 border border-[var(--border)] bg-[var(--panel-bg)]">
        <div class="flex items-center gap-6">
            <div class="w-20 h-20 bg-gradient-to-br from-[var(--accent)] to-cyan-500 rounded-full flex items-center justify-center text-3xl font-bold text-[var(--bg)]">
                {user.username.substring(0, 1).toUpperCase()}
            </div>
            <div>
                <h1 class="text-2xl font-bold">{user.username}</h1>
                <p class="text-gray-400">{user.email}</p>
                <div class="mt-2 flex gap-2">
                    <span class="text-[10px] px-2 py-0.5 border border-[var(--border)] rounded uppercase tracking-wider">{user.roleName}</span>
                </div>
            </div>
        </div>
        <button id="logoutBtn" class="btn-minimal px-6 py-2 border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded">
            退出登录
        </button>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-8">
            <section class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
                <h2 class="text-lg font-bold mb-4">账户</h2>
                <div class="space-y-4">
                    <div class="flex justify-between py-3 border-b border-[var(--border)]/50">
                        <span class="text-gray-400">用户名</span>
                        <span>{user.username}</span>
                    </div>
                    <div class="flex justify-between py-3 border-b border-[var(--border)]/50">
                        <span class="text-gray-400">邮箱</span>
                        <span>{user.email}</span>
                    </div>
                </div>
            </section>
        </div>

        <aside class="space-y-8">
            <!-- Sidebar content is handled by pjax-sidebar-html below -->
        </aside>
    </div>
</div>

<!-- PJAX 数据 -->
<div data-page-title="个人中心" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">~/windblog / user / center</div>
<div id="pjax-sidebar-html" class="hidden">
    <div class="space-y-4">
        {#if user}
            <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
                <h3 class="font-bold mb-2">快捷操作</h3>
                <ul class="text-sm space-y-2">
                    <li><a href="#" class="hover:text-[var(--accent)]">→ 发布文章</a></li>
                    <li><a href="#" class="hover:text-[var(--accent)]">→ 我的收藏</a></li>
                    <li><a href="#" class="hover:text-[var(--accent)]">→ 消息通知</a></li>
                </ul>
            </section>
        {/if}

        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">用户中心</h3>
            <p class="text-sm text-gray-400">
                管理您的账号信息、查看发布的内容和互动记录。
            </p>
        </section>
    </div>
</div>
