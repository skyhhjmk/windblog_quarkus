<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">用户登录</h1>

        <form id="loginForm" data-no-debounce="true" action="/user/api/login" method="post" class="space-y-4">
            <input type="hidden" name="redirect" value="{redirect}"/>

            <div>
                <label for="account" class="block text-sm mb-1">账号 (用户名或邮箱)</label>
                <input type="text"
                       id="account"
                       name="account"
                       required
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="请输入用户名或邮箱"/>
            </div>

            <div>
                <label for="password" class="block text-sm mb-1">密码</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="6"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="请输入密码"/>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="remember" value="on"/>
                    <span>记住我</span>
                </label>
                <a href="#" class="text-sm text-[var(--accent)] hover:underline">忘记密码?</a>
            </div>

            <div id="errorMessage" class="hidden text-red-400 text-sm text-center"></div>

            <button type="submit"
                    class="w-full py-2 bg-[var(--accent)] text-[var(--bg)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="btn-text">登录</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>还没有账号?</span>
            <a href="/user/register?redirect={redirect}" class="text-[var(--accent)] hover:underline ml-1"
               data-no-pjax="true">立即注册</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div data-page-title="用户登录" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">~/windblog / user / login</div>
<div id="pjax-sidebar-html" class="hidden">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">登录说明</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>支持用户名或邮箱登录</li>
                <li>密码区分大小写</li>
                <li>建议开启"记住我"功能</li>
            </ul>
        </section>
    </div>
</div>
