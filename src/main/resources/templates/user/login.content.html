<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1" data-page-title="{i18n.t('user.login_title')}">
<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">{i18n.t('user.login_title')}</h1>

        <form id="loginForm" data-no-debounce="true" data-seeray-form="login" action="/user/api/login" method="post" class="space-y-4">
            <input type="hidden" name="redirect" value="{redirect}"/>

            <div>
                <label for="account" class="block text-sm mb-1">{i18n.t('user.account')}</label>
                <input type="text"
                       id="account"
                       name="account"
                       required
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.account_placeholder')}"/>
            </div>

            <div>
                <label for="password" class="block text-sm mb-1">{i18n.t('user.password')}</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="6"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.password_placeholder')}"/>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="remember" value="on"/>
                    <span>{i18n.t('user.remember')}</span>
                </label>
                <a href="{languagePrefix}/user/forgot-password" class="text-sm text-[var(--accent)] hover:underline">{i18n.t('user.forgot')}</a>
            </div>

            <div id="errorMessage" class="hidden text-red-400 text-sm text-center"></div>

            <button type="submit" data-shortcut="enter" data-seeray-goal="login_submit" aria-keyshortcuts="Enter"
                    class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                <span class="btn-text">{i18n.t('user.login_button')}</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>{i18n.t('user.no_account')}</span>
            <a href="{languagePrefix}/user/register?redirect={redirect}" class="text-[var(--accent)] hover:underline ml-1"
               >{i18n.t('user.register_now')}</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div data-page-title="{i18n.t('user.login_title')}" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / login</div>
<div id="pjax-sidebar-html" class="hidden">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">{i18n.t('user.login_notes')}</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>{i18n.t('user.login_note_1')}</li>
                <li>{i18n.t('user.login_note_2')}</li>
                <li>{i18n.t('user.login_note_3')}</li>
            </ul>
        </section>
    </div>
</div>
</div>
