<div id="pjax-content-root" data-seeray-layout-version="windblog-pjax-v1" data-page-title="{i18n.t('user.forgot_title')}">
<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-3 text-center">{i18n.t('user.forgot_title')}</h1>
        <p class="text-sm text-meta mb-6">{i18n.t('user.forgot_desc')}</p>

        <form id="forgotPasswordForm" data-no-debounce="true" action="/user/api/forgot-password" method="post" class="space-y-4">
            <div>
                <label for="forgotEmail" class="block text-sm mb-1">{i18n.t('user.registered_email')}</label>
                <input type="email" id="forgotEmail" name="email" required autocomplete="email"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="{i18n.t('user.registered_email_placeholder')}"/>
            </div>
            <div id="forgotPasswordMessage" class="hidden text-sm text-[var(--accent)]"></div>
            <button type="submit" data-shortcut="enter" aria-keyshortcuts="Enter" class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold flex items-center justify-center gap-2">
                <span class="btn-text">{i18n.t('user.send_reset')}</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 border-t border-[var(--border)] pt-5">
            <p class="text-sm text-meta mb-3">{i18n.t('user.no_verification_email')}</p>
            <form id="resendVerificationForm" action="/user/api/resend-verification" method="post" class="flex gap-2" data-no-debounce="true">
                <input type="email" name="email" required autocomplete="email"
                       class="min-w-0 flex-1 px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)]"
                       placeholder="注册邮箱"/>
                <button type="submit" class="px-3 py-2 border border-[var(--border)] hover:border-[var(--accent)]">{i18n.t('user.resend')}</button>
            </form>
        </div>

        <div class="mt-6 text-center text-sm">
            <a href="{languagePrefix}/user/login" class="text-[var(--accent)] hover:underline">{i18n.t('user.back_to_login')}</a>
        </div>
    </div>
</div>

<div data-page-title="{i18n.t('user.forgot_title')}" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / forgot-password</div>
</div>
