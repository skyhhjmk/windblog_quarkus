<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-3 text-center">找回密码</h1>
        <p class="text-sm text-meta mb-6">输入注册邮箱。如果账号存在，我们会发送密码重置链接。</p>

        <form id="forgotPasswordForm" data-no-debounce="true" action="/user/api/forgot-password" method="post" class="space-y-4">
            <div>
                <label for="forgotEmail" class="block text-sm mb-1">注册邮箱</label>
                <input type="email" id="forgotEmail" name="email" required autocomplete="email"
                       class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       placeholder="请输入注册邮箱"/>
            </div>
            <div id="forgotPasswordMessage" class="hidden text-sm text-[var(--accent)]"></div>
            <button type="submit" data-shortcut="enter" aria-keyshortcuts="Enter" class="w-full py-2 bg-[var(--accent)] text-[var(--bg)] font-bold flex items-center justify-center gap-2">
                <span class="btn-text">发送重置邮件（回车）</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 border-t border-[var(--border)] pt-5">
            <p class="text-sm text-meta mb-3">没有收到注册验证邮件？</p>
            <form id="resendVerificationForm" action="/user/api/resend-verification" method="post" class="flex gap-2" data-no-debounce="true">
                <input type="email" name="email" required autocomplete="email"
                       class="min-w-0 flex-1 px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)]"
                       placeholder="注册邮箱"/>
                <button type="submit" class="px-3 py-2 border border-[var(--border)] hover:border-[var(--accent)]">重发</button>
            </form>
        </div>

        <div class="mt-6 text-center text-sm">
            <a href="/user/login" class="text-[var(--accent)] hover:underline">返回登录</a>
        </div>
    </div>
</div>

<div data-page-title="找回密码" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / forgot-password</div>
