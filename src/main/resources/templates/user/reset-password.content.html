<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        {#if valid}
            <h1 class="text-xl font-bold mb-6 text-center">设置新密码</h1>
            <form id="resetPasswordForm" data-no-debounce="true" action="/user/api/reset-password" method="post" class="space-y-4">
                <input type="hidden" name="token" value="{token}"/>
                <div>
                    <label for="resetPassword" class="block text-sm mb-1">新密码</label>
                    <input type="password" id="resetPassword" name="password" required minlength="6" maxlength="32"
                           autocomplete="new-password"
                           class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                           placeholder="6-32位密码"/>
                </div>
                <div>
                    <label for="resetConfirmPassword" class="block text-sm mb-1">确认新密码</label>
                    <input type="password" id="resetConfirmPassword" name="confirmPassword" required minlength="6" maxlength="32"
                           autocomplete="new-password"
                           class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                           placeholder="再次输入密码"/>
                </div>
                <div id="resetPasswordMessage" class="hidden text-red-400 text-sm"></div>
                <button type="submit" data-shortcut="enter" aria-keyshortcuts="Enter" class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold flex items-center justify-center gap-2">
                    <span class="btn-text">保存新密码（回车）</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        {#else}
            <h1 class="text-xl font-bold mb-4 text-center">链接无效或已过期</h1>
            <p class="text-sm text-meta text-center">请重新申请密码重置邮件。</p>
            <a href="/user/forgot-password" class="block mt-6 text-center text-[var(--accent)] hover:underline">重新申请</a>
        {/if}
    </div>
</div>

<div data-page-title="设置新密码" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / reset-password</div>
