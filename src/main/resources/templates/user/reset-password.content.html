<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        {#if valid}
            <h1 class="text-xl font-bold mb-6 text-center">{i18n.t('user.new_password')}</h1>
            <form id="resetPasswordForm" data-no-debounce="true" action="/user/api/reset-password" method="post" class="space-y-4">
                <input type="hidden" name="token" value="{token}"/>
                <div>
                    <label for="resetPassword" class="block text-sm mb-1">{i18n.t('user.new_password_label')}</label>
                    <input type="password" id="resetPassword" name="password" required minlength="6" maxlength="32"
                           autocomplete="new-password"
                           class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                           placeholder="{i18n.t('user.password_placeholder_6_32')}"/>
                </div>
                <div>
                    <label for="resetConfirmPassword" class="block text-sm mb-1">{i18n.t('user.confirm_new_password')}</label>
                    <input type="password" id="resetConfirmPassword" name="confirmPassword" required minlength="6" maxlength="32"
                           autocomplete="new-password"
                           class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                           placeholder="{i18n.t('user.confirm_password_placeholder')}"/>
                </div>
                <div id="resetPasswordMessage" class="hidden text-red-400 text-sm"></div>
                <button type="submit" data-shortcut="enter" aria-keyshortcuts="Enter" class="w-full py-2 bg-[var(--accent)] text-[var(--accent-foreground)] font-bold flex items-center justify-center gap-2">
                    <span class="btn-text">{i18n.t('user.save_password')}</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        {#else}
            <h1 class="text-xl font-bold mb-4 text-center">{i18n.t('user.invalid_link')}</h1>
            <p class="text-sm text-meta text-center">{i18n.t('user.request_again')}</p>
            <a href="{languagePrefix}/user/forgot-password" class="block mt-6 text-center text-[var(--accent)] hover:underline">{i18n.t('user.request_again_button')}</a>
        {/if}
    </div>
</div>

<div data-page-title="{i18n.t('user.new_password')}" class="hidden"></div>
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / user / reset-password</div>
