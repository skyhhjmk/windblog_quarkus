<meta name="description" content="{pageDescription ?: config:siteDescription}" data-pjax-managed="true"/>
<meta name="robots" content="{seoRobots}" data-pjax-managed="true"/>
<meta name="keywords" content="{pageKeywords ?: config:siteKeywords}" data-pjax-managed="true"/>
<link rel="canonical" href="{canonicalUrl}" data-pjax-managed="true"/>
{#for alternate in seoAlternates}
<link rel="alternate" hreflang="{alternate.language}" href="{alternate.url}" data-pjax-managed="true"/>
{/for}
{#if ampUrl.or(null)}
<link rel="amphtml" href="{ampUrl}" data-pjax-managed="true"/>
{/if}
{#if ogData.or(null)}
{#for entry in ogData.entrySet}
{#if entry.key.startsWith('og:') || entry.key.startsWith('article:')}
<meta property="{entry.key}" content="{entry.value}" data-pjax-managed="true"/>
{#else}
<meta name="{entry.key}" content="{entry.value}" data-pjax-managed="true"/>
{/if}
{/for}
{#else}
<meta property="og:title" content="{pageTitle ?: config:siteTitle}" data-pjax-managed="true"/>
<meta property="og:description" content="{pageDescription ?: config:siteDescription}" data-pjax-managed="true"/>
<meta property="og:type" content="website" data-pjax-managed="true"/>
<meta property="og:url" content="{canonicalUrl}" data-pjax-managed="true"/>
<meta property="og:site_name" content="{config:siteTitle}" data-pjax-managed="true"/>
<meta property="og:locale" content="{ogLocale}" data-pjax-managed="true"/>
{#if publisherLogoUrl.or(null)}
<meta property="og:image" content="{publisherLogoUrl}" data-pjax-managed="true"/>
{/if}
<meta name="twitter:card" content="summary" data-pjax-managed="true"/>
<meta name="twitter:title" content="{pageTitle ?: config:siteTitle}" data-pjax-managed="true"/>
<meta name="twitter:description" content="{pageDescription ?: config:siteDescription}" data-pjax-managed="true"/>
{/if}
{#if jsonLd.or(null)}
<script type="application/ld+json" nonce="{cspNonce}" data-pjax-managed="true">{jsonLd.raw}</script>
{/if}
