<div id="toc-widget"
     class="sidebar-widget bg-card/40 backdrop-blur-md border border-border rounded-xl p-6 transition-all duration-300 hover:border-accent/30 hidden">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-1.5 h-6 bg-accent rounded-full"></div>
        <h3 class="text-sm font-bold tracking-wider text-main uppercase">文章目录</h3>
    </div>

    <div id="toc-content" class="toc-list text-sm space-y-1 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
        <!-- JS will populate this -->
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const content = document.querySelector('.prose') || document.querySelector('#post-content');
        if (!content) return;

        const headings = content.querySelectorAll('h1, h2, h3, h4');
        if (headings.length < 2) return;

        const tocWidget = document.getElementById('toc-widget');
        const tocContent = document.getElementById('toc-content');

        tocWidget.classList.remove('hidden');

        headings.forEach((heading, index) => {
            const id = heading.id || "heading-" + index;
            heading.id = id;

            const level = parseInt(heading.tagName[1]);
            const item = document.createElement('a');
            item.href = "#" + id;
            item.className = "block py-1.5 text-body hover:text-accent transition-colors";
            item.style.paddingLeft = (level - 1) + "rem";
            item.textContent = heading.textContent;

            tocContent.appendChild(item);
        });

        // Scroll spy logic could be added here
    });
</script>
