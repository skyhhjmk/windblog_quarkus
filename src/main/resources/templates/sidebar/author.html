<div class="sidebar-widget bg-card/40 backdrop-blur-md border border-border rounded-xl p-8 transition-all duration-300 hover:border-accent/30 flex flex-col items-center text-center group">
    <div class="relative mb-6">
        <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-bg shadow-2xl group-hover:scale-105 transition-transform duration-500">
            <img src="{authorAvatar ?: config:logoUrl}" alt="{authorName ?: config:siteTitle}"
                 class="w-full h-full object-cover"/>
        </div>
        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 border-4 border-bg rounded-full"></div>
    </div>

    <h3 class="text-lg font-bold text-main mb-2 tracking-tight">{authorName ?: config:siteTitle}</h3>
    <p class="text-sm text-meta leading-relaxed mb-6">
        {config:siteSubtitle ?: '一位热爱技术的博主，在这里分享知识与生活。'}
    </p>

    <div class="flex gap-4">
        {#if config:social('github')}
            <a href="{config:social('github')}" target="_blank"
               class="w-10 h-10 rounded-lg bg-accent/5 border border-border flex items-center justify-center text-body hover:text-accent hover:border-accent/50 transition-all">
                <i class="fab fa-github"></i>
            </a>
        {/if}
        {#if config:social('twitter')}
            <a href="{config:social('twitter')}" target="_blank"
               class="w-10 h-10 rounded-lg bg-accent/5 border border-border flex items-center justify-center text-body hover:text-accent hover:border-accent/50 transition-all">
                <i class="fab fa-twitter"></i>
            </a>
        {/if}
        <a href="/feed"
           class="w-10 h-10 rounded-lg bg-accent/5 border border-border flex items-center justify-center text-body hover:text-accent hover:border-accent/50 transition-all">
            <i class="fas fa-rss"></i>
        </a>
    </div>
</div>
