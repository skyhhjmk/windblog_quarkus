<div class="sidebar-widget bg-card/40 backdrop-blur-md border border-border rounded-xl p-6 transition-all duration-300 hover:border-accent/30 group">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-1.5 h-6 bg-accent rounded-full"></div>
        <h3 class="text-sm font-bold tracking-wider text-main uppercase">近期发布</h3>
    </div>

    <div class="space-y-6">
        {#for post in sidebar:recentPosts(5)}
            <a href="/post/{post.slug}" class="flex gap-4 group/item">
                <div class="w-12 h-12 rounded-lg bg-accent/5 border border-border flex items-center justify-center shrink-0 group-hover/item:border-accent/50 transition-colors">
                    <span class="text-xs font-mono text-accent/50 uppercase">{post.title.substring(0, 1)}</span>
                </div>
                <div class="flex flex-col justify-center gap-1 min-w-0">
                    <h4 class="text-sm font-medium text-main line-clamp-2 leading-relaxed group-hover/item:text-accent transition-colors">
                        {post.title}
                    </h4>
                    <span class="text-[10px] text-meta font-mono tracking-tighter uppercase">
                        {#if post.publishedAt}
                            {post.publishedAt.toLocalDate()}
                        {#else}
                            {post.createdAt.toLocalDate()}
                        {/if}
                    </span>
                </div>
            </a>
        {/for}
    </div>
</div>
