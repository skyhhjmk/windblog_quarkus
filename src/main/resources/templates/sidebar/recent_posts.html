<div class="sidebar-widget bg-card/70 backdrop-blur-xl border border-border/70 rounded-2xl p-5 md:p-6 transition-all duration-300 hover:border-border hover:shadow-lg group">
    <div class="flex items-center gap-2.5 mb-5 pb-3 border-b border-border/50">
        <div class="w-2 h-2 rounded-full bg-accent shadow-[0_0_8px_rgba(var(--accent-rgb),0.5)]"></div>
        <h3 class="text-xs font-bold tracking-wider text-main uppercase font-mono">近期发布</h3>
    </div>

    <div class="space-y-4">
        {#for post in sidebar:recentPosts(5)}
            <a href="/post/{post.slug}" class="flex gap-3.5 group/item p-2 rounded-xl hover:bg-input-bg/70 transition-all">
                <div class="w-10 h-10 rounded-lg bg-input-bg border border-border flex items-center justify-center shrink-0 group-hover/item:border-accent/40 group-hover/item:text-accent transition-colors">
                    <span class="text-xs font-mono font-bold text-accent/70 uppercase">{post.titleInitial ?: '?'}</span>
                </div>
                <div class="flex flex-col justify-center gap-0.5 min-w-0 flex-1">
                    <h4 class="text-xs font-semibold text-main line-clamp-2 leading-snug group-hover/item:text-accent transition-colors">
                        {post.title}
                    </h4>
                    <span class="text-[10px] text-meta font-mono tracking-wider">
                        {#if post.publishedAt}
                            {post.publishedAt.toLocalDate()}
                        {#else}
                            {post.createdAt.toLocalDate()}
                        {/if}
                    </span>
                </div>
            </a>
        {/for}
    </div>
</div>
