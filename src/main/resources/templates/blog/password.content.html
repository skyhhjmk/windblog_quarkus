<div id="pjax-content-root" data-page-title="{pageTitle ?: 'Security'}">
    <div id="pjax-nav-path" class="hidden">security / authorization</div>
    <div id="pjax-sidebar-html" class="hidden">
        <div class="space-y-12">
            <section class="space-y-4">
                <h3 class="meta-mono">Access Control</h3>
                <p class="text-sm text-gray-500 leading-relaxed italic">
                    This resource is restricted. Proper authorization is required to access the requested content.
                </p>
            </section>
        </div>
    </div>

    <section class="flex flex-col items-center justify-center py-24 space-y-12 text-center">
        <header class="space-y-6">
            <div class="space-y-2 flex flex-col items-center">
                <div class="flex items-center gap-3">
                    <span class="meta-mono text-accent">Restricted</span>
                    <span class="w-8 h-[1px] bg-accent/30"></span>
                </div>
                <h1 class="text-5xl font-bold text-white tracking-tight leading-tight">Password Required</h1>
                <p class="text-lg text-gray-400">Please provide the access key to view this page.</p>
            </div>
        </header>

        <div class="card p-12 max-w-md w-full space-y-8">
            <p class="text-sm text-gray-500 leading-relaxed">
                Authorized access only. By proceeding, you agree to our confidentiality terms.
            </p>
            <div class="space-y-4">
                <input type="password" placeholder="••••••••" class="w-full text-center" />
                <button class="btn-minimal w-full justify-center py-3 bg-white text-bg font-bold border-none rounded-md">
                    Unlock Content
                </button>
            </div>
        </div>
    </section>
</div>
