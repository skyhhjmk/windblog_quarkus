<div id="pjax-content-root" data-page-title="{pageTitle ?: '安全验证'}">
<div id="pjax-nav-path" class="hidden">{config:siteNavRoot} / [加密页面]</div>
    <div id="pjax-sidebar-html" class="hidden">
        <div class="space-y-12">
            <section class="space-y-4">
                <h3 class="meta-mono">访问控制</h3>
                <p class="text-sm text-gray-500 leading-relaxed italic">
                    此资源受限。访问请求的内容需要适当的授权。
                </p>
            </section>
        </div>
    </div>

    <section class="flex flex-col items-center justify-center py-24 space-y-12 text-center">
        <header class="space-y-6">
            <div class="space-y-2 flex flex-col items-center">
                <div class="flex items-center gap-3">
                    <span class="meta-mono text-accent">受限访问</span>
                    <span class="w-8 h-[1px] bg-accent/30"></span>
                </div>
                <h1 class="text-5xl font-bold text-white tracking-tight leading-tight">需要密码</h1>
                <p class="text-lg text-gray-400">请输入访问密码以查看此页面。</p>
            </div>
        </header>

        <div class="card p-12 max-w-md w-full space-y-8">
            <p class="text-sm text-gray-500 leading-relaxed">
                仅限授权访问。继续操作即表示您同意我们的保密条款。
            </p>
            <form method="post" action="/api/user/post/password/{post.slug}/form"
                  class="space-y-4" data-password-unlock-form="true">
                <input type="password" name="password" placeholder="请输入密码" class="w-full text-center" required />
                <button type="submit" class="btn-minimal w-full justify-center py-3 bg-white text-bg font-bold border-none rounded-md">
                    解锁内容
                </button>
            </form>
        </div>
    </section>
</div>
