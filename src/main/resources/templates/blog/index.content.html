<div id="pjax-content-root" data-page-title="首页{#if subPage && subPage > 1} - 第{subPage}页{/if}">
    <div id="pjax-nav-path" class="hidden">
        ~/windblog / home{#if subPage && subPage > 1} / page-{subPage}{/if}
    </div>
    <div id="pjax-sidebar-html" class="hidden">
        <div class="space-y-4">
            <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
                <h3 class="font-bold mb-2">页面信息</h3>
                <p class="text-sm">当前语言: {language ?: 'zh-CN'}</p>
                <p class="text-sm">当前分页: 第{subPage ?: 1} 页</p>
            </section>
        </div>
    </div>

    <section class="space-y-4">
        <h2 class="text-2xl font-bold">欢迎访问首页</h2>
        <p>这是首页内容片段模板，PJAX 请求时只返回这里的内容。</p>

        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">示例内容</h3>
            <ul class="list-disc pl-6 space-y-1">
                <li>最新资讯</li>
                <li>产品推荐</li>
            </ul>
        </section>
    </section>
</div>
