<nav class="windblog-pagination" aria-label="分页">
    <div class="windblog-pagination-arrows" aria-label="翻页">
        {#if hasPrevPage}
            <a class="windblog-pagination-arrow" href="{firstPageUrl}" aria-label="第一页">
                <span aria-hidden="true">«</span>
            </a>
            <a class="windblog-pagination-arrow" href="{prevPageUrl}" aria-label="上一页">
                <span aria-hidden="true">‹</span>
            </a>
        {#else}
            <button type="button" class="windblog-pagination-arrow is-disabled"
                    data-pagination-boundary="previous" aria-disabled="true" aria-label="已是第一页">
                <span aria-hidden="true">«</span>
            </button>
            <button type="button" class="windblog-pagination-arrow is-disabled"
                    data-pagination-boundary="previous" aria-disabled="true" aria-label="没有上一页">
                <span aria-hidden="true">‹</span>
            </button>
        {/if}
    </div>

    <form class="windblog-pagination-form" data-pagination-form novalidate>
        <div class="windblog-pagination-title">
            <span class="windblog-pagination-fixed" aria-hidden="true">Wi</span>
            <span class="windblog-pagination-n-pages" aria-label="页码">
                {#for pageLink in paginationPages}
                    <span class="windblog-pagination-n-page">
                        <span class="windblog-pagination-n-letter" aria-hidden="true">n</span>
                        <a class="windblog-pagination-page{#if pageLink.current} is-current{/if}"
                           href="{pageLink.url}"
                           data-page="{pageLink.number}"
                           {#if pageLink.current}aria-current="page"{/if}>{pageLink.number}</a>
                    </span>
                {/for}
            </span>
            <span class="windblog-pagination-fixed" aria-hidden="true">d-BL</span>
            <label class="windblog-pagination-page-input">
                <span class="sr-only">当前页</span>
                <input type="number"
                       name="page"
                       placeholder="{currentPage ?: 1}"
                       min="1"
                       max="{totalPages ?: 1}"
                       inputmode="numeric"
                       aria-label="当前页，共 {totalPages ?: 1} 页">
            </label>
            <button class="windblog-pagination-go" type="submit" aria-label="跳转到页码">
                <span class="windblog-pagination-go-label" aria-hidden="true">G<span class="windblog-pagination-go-extra">o&nbsp;&gt;</span></span>
            </button>
        </div>

        <div class="windblog-pagination-status" aria-live="polite">
            第 {currentPage ?: 1} / {totalPages ?: 1} 页
        </div>
    </form>

    <div class="windblog-pagination-arrows" aria-label="翻页">
        {#if hasNextPage}
            <a class="windblog-pagination-arrow" href="{nextPageUrl}" aria-label="下一页">
                <span aria-hidden="true">›</span>
            </a>
            <a class="windblog-pagination-arrow" href="{lastPageUrl}" aria-label="最后一页">
                <span aria-hidden="true">»</span>
            </a>
        {#else}
            <button type="button" class="windblog-pagination-arrow is-disabled"
                    data-pagination-boundary="next" aria-disabled="true" aria-label="没有下一页">
                <span aria-hidden="true">›</span>
            </button>
            <button type="button" class="windblog-pagination-arrow is-disabled"
                    data-pagination-boundary="next" aria-disabled="true" aria-label="已是最后一页">
                <span aria-hidden="true">»</span>
            </button>
        {/if}
    </div>
</nav>
