{#if articleMode.or('') == 'tutorial'}
<div id="tutorial-tracker-widget"
     class="sidebar-widget bg-card border border-indigo-500/20 rounded-xl p-6 transition-all duration-300 shadow-sm not-prose"
     data-tutorial-tracker="true"
     data-sidebar-widget="tutorial_tracker"
     data-post-slug="{postSlug ?: ''}"
     {#if widget.or(null)}data-widget-id="{widget.id}"{/if}>
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-border/40">
        <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-5 bg-indigo-500 rounded-full shadow-[0_0_10px_rgba(99,102,241,0.5)]"></div>
            <h3 class="text-xs font-bold tracking-wider text-main uppercase">
                {#if widget.or(null) && widget.title && !widget.title.isEmpty}{widget.title}{#else}步骤进度追踪{/if}
            </h3>
        </div>
        <button type="button" id="btn-reset-tutorial-progress" class="text-[11px] text-meta hover:text-accent transition-colors" title="重置学习进度">重置</button>
    </div>

    <!-- Progress bar -->
    <div class="space-y-1.5 mb-4">
        <div class="flex items-center justify-between text-xs font-mono">
            <span class="text-meta" id="tutorial-progress-text">已完成 0 步</span>
            <span class="text-indigo-500 font-bold" id="tutorial-progress-percent">0%</span>
        </div>
        <div class="w-full h-1.5 bg-input-bg rounded-full overflow-hidden border border-border/40">
            <div id="tutorial-progress-fill" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-300 rounded-full" style="width: 0%"></div>
        </div>
    </div>

    <!-- Step checklist list container (dynamically populated or synced from article headings) -->
    <div id="tutorial-steps-container" class="space-y-2 max-h-[35vh] overflow-y-auto pr-1 text-xs">
        <p class="text-xs text-meta italic" id="tutorial-loading-indicator">正在解析教程章节...</p>
    </div>
</div>
{/if}
