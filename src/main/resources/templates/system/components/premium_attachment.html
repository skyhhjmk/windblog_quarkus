<div class="md-region md-region-info">
    <div class="md-region-icon"></div>
    <div class="md-region-content">
        <strong>{title}</strong>：{desc}
        {#if showButton}
            <div class="mt-4 flex items-center gap-3">
                <button class="btn-action-primary buy-post-btn !py-2.5 !px-6 !text-xs !rounded-lg"{#if postId != null} data-post-id="{postId}"{/if}{#if price != null} data-price="{price}"{/if}{#if blockId != null} data-block-id="{blockId}"{/if}>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="3">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>{buttonText}</span>
                </button>
                <p class="text-[10px] text-gray-500 opacity-60 font-medium">解锁后立即显示下载链接</p>
            </div>
        {/if}
    </div>
</div>
