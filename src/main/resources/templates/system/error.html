<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统异常 - WindBlog</title>

    <script nonce="{cspNonce}" src="/assets/js/windblog-dom-safety.js"></script>

    <!-- 本地化 Tailwind CDN 运行时脚本，避免错误页依赖外网 -->
    <script src="/assets/vendor/tailwind/tailwind-cdn.min.js"></script>
    <script nonce="{cspNonce}">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg)',
                        card: 'var(--card-bg)',
                        border: 'var(--border)',
                        'border-hover': 'var(--border-hover)',
                        accent: 'var(--accent)',
                        main: 'var(--text-main)',
                        body: 'var(--text-body)',
                        meta: 'var(--text-meta)',
                    },
                    maxWidth: {
                        '1400': '1400px',
                    }
                }
            }
        }
    </script>
    <script nonce="{cspNonce}">
        (function () {
            const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if (theme === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>

    <!-- Theme & UI Styles -->
    <link rel="stylesheet" href="/assets/css/theme.css"/>
    <link rel="stylesheet" href="/assets/css/ui.css"/>

    <style nonce="{cspNonce}">
        :root {
            --primary-color: #6366f1;
            --error-color: #ef4444;
            --bg-color: var(--bg);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-container {
            max-width: 600px;
            width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        p.message {
            font-size: 16px;
            color: var(--text-body);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .tracking-box {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-top: 24px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .tracking-item {
            margin-bottom: 12px;
        }

        .tracking-label {
            font-weight: 600;
            color: var(--text-main);
            display: block;
            margin-bottom: 4px;
        }

        .tracking-value {
            font-family: var(--font-mono);
            color: var(--text-body);
            word-break: break-all;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: block;
        }

        .actions {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-block;
            border: none;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-foreground);
            box-shadow: 0 4px 6px -1px rgba(var(--accent-rgb), 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .copy-hint {
            font-size: 12px;
            color: var(--text-meta);
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    {#include system/ui.html /}

<div class="error-container">
    <div class="error-icon">X</div>
    <h1>抱歉，出错了</h1>
    <p class="message">{message}</p>

    {#if trackingId}
        <div class="tracking-box">
            <div class="tracking-item">
                <span class="tracking-label">错误追踪号 (Tracking ID)</span>
                <span class="tracking-value" id="trackingId">{trackingId}</span>
            </div>
            <div class="tracking-item">
                <span class="tracking-label">错误追踪文本 (如有必要，请将此文本反馈给管理员)</span>
                <span class="tracking-value tracking-text" id="trackingText">{trackingText}</span>
            </div>
            <button id="copyTrackingTextButton" class="btn btn-secondary copy-tracking-text-button">
                复制追踪文本
            </button>
            <p class="copy-hint">追踪文本已经过加密处理，仅管理员可查看其中包含的调试信息。</p>
        </div>
    {/if}

    <div class="actions">
        <a href="/" class="btn btn-primary">返回首页</a>
        <button id="reloadErrorButton" type="button" class="btn btn-secondary">重试一次</button>
    </div>
</div>

<script src="/assets/js/ui.js"></script>
<script nonce="{cspNonce}">
    function copyTrackingText() {
        const text = document.getElementById('trackingText').innerText;
        const tempTextArea = document.createElement('textarea');
        tempTextArea.value = text;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextArea);

        if (window.showToast) {
            window.showToast('追踪文本已复制到剪贴板', 'success');
        } else {
            alert('追踪文本已复制到剪贴板');
        }
    }

    const copyTrackingTextButton = document.getElementById('copyTrackingTextButton');
    if (copyTrackingTextButton) {
        copyTrackingTextButton.addEventListener('click', copyTrackingText);
    }
    const reloadErrorButton = document.getElementById('reloadErrorButton');
    if (reloadErrorButton) {
        reloadErrorButton.addEventListener('click', () => window.location.reload());
    }
</script>
</body>
</html>
