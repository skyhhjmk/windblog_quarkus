<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统异常 - WindBlog</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-container {
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: #fee2e2;
            color: var(--error-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 16px;
            font-weight: 700;
            color: #0f172a;
        }

        p.message {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .tracking-box {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-top: 24px;
            font-size: 14px;
        }

        .tracking-item {
            margin-bottom: 12px;
        }

        .tracking-label {
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        .tracking-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: #334155;
            word-break: break-all;
            background: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: block;
        }

        .actions {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-block;
            border: none;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .copy-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1>抱歉，出错了</h1>
    <p class="message">{message}</p>

    {#if trackingId}
        <div class="tracking-box">
            <div class="tracking-item">
                <span class="tracking-label">错误追踪号 (Tracking ID)</span>
                <span class="tracking-value" id="trackingId">{trackingId}</span>
            </div>
            <div class="tracking-item">
                <span class="tracking-label">错误追踪文本 (如有必要，请将此文本反馈给管理员)</span>
                <span class="tracking-value" id="trackingText"
                      style="max-height: 100px; overflow-y: auto;">{trackingText}</span>
            </div>
            <button class="btn btn-secondary" onclick="copyTrackingText()"
                    style="width: 100%; margin-top: 8px; padding: 8px; font-size: 14px;">
                复制追踪文本
            </button>
            <p class="copy-hint">追踪文本已经过加密处理，仅管理员可查看其中包含的调试信息。</p>
        </div>
    {/if}

    <div class="actions">
        <a href="/" class="btn btn-primary">返回首页</a>
        <a href="javascript:location.reload()" class="btn btn-secondary">重试一次</a>
    </div>
</div>

<script>
    function copyTrackingText() {
        const text = document.getElementById('trackingText').innerText;
        const tempTextArea = document.createElement('textarea');
        tempTextArea.value = text;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextArea);
        alert('追踪文本已复制到剪贴板');
    }
</script>
</body>
</html>
