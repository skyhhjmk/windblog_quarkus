<!-- Toast Container -->
<div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- App Modal -->
<div id="appModal" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0 bg-bg/20"></div>
    <div class="modal-container relative bg-card border border-border shadow-2xl max-w-md w-full overflow-hidden rounded-xl">
        <div class="p-8">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 tracking-tight">{i18n.t('ui.confirm')}</h3>
            <div id="modalMessage" class="text-body text-sm mb-8 leading-relaxed"></div>

            <div id="modalPromptContainer" class="hidden mb-8">
                <input type="text" id="modalPromptInput"
                       class="w-full px-4 py-2.5 bg-input-bg border border-border rounded-lg outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
                       placeholder="{i18n.t('ui.prompt_placeholder')}"/>
            </div>

            <div class="flex gap-3 justify-end">
                <button type="button" id="modalCancel"
                        class="px-6 py-2.5 text-sm font-semibold text-meta hover:text-main hover:bg-hover-surface rounded-lg transition-all">
                    {i18n.t('ui.cancel')}
                </button>
                <button type="button" id="modalOk"
                        data-shortcut="enter" aria-keyshortcuts="Enter"
                        class="px-8 py-2.5 bg-accent text-[var(--accent-foreground)] font-black rounded-lg text-sm hover:opacity-90 active:scale-95 transition-all shadow-lg shadow-accent/20">
                    {i18n.t('ui.ok')}
                </button>
            </div>
        </div>
        <div class="h-1 w-full bg-gradient-to-r from-transparent via-accent to-transparent opacity-30"></div>
    </div>
</div>

<!-- Mobile Floating Controls (TOC & Back to Top) -->
<div id="mobileFloatingControls" class="mobile-floating-controls lg:hidden" aria-label="{i18n.t('common.floating_controls', '快捷导航')}">
    <!-- Mobile TOC Floating Button (only active on articles with TOC) -->
    <button type="button" id="mobileTocBtn" class="mobile-floating-btn mobile-toc-fab hidden"
            aria-label="{i18n.t('sidebar.toc', '文章目录')}" title="{i18n.t('sidebar.toc', '文章目录')}"
            aria-controls="mobileTocDrawer" aria-expanded="false">
        <svg class="w-5 h-5 text-main transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h14"/>
        </svg>
    </button>

    <!-- Mobile Back to Top Button with Circular Progress -->
    <button type="button" id="mobileBackToTopBtn" class="mobile-floating-btn mobile-back-to-top-fab"
            aria-label="{i18n.t('common.back_to_top', '回到顶部')}" title="{i18n.t('common.back_to_top', '回到顶部')}">
        <svg class="progress-ring" viewBox="0 0 36 36" aria-hidden="true">
            <path class="progress-ring-bg" stroke-width="2.5" fill="none"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path id="mobileScrollProgressPath" class="progress-ring-indicator" stroke-width="2.5" stroke-dasharray="100, 100" stroke-dashoffset="100" stroke-linecap="round" fill="none"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        </svg>
        <svg class="w-4 h-4 text-main relative z-10 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
        </svg>
    </button>
</div>

<!-- Mobile TOC Drawer Backdrop -->
<div id="mobileTocBackdrop" class="mobile-drawer-backdrop lg:hidden" aria-hidden="true"></div>

<!-- Mobile TOC Side Drawer (移动端文章目录侧向滑出抽屉) -->
<div id="mobileTocDrawer" role="dialog" aria-modal="true" aria-label="{i18n.t('sidebar.toc', '文章目录')}" aria-hidden="true"
     class="mobile-side-drawer lg:hidden">
    <!-- Drawer Header -->
    <div class="h-16 px-6 border-b border-border flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="w-2 h-2 rounded-full bg-accent shadow-[0_0_8px_rgba(var(--accent-rgb),0.5)]"></div>
            <h3 class="text-sm font-bold tracking-wider text-main uppercase font-mono">{i18n.t('sidebar.toc', '文章目录')}</h3>
        </div>
        <button type="button" id="mobileTocCloseBtn" aria-label="{i18n.t('common.close', '关闭')}" title="{i18n.t('common.close', '关闭')}"
                class="w-9 h-9 rounded-lg flex items-center justify-center text-meta hover:text-main hover:bg-hover-surface transition-colors border border-border/40 shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Drawer Scrollable TOC Content -->
    <div id="mobileTocContent" class="relative py-1 flex-1 overflow-y-auto px-5 space-y-1 custom-scrollbar text-xs">
        <!-- JS populates items here -->
    </div>
</div>

<!-- GitHub-Style Global Search / Command Palette Modal -->
<div id="githubSearchBackdrop" class="fixed inset-0 z-[10000] bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200" aria-hidden="true"></div>

<div id="githubSearchModal" role="dialog" aria-modal="true" aria-label="{i18n.t('search.title', '搜索')}" class="fixed inset-0 z-[10001] hidden overflow-y-auto p-4 sm:p-6 md:p-16 flex items-start justify-center">
    <div class="relative w-full max-w-2xl bg-card border border-border shadow-2xl rounded-2xl overflow-hidden flex flex-col transform opacity-0 scale-95 transition-all duration-200" id="githubSearchPalette">
        <!-- Top Search Bar -->
        <div class="relative flex items-center px-4 py-3.5 border-b border-border bg-input-bg/40">
            <svg class="w-5 h-5 text-meta shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input id="githubSearchInput" type="text" autocomplete="off" spellcheck="false"
                   class="w-full bg-transparent border-0 px-3 py-1 text-base text-main placeholder:text-meta/60 focus:outline-none focus:ring-0"
                   placeholder="{i18n.t('search.github_placeholder', '搜索全站、当前页面或输入 title: author: content: ...')}" />
            <button type="button" id="githubSearchClearBtn" class="hidden text-meta hover:text-main p-1 rounded-md transition-colors mr-1" aria-label="{i18n.t('common.clear', '清空')}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <kbd class="hidden sm:inline-block px-2 py-0.5 text-[11px] font-mono bg-card border border-border rounded text-meta select-none">ESC</kbd>
        </div>

        <!-- Filter Chips Row (GitHub 风格快捷标签) -->
        <div class="flex items-center gap-1.5 px-4 py-2 border-b border-border/50 bg-card/60 overflow-x-auto custom-scrollbar text-xs">
            <span class="text-meta text-[11px] font-mono uppercase tracking-wider shrink-0 mr-1">快捷模式:</span>
            <button type="button" class="search-filter-chip active" data-filter-mode="all">🌐 全站</button>
            <button type="button" class="search-filter-chip" data-filter-mode="in-page">📄 页面内查找</button>
            <button type="button" class="search-filter-chip hidden" id="chipInArticle" data-filter-mode="in-article">📖 当前文章</button>
            <span class="h-3 w-[1px] bg-border shrink-0 mx-1"></span>
            <button type="button" class="search-filter-chip" data-syntax="title:">title:</button>
            <button type="button" class="search-filter-chip" data-syntax="author:">author:</button>
            <button type="button" class="search-filter-chip" data-syntax="content:">content:</button>
            <button type="button" class="search-filter-chip" data-syntax="user:">user:</button>
        </div>

        <!-- Live Filter Syntax Preview Bar -->
        <div id="githubSearchActiveFilters" class="hidden px-4 py-2 border-b border-border/40 bg-accent/[0.03] flex flex-wrap gap-1.5 text-xs font-mono">
            <!-- JS populates badges for active filters -->
        </div>

        <!-- In-Page Match Counter / Navigation Bar (when in in-page search mode) -->
        <div id="githubSearchInPageToolbar" class="hidden px-4 py-2 bg-accent/10 border-b border-accent/20 flex items-center justify-between text-xs">
            <span id="githubSearchInPageCount" class="text-accent font-semibold">0 处匹配</span>
            <div class="flex items-center gap-2">
                <button type="button" id="githubSearchInPagePrev" class="px-2.5 py-1 rounded-md bg-card border border-border hover:bg-hover-surface text-meta hover:text-main">↑ 上一个</button>
                <button type="button" id="githubSearchInPageNext" class="px-2.5 py-1 rounded-md bg-card border border-border hover:bg-hover-surface text-meta hover:text-main">↓ 下一个</button>
            </div>
        </div>

        <!-- Suggestions & Results Container -->
        <div id="githubSearchResultsList" class="max-h-[55vh] overflow-y-auto px-2 py-3 space-y-1 custom-scrollbar text-sm">
            <!-- JS dynamically renders options here -->
        </div>

        <!-- Footer Shortcuts Legend -->
        <div class="px-4 py-2.5 border-t border-border bg-input-bg/30 text-meta text-[11px] font-mono flex items-center justify-between select-none">
            <div class="flex items-center gap-3">
                <span><kbd class="px-1.5 py-0.5 rounded bg-card border border-border">↑↓</kbd> 导航</span>
                <span><kbd class="px-1.5 py-0.5 rounded bg-card border border-border">↵</kbd> 确认</span>
                <span><kbd class="px-1.5 py-0.5 rounded bg-card border border-border">Tab</kbd> 补全</span>
                <span><kbd class="px-1.5 py-0.5 rounded bg-card border border-border">Esc</kbd> 退出</span>
            </div>
            <span class="opacity-60">WindBlog Spotlight</span>
        </div>
    </div>
</div>
