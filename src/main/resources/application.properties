blog.title=${BLOG_TITLE:Windblog}
blog.description=${BLOG_DESCRIPTION:A powerful blog powered by Quarkus}

# CORS configuration (Refined)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
# 开发环境接受所有来源，生产环境应通过环境变量限制为具体域名
%dev.quarkus.http.cors.origins=/.*/
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,X-XSRF-TOKEN,X-Device-Id

# Public page/search request budgets; Redis-backed with bounded local fallback.
security.public-read.page-limit-per-minute=${WINDBLOG_PUBLIC_READ_PAGE_LIMIT_PER_MINUTE:240}
security.public-read.search-limit-per-minute=${WINDBLOG_PUBLIC_READ_SEARCH_LIMIT_PER_MINUTE:120}
security.public-read.home-limit-per-minute=${WINDBLOG_PUBLIC_READ_HOME_LIMIT_PER_MINUTE:300}
quarkus.http.cors.exposed-headers=Content-Disposition,Authorization
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
%prod.quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
security.headers.csp.enforce=${SECURITY_HEADERS_CSP_ENFORCE:false}
%prod.security.headers.csp.enforce=${SECURITY_HEADERS_CSP_ENFORCE:true}
security.headers.csp.img-sources=${SECURITY_HEADERS_CSP_IMG_SOURCES:none}
security.headers.csp.connect-sources=${SECURITY_HEADERS_CSP_CONNECT_SOURCES:none}
security.headers.csp.trusted-types.enabled=${SECURITY_HEADERS_CSP_TRUSTED_TYPES_ENABLED:false}
%prod.security.headers.csp.trusted-types.enabled=${SECURITY_HEADERS_CSP_TRUSTED_TYPES_ENABLED:true}
windblog.content.allowed-media-hosts=${WINDBLOG_CONTENT_ALLOWED_MEDIA_HOSTS:}
windblog.storage.metrics.enabled=${WINDBLOG_STORAGE_METRICS_ENABLED:true}

# i18n configuration
quarkus.default-locale=zh-CN
quarkus.locales=en-US,zh-CN

# Static Resource Caching (30 days)
quarkus.http.filter.assets.header.Cache-Control=public, max-age=2592000
quarkus.http.filter.assets.matches=/assets/*
quarkus.http.filter.uploads.header.Cache-Control=public, max-age=2592000
quarkus.http.filter.uploads.matches=/uploads/*

# gRPC 服务端 TLS 配置 (mTLS，所有运行模式默认强制启用)
quarkus.grpc.server.port=9000
quarkus.grpc.server.plain-text=${GRPC_SERVER_PLAINTEXT:false}
quarkus.grpc.server.ssl.certificate=${GRPC_SERVER_CERTIFICATE:certs/ca/server.crt}
quarkus.grpc.server.ssl.key=${GRPC_SERVER_KEY:certs/ca/server.key}
quarkus.grpc.server.ssl.trust-store=${GRPC_SERVER_TRUST_STORE:certs/ca/truststore.p12}
quarkus.grpc.server.ssl.trust-store-password=${GRPC_SERVER_TRUST_STORE_PASSWORD:changeit}
quarkus.grpc.server.ssl.client-auth=${GRPC_SERVER_CLIENT_AUTH:required}

# Hibernate ORM 二级缓存配置 (L2 Cache)
quarkus.hibernate-orm.second-level-caching-enabled=true

# flexmark 的 LineAppendable 在 native 运行期初始化时会拿到空 enum universe，必须构建期初始化。
quarkus.native.additional-build-args=--initialize-at-build-time=com.vladsch.flexmark,--initialize-at-run-time=com.vladsch.flexmark.util.sequence.Escaping,--initialize-at-run-time=com.biliwind.blog.common.markdown
