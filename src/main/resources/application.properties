quarkus.devservices.enabled=false

quarkus.log.level=DEBUG

# 生产环境全改 false
quarkus.qute.validate-templates=true
quarkus.qute.debug=true
quarkus.qute.dev-mode.enable=true

# 为 Elasticsearch 服务启用 DEBUG 日志
quarkus.log.category."com.biliwind.blog.service.elasticsearch".level=DEBUG
quarkus.log.category."com.biliwind.blog.service.elasticsearch".min-level=DEBUG

# Elasticsearch 连接配置
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://127.0.0.1:9200}
elasticsearch.username=${ELASTICSEARCH_USERNAME:}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
elasticsearch.ssl-trust-all=${ELASTICSEARCH_SSL_TRUST_ALL:false}

quarkus.redis.hosts=${quarkus.datasource.redis.url}
quarkus.datasource.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.username=${quarkus.datasource.username}
quarkus.datasource.password=${quarkus.datasource.password}

quarkus.application.timezone=UTC
quarkus.jackson.timezone=UTC
quarkus.hibernate-orm.jdbc.time-zone=UTC

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/db.changelog-master.xml

# 文件日志配置（用于 Filebeat 收集）
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.format=json
quarkus.log.file.encoding=UTF-8
quarkus.log.file.level=DEBUG
# 日志轮转配置
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.rotation.max-file-size=100M

# 控制台日志配置
quarkus.log.console.encoding=UTF-8
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] (%t) %s%e%n

# Elasticsearch 异步初始化和服务降级配置
elasticsearch.health-check.interval-seconds=30
elasticsearch.init.max-wait-seconds=300

# Elasticsearch 日志缓冲配置
elasticsearch.log.buffer.dir=logs/es-buffer
elasticsearch.log.buffer.max-file-size-mb=100
elasticsearch.log.buffer.max-queue-size=10000
elasticsearch.log.flush.interval-seconds=10

quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.http.auth.proactive=false

# admin api auth
admin.jwt.secret=${ADMIN_JWT_SECRET:windblog-admin-dev-secret-change-me}
admin.jwt.issuer=${ADMIN_JWT_ISSUER:windblog-admin}
admin.jwt.expire-minutes=${ADMIN_JWT_EXPIRE_MINUTES:120}

# user auth
user.jwt.secret=${USER_JWT_SECRET:windblog-user-dev-secret-change-me}
user.jwt.issuer=${USER_JWT_ISSUER:windblog-user}
user.jwt.expire-days=${USER_JWT_EXPIRE_DAYS:7}
admin.init.enabled=${ADMIN_INIT_ENABLED:true}
admin.init.username=${ADMIN_INIT_USERNAME:admin}
admin.init.password=${ADMIN_INIT_PASSWORD:admin}
admin.init.email=${ADMIN_INIT_EMAIL:admin@windblog.local}
admin.password-hash.iterations=${ADMIN_PASSWORD_HASH_ITERATIONS:210000}
admin.password-hash.key-length-bits=${ADMIN_PASSWORD_HASH_KEY_LENGTH_BITS:256}

# openapi docs
quarkus.smallrye-openapi.path=/api/admin/openapi
quarkus.swagger-ui.path=/api/admin/docs
quarkus.swagger-ui.always-include=true

quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# RabbitMQ configuration
rabbitmq-host=${RABBITMQ_HOST:127.0.0.1}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# AI Summary Channels - Outgoing producer
mp.messaging.outgoing.ai-summary-tasks.connector=smallrye-rabbitmq
mp.messaging.outgoing.ai-summary-tasks.exchange.name=ai-tasks
mp.messaging.outgoing.ai-summary-tasks.exchange.type=fanout
mp.messaging.outgoing.ai-summary-tasks.exchange.durable=true

# AI Summary Consumer
mp.messaging.incoming.ai-summary-tasks-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-summary-tasks-in.queue.name=ai-summary-tasks
mp.messaging.incoming.ai-summary-tasks-in.queue.durable=true
mp.messaging.incoming.ai-summary-tasks-in.exchange.name=ai-tasks
mp.messaging.incoming.ai-summary-tasks-in.exchange.type=fanout
mp.messaging.incoming.ai-summary-tasks-in.exchange.durable=true
# 手动确认模式
mp.messaging.incoming.ai-summary-tasks-in.acknowledgment=manual

# 死信队列消费者
mp.messaging.incoming.ai-summary-dead-letter-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-summary-dead-letter-in.queue.name=ai-summary-dead-letter
mp.messaging.incoming.ai-summary-dead-letter-in.queue.durable=true
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.name=ai-tasks-dlx
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.type=fanout
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.durable=true
mp.messaging.incoming.ai-summary-dead-letter-in.acknowledgment=auto

# AI Providers (Future use)
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.openai.api-key=${AI_OPENAI_API_KEY:}
media.upload.dir=${MEDIA_UPLOAD_DIR:uploads}
media.upload.path=${MEDIA_UPLOAD_PATH:/uploads}
quarkus.http.static-resources.uploads.path=${media.upload.path}
quarkus.http.static-resources.uploads.locations=file:${media.upload.dir}

#quarkus.log.category."io.quarkus.qute.nodeResolve".min-level=TRACE
#quarkus.log.category."io.quarkus.qute.nodeResolve".level=TRACE

# JaCoCo Configuration
quarkus.jacoco.data-file=target/jacoco.exec
quarkus.jacoco.report-location=target/coverage

# Blog metadata for RSS/Sitemap
blog.url=${BLOG_URL:http://localhost:8080}
blog.title=${BLOG_TITLE:Windblog}
blog.description=${BLOG_DESCRIPTION:A powerful blog powered by Quarkus}