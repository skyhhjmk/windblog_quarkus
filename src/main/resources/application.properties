mp.messaging.incoming.storage-sync-dlq.queue.durable=true
mp.messaging.incoming.storage-sync-dlq.exchange.name=storage-sync-dlx
mp.messaging.incoming.storage-sync-dlq.exchange.type=fanout
mp.messaging.incoming.storage-sync-dlq.exchange.durable=true
mp.messaging.incoming.storage-sync-dlq.acknowledgment=manual

# 边缘节点只承担公开入口和受控回源，不运行主节点 RabbitMQ worker。
%edge.mp.messaging.outgoing.ai-summary-tasks.enabled=false
%edge.mp.messaging.incoming.ai-summary-tasks-in.enabled=false
%edge.mp.messaging.outgoing.ai-audit-tasks.enabled=false
%edge.mp.messaging.incoming.ai-audit-tasks-in.enabled=false
%edge.mp.messaging.incoming.ai-audit-dead-letter-in.enabled=false
%edge.mp.messaging.incoming.ai-summary-dead-letter-in.enabled=false
%edge.mp.messaging.outgoing.es-sync-tasks.enabled=false
%edge.mp.messaging.incoming.es-sync-tasks-in.enabled=false
%edge.mp.messaging.incoming.es-sync-tasks-dlq-in.enabled=false
%edge.mp.messaging.outgoing.storage-sync-tasks.enabled=false
%edge.mp.messaging.incoming.storage-sync-in.enabled=false
%edge.mp.messaging.incoming.storage-sync-dlq.enabled=false

# AI Providers (Future use)
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.openai.api-key=${AI_OPENAI_API_KEY:}
media.upload.dir=${MEDIA_UPLOAD_DIR:uploads}
