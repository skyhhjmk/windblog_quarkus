quarkus.devservices.enabled=false

quarkus.log.level=INFO

# 为 Elasticsearch 服务启用 DEBUG 日志
quarkus.log.category."com.biliwind.blog.service.elasticsearch".level=${ELASTICSEARCH_LOG_LEVEL:INFO}
quarkus.log.category."com.biliwind.blog.service.elasticsearch".min-level=DEBUG

# Elasticsearch 连接配置
elasticsearch.hosts=${ELASTICSEARCH_HOSTS:http://127.0.0.1:9200}
elasticsearch.ssl-trust-all=${ELASTICSEARCH_SSL_TRUST_ALL:false}

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:32}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:512}
quarkus.datasource.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.username=${quarkus.datasource.username}
quarkus.datasource.password=${quarkus.datasource.password}
quarkus.datasource.jdbc.max-size=${DB_MAX_POOL_SIZE:32}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:10S}

quarkus.jackson.timezone=UTC

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/db.changelog-master.xml

# 文件日志配置（用于 Filebeat 收集）
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.format=json
quarkus.log.file.encoding=UTF-8
quarkus.log.file.level=DEBUG
# 日志轮转配置
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.max-backup-index=200
quarkus.log.file.rotation.max-file-size=100M
windblog.log.root=${WINDBLOG_LOG_ROOT:logs}
windblog.log.compression.enabled=${WINDBLOG_LOG_COMPRESSION_ENABLED:true}
windblog.log.compression.min-age-hours=${WINDBLOG_LOG_COMPRESSION_MIN_AGE_HOURS:24}
windblog.log.compression.retention-days=${WINDBLOG_LOG_COMPRESSION_RETENTION_DAYS:180}
%dev.quarkus.log.file.enabled=false

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] (%t) %s%e%n

# Elasticsearch 异步初始化和服务降级配置
elasticsearch.health-check.interval-seconds=30
elasticsearch.health-check.failure-threshold=${ELASTICSEARCH_HEALTH_CHECK_FAILURE_THRESHOLD:3}
elasticsearch.health-check.recovery-threshold=${ELASTICSEARCH_HEALTH_CHECK_RECOVERY_THRESHOLD:2}
elasticsearch.health-check.timeout-seconds=${ELASTICSEARCH_HEALTH_CHECK_TIMEOUT_SECONDS:5}
elasticsearch.init.max-wait-seconds=300

# Elasticsearch 日志缓冲配置
elasticsearch.log.buffer.dir=logs/es-buffer
elasticsearch.log.buffer.max-file-size-mb=100
elasticsearch.log.buffer.max-queue-size=10000
elasticsearch.log.flush.interval-seconds=10

quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.http.auth.proactive=false

# admin api auth
admin.jwt.secret=${ADMIN_JWT_SECRET:windblog-admin-dev-secret-change-me}
admin.jwt.issuer=${ADMIN_JWT_ISSUER:windblog-admin}
admin.jwt.expire-minutes=${ADMIN_JWT_EXPIRE_MINUTES:120}

# user auth
user.jwt.secret=${USER_JWT_SECRET:windblog-user-dev-secret-change-me}
user.jwt.issuer=${USER_JWT_ISSUER:windblog-user}
user.jwt.expire-days=${USER_JWT_EXPIRE_DAYS:7}
admin.init.enabled=${ADMIN_INIT_ENABLED:true}
admin.init.username=${ADMIN_INIT_USERNAME:admin}
admin.init.password=${ADMIN_INIT_PASSWORD:admin}
admin.init.email=${ADMIN_INIT_EMAIL:admin@windblog.local}
admin.password-hash.iterations=${ADMIN_PASSWORD_HASH_ITERATIONS:210000}
admin.password-hash.key-length-bits=${ADMIN_PASSWORD_HASH_KEY_LENGTH_BITS:256}
cookie.secure=${COOKIE_SECURE:false}
security.warn-default-secrets=${SECURITY_WARN_DEFAULT_SECRETS:true}

# openapi docs
quarkus.smallrye-openapi.path=/api/admin/openapi
quarkus.swagger-ui.path=/api/admin/docs
quarkus.swagger-ui.always-include=true

quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.accept-backlog=${HTTP_ACCEPT_BACKLOG:8192}
quarkus.http.limits.max-connections=${HTTP_MAX_CONNECTIONS:20000}
quarkus.http.idle-timeout=${HTTP_IDLE_TIMEOUT:120S}
quarkus.http.read-timeout=${HTTP_READ_TIMEOUT:60S}
quarkus.vertx.event-loops-pool-size=8
quarkus.thread-pool.max-threads=${VERTX_WORKER_POOL_SIZE:64}
quarkus.vertx.queue-size=${VERTX_QUEUE_SIZE:8192}

# node role: primary or edge
windblog.node.role=${WINDBLOG_NODE_ROLE:primary}
windblog.node.id=${WINDBLOG_NODE_ID:${EDGE_NODE_ID:main}}
windblog.node.region=${EDGE_NODE_REGION:GLOBAL}
windblog.edge.connection-type=${EDGE_CONNECTION_TYPE:HEARTBEAT}
windblog.primary.grpc.host=${MAIN_NODE_GRPC_HOST:127.0.0.1}
windblog.primary.grpc.port=${MAIN_NODE_GRPC_PORT:9000}
windblog.primary.grpc.advertised-host=${PRIMARY_GRPC_HOST:host.docker.internal}
windblog.primary.grpc.advertised-port=${PRIMARY_GRPC_PORT:9000}
windblog.edge.grpc.port=${EDGE_GRPC_PORT:9001}
windblog.edge.read-only-message=${EDGE_READ_ONLY_MESSAGE:主节点离线，当前从节点处于只读模式}
windblog.edge.legacy-active-poll.enabled=${EDGE_LEGACY_ACTIVE_POLL_ENABLED:false}
windblog.grpc.client.ca-certificate=${GRPC_CLIENT_CA_CERTIFICATE:certs/ca/ca.crt}
windblog.grpc.client.certificate=${GRPC_CLIENT_CERTIFICATE:certs/ca/server.crt}
windblog.grpc.client.key=${GRPC_CLIENT_KEY:certs/ca/server.key}
windblog.grpc.client.rewrite-local-target=${GRPC_CLIENT_REWRITE_LOCAL_TARGET:false}

# RabbitMQ configuration
rabbitmq-host=${RABBITMQ_HOST:127.0.0.1}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# AI Summary Channels - Outgoing producer
mp.messaging.outgoing.ai-summary-tasks.connector=smallrye-rabbitmq
mp.messaging.outgoing.ai-summary-tasks.exchange.name=ai-tasks
mp.messaging.outgoing.ai-summary-tasks.exchange.type=fanout
mp.messaging.outgoing.ai-summary-tasks.exchange.durable=true

# AI Summary Consumer
mp.messaging.incoming.ai-summary-tasks-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-summary-tasks-in.queue.name=ai-summary-tasks
mp.messaging.incoming.ai-summary-tasks-in.queue.durable=true
mp.messaging.incoming.ai-summary-tasks-in.exchange.name=ai-tasks
mp.messaging.incoming.ai-summary-tasks-in.exchange.type=fanout
mp.messaging.incoming.ai-summary-tasks-in.exchange.durable=true
mp.messaging.incoming.ai-summary-tasks-in.dead-letter-exchange=ai-tasks-dlx
# 手动确认模式
mp.messaging.incoming.ai-summary-tasks-in.acknowledgment=manual

# AI Audit Channels - Outgoing producer
mp.messaging.outgoing.ai-audit-tasks.connector=smallrye-rabbitmq
mp.messaging.outgoing.ai-audit-tasks.exchange.name=ai-audit-tasks
mp.messaging.outgoing.ai-audit-tasks.exchange.type=fanout
mp.messaging.outgoing.ai-audit-tasks.exchange.durable=true

# AI Audit Consumer
mp.messaging.incoming.ai-audit-tasks-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-audit-tasks-in.queue.name=ai-audit-tasks
mp.messaging.incoming.ai-audit-tasks-in.queue.durable=true
mp.messaging.incoming.ai-audit-tasks-in.exchange.name=ai-audit-tasks
mp.messaging.incoming.ai-audit-tasks-in.exchange.type=fanout
mp.messaging.incoming.ai-audit-tasks-in.exchange.durable=true
mp.messaging.incoming.ai-audit-tasks-in.dead-letter-exchange=ai-audit-tasks-dlx
# 手动确认模式
mp.messaging.incoming.ai-audit-tasks-in.acknowledgment=manual

# AI Audit Dead Letter Consumer
mp.messaging.incoming.ai-audit-dead-letter-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-audit-dead-letter-in.queue.name=ai-audit-dead-letter
mp.messaging.incoming.ai-audit-dead-letter-in.queue.durable=true
mp.messaging.incoming.ai-audit-dead-letter-in.exchange.name=ai-audit-tasks-dlx
mp.messaging.incoming.ai-audit-dead-letter-in.exchange.type=fanout
mp.messaging.incoming.ai-audit-dead-letter-in.exchange.durable=true
mp.messaging.incoming.ai-audit-dead-letter-in.acknowledgment=auto

# 死信队列消费者
mp.messaging.incoming.ai-summary-dead-letter-in.connector=smallrye-rabbitmq
mp.messaging.incoming.ai-summary-dead-letter-in.queue.name=ai-summary-dead-letter
mp.messaging.incoming.ai-summary-dead-letter-in.queue.durable=true
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.name=ai-tasks-dlx
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.type=fanout
mp.messaging.incoming.ai-summary-dead-letter-in.exchange.durable=true
mp.messaging.incoming.ai-summary-dead-letter-in.acknowledgment=auto

# Elasticsearch Sync Channels
mp.messaging.outgoing.es-sync-tasks.connector=smallrye-rabbitmq
mp.messaging.outgoing.es-sync-tasks.exchange.name=es-sync-tasks
mp.messaging.outgoing.es-sync-tasks.exchange.type=fanout
mp.messaging.outgoing.es-sync-tasks.exchange.durable=true

mp.messaging.incoming.es-sync-tasks-in.connector=smallrye-rabbitmq
mp.messaging.incoming.es-sync-tasks-in.queue.name=es-sync-tasks
mp.messaging.incoming.es-sync-tasks-in.queue.durable=true
mp.messaging.incoming.es-sync-tasks-in.exchange.name=es-sync-tasks
mp.messaging.incoming.es-sync-tasks-in.exchange.type=fanout
mp.messaging.incoming.es-sync-tasks-in.exchange.durable=true
mp.messaging.incoming.es-sync-tasks-in.dead-letter-exchange=es-sync-tasks-dlx
mp.messaging.incoming.es-sync-tasks-in.acknowledgment=manual

mp.messaging.incoming.es-sync-tasks-dlq-in.connector=smallrye-rabbitmq
mp.messaging.incoming.es-sync-tasks-dlq-in.queue.name=es-sync-tasks-dead-letter
mp.messaging.incoming.es-sync-tasks-dlq-in.queue.durable=true
mp.messaging.incoming.es-sync-tasks-dlq-in.exchange.name=es-sync-tasks-dlx
mp.messaging.incoming.es-sync-tasks-dlq-in.exchange.type=fanout
mp.messaging.incoming.es-sync-tasks-dlq-in.exchange.durable=true
mp.messaging.incoming.es-sync-tasks-dlq-in.acknowledgment=auto

mp.messaging.outgoing.storage-sync-tasks.connector=smallrye-rabbitmq
mp.messaging.outgoing.storage-sync-tasks.exchange.name=storage-sync-tasks
mp.messaging.outgoing.storage-sync-tasks.exchange.type=fanout
mp.messaging.outgoing.storage-sync-tasks.exchange.durable=true

mp.messaging.incoming.storage-sync-in.connector=smallrye-rabbitmq
mp.messaging.incoming.storage-sync-in.queue.name=storage-sync-tasks
mp.messaging.incoming.storage-sync-in.queue.durable=true
mp.messaging.incoming.storage-sync-in.exchange.name=storage-sync-tasks
mp.messaging.incoming.storage-sync-in.exchange.type=fanout
mp.messaging.incoming.storage-sync-in.exchange.durable=true
mp.messaging.incoming.storage-sync-in.dead-letter-exchange=storage-sync-dlx
mp.messaging.incoming.storage-sync-in.acknowledgment=manual

mp.messaging.incoming.storage-sync-dlq.connector=smallrye-rabbitmq
mp.messaging.incoming.storage-sync-dlq.queue.name=storage-sync-dead-letter
mp.messaging.incoming.storage-sync-dlq.queue.durable=true
mp.messaging.incoming.storage-sync-dlq.exchange.name=storage-sync-dlx
mp.messaging.incoming.storage-sync-dlq.exchange.type=fanout
mp.messaging.incoming.storage-sync-dlq.exchange.durable=true
mp.messaging.incoming.storage-sync-dlq.acknowledgment=manual

# AI Providers (Future use)
ai.gemini.api-key=${AI_GEMINI_API_KEY:}
ai.openai.api-key=${AI_OPENAI_API_KEY:}
media.upload.dir=${MEDIA_UPLOAD_DIR:uploads}
media.upload.path=${MEDIA_UPLOAD_PATH:/uploads}

#quarkus.log.category."io.quarkus.qute.nodeResolve".min-level=TRACE
#quarkus.log.category."io.quarkus.qute.nodeResolve".level=TRACE

# Repost license and go short link settings
windblog.site.public-url=${WINDBLOG_SITE_PUBLIC_URL:http://localhost:8080}
windblog.site.primary-domain=${WINDBLOG_SITE_PRIMARY_DOMAIN:localhost}
windblog.go.public-url=${WINDBLOG_GO_PUBLIC_URL:http://localhost:8080}
windblog.go.redirect-status=${WINDBLOG_GO_REDIRECT_STATUS:302}

# Blog metadata for RSS/Sitemap
blog.url=${BLOG_URL:http://localhost:8080}
blog.title=${BLOG_TITLE:Windblog}
blog.description=${BLOG_DESCRIPTION:A powerful blog powered by Quarkus}

# CORS configuration (Refined)
quarkus.http.cors.enabled=true
# 开发环境接受所有来源，生产环境应通过环境变量限制为具体域名
%dev.quarkus.http.cors.origins=/.*/
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,Origin
quarkus.http.cors.exposed-headers=Content-Disposition,Authorization,Set-Cookie
quarkus.http.cors.access-control-allow-credentials=true

# i18n configuration
quarkus.default-locale=zh-CN
quarkus.locales=en-US,zh-CN

# Static Resource Caching (30 days)
quarkus.http.filter.assets.header.Cache-Control=public, max-age=2592000
quarkus.http.filter.assets.matches=/assets/*
quarkus.http.filter.uploads.header.Cache-Control=public, max-age=2592000
quarkus.http.filter.uploads.matches=/uploads/*

# gRPC 服务端 TLS 配置 (mTLS)
quarkus.grpc.server.port=9000

# 生产环境强制开启 mTLS
quarkus.grpc.server.ssl.certificate=certs/ca/server.crt
quarkus.grpc.server.ssl.key=certs/ca/server.key
quarkus.grpc.server.ssl.trust-store=certs/ca/truststore.p12
quarkus.grpc.server.ssl.trust-store-password=changeit
quarkus.grpc.server.ssl.client-auth=required

# 开发环境默认关闭 TLS 以便快速启动（CertificateService 会在启动后自动生成证书）
#quarkus.grpc.server.ssl.client-auth=none

# Hibernate ORM 二级缓存配置 (L2 Cache)
quarkus.hibernate-orm.second-level-caching-enabled=true

# flexmark 的 LineAppendable 在 native 运行期初始化时会拿到空 enum universe，必须构建期初始化。
quarkus.native.additional-build-args=--initialize-at-build-time=com.vladsch.flexmark,--initialize-at-run-time=com.vladsch.flexmark.util.sequence.Escaping,--initialize-at-run-time=com.biliwind.blog.common.markdown
