<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - WindBlog 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-gray-800 text-white flex-shrink-0">
            <div class="p-4">
                <h1 class="text-2xl font-bold">WindBlog</h1>
                <p class="text-gray-400 text-sm mt-1">管理后台</p>
            </div>
            
            <nav class="mt-6">
                <a href="dashboard.html" id="dashboard-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    概览
                </a>
                
                <a href="posts.html" id="posts-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                    </svg>
                    文章管理
                </a>
                
                <a href="categories.html" id="categories-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    分类管理
                </a>
                
                <a href="tags.html" id="tags-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    标签管理
                </a>
                
                <a href="comments.html" id="comments-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    评论管理
                </a>
                
                <a href="users.html" id="users-nav" class="nav-item flex items-center px-4 py-3 bg-gray-700 text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    用户管理
                </a>
                
                <a href="media.html" id="media-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    媒体库
                </a>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">用户管理</h2>
                    
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold"></div>
                            <span id="userName" class="text-gray-700"></span>
                        </div>
                        
                        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-6">
                <!-- 操作栏 -->
                <div class="bg-white rounded-lg shadow mb-6 p-4">
                    <div class="flex justify-between items-center">
                        <div class="flex-1 max-w-md">
                            <div class="relative">
                                <input type="text" id="searchInput" placeholder="搜索用户名或邮箱..." 
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <button onclick="loadUsers()" class="ml-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            刷新
                        </button>
                    </div>
                </div>
                
                <!-- 用户列表 -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">邮箱</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">角色</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- 动态加载用户数据 -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
                        <div class="text-sm text-gray-700">
                            显示 <span id="startCount">0</span> 到 <span id="endCount">0</span> 条，共 <span id="totalCount">0</span> 条
                        </div>
                        <div class="flex gap-2">
                            <button id="prevPage" onclick="changePage(-1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>上一页</button>
                            <button id="nextPage" onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>下一页</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- 编辑用户模态框 -->
    <div id="editUserModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">编辑用户</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="editUserForm" onsubmit="saveUser(event)">
                <input type="hidden" id="editUserId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                    <input type="text" id="editUsername" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
                    <input type="email" id="editEmail" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">角色</label>
                    <select id="editRole" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="USER">普通用户</option>
                        <option value="ADMIN">管理员</option>
                        <option value="SUPER_ADMIN">超级管理员</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">状态</label>
                    <select id="editStatus" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ACTIVE">正常</option>
                        <option value="INACTIVE">禁用</option>
                    </select>
                </div>
                
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="assets/js/admin.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let currentSearch = '';
        let usersData = [];
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async function() {
            // 验证登录状态
            const isAuth = await AdminUtils.checkAuth();
            if (!isAuth) return;
            
            // 加载用户信息
            try {
                const user = await AdminUtils.get('/auth/me');
                if (user.user) {
                    currentUser = user.user;
                    document.getElementById('userName').textContent = user.user.username;
                    const firstLetter = user.user.username.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = firstLetter;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
            
            // 设置当前导航项
            PageNavigator.setActiveNav('users');
            
            // 加载用户列表
            await loadUsers();
            
            // 搜索功能
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value.trim();
                    currentPage = 1;
                    loadUsers();
                }, 500);
            });
            
            // 登出功能
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                const confirmed = await Modal.confirm('确定要退出登录吗？');
                if (confirmed) {
                    await AdminUtils.logout();
                }
            });
        });
        
        async function loadUsers() {
            try {
                let url = `/users?page=${currentPage}&pageSize=${pageSize}`;
                if (currentSearch) {
                    url += `&keyword=${encodeURIComponent(currentSearch)}`;
                }
                
                const result = await AdminUtils.get(url);
                usersData = result.items || [];
                
                renderUsersTable(usersData);
                updatePagination(result.total);
            } catch (error) {
                console.error('加载用户列表失败:', error);
                AdminUtils.showToast('加载用户列表失败', 'error');
            }
        }
        
        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');
            
            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            暂无用户数据
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = users.map(user => {
                let roleBadge;
                if (user.roleName === 'SUPER_ADMIN') {
                    roleBadge = '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">超级管理员</span>';
                } else if (user.roleName === 'ADMIN') {
                    roleBadge = '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800">管理员</span>';
                } else {
                    roleBadge = '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">普通用户</span>';
                }
                
                const statusBadge = user.status === 1
                    ? '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">正常</span>'
                    : '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">禁用</span>';
                
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold mr-3">
                                    ${user.username.charAt(0).toUpperCase()}
                                </div>
                                <div class="font-medium text-gray-900">${escapeHtml(user.username)}</div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-500">${escapeHtml(user.email)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${roleBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-500">${AdminUtils.formatDate(user.createdAt)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right">
                            <button onclick="editUser(${user.id})" class="text-blue-600 hover:text-blue-800 mr-3">编辑</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function updatePagination(total) {
            const start = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, total);
            
            document.getElementById('startCount').textContent = start;
            document.getElementById('endCount').textContent = end;
            document.getElementById('totalCount').textContent = total;
            
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage * pageSize >= total;
        }
        
        function changePage(delta) {
            currentPage += delta;
            loadUsers();
        }
        
        function editUser(userId) {
            const user = usersData.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editEmail').value = user.email;
            
            // 设置角色，确保正确处理 null 值
            const roleValue = (user.roleName && user.roleName.trim()) ? user.roleName : 'USER';
            const roleSelect = document.getElementById('editRole');
            roleSelect.value = roleValue;
            
            // 设置状态
            document.getElementById('editStatus').value = user.status === 1 ? 'ACTIVE' : 'INACTIVE';
            
            // 检查当前用户是否为超级管理员，只有超级管理员可以修改角色
            const roleLabel = roleSelect.parentElement.querySelector('label');
            if (currentUser && currentUser.roleName === 'SUPER_ADMIN') {
                roleSelect.disabled = false;
                roleLabel.classList.remove('text-gray-400');
            } else {
                roleSelect.disabled = true;
                roleLabel.classList.add('text-gray-400');
            }
            
            document.getElementById('editUserModal').classList.remove('hidden');
            document.getElementById('editUserModal').classList.add('flex');
        }
        
        function closeEditModal() {
            document.getElementById('editUserModal').classList.add('hidden');
            document.getElementById('editUserModal').classList.remove('flex');
        }
        
        async function saveUser(event) {
            event.preventDefault();
            
            const userId = parseInt(document.getElementById('editUserId').value);
            const updateData = {
                email: document.getElementById('editEmail').value,
                status: document.getElementById('editStatus').value === 'ACTIVE' ? 1 : 0
            };
            
            // 只有角色选择框未被禁用时（即超级管理员），才发送角色更新请求
            const roleSelect = document.getElementById('editRole');
            if (!roleSelect.disabled) {
                updateData.roleName = document.getElementById('editRole').value;
            }
            
            try {
                await AdminUtils.put(`/users/${userId}`, updateData);
                AdminUtils.showToast('用户更新成功', 'success');
                closeEditModal();
                await loadUsers();
            } catch (error) {
                console.error('更新用户失败:', error);
                AdminUtils.showToast('更新用户失败：' + error.message, 'error');
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
