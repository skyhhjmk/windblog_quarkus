<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论管理 - WindBlog 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-gray-800 text-white flex-shrink-0">
            <div class="p-4">
                <h1 class="text-2xl font-bold">WindBlog</h1>
                <p class="text-gray-400 text-sm mt-1">管理后台</p>
            </div>

            <nav class="mt-6">
                <a href="dashboard.html" id="dashboard-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    概览
                </a>

                <a href="posts.html" id="posts-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                    </svg>
                    文章管理
                </a>

                <a href="categories.html" id="categories-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    分类管理
                </a>

                <a href="tags.html" id="tags-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    标签管理
                </a>

                <a href="comments.html" id="comments-nav" class="nav-item flex items-center px-4 py-3 bg-gray-700 text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    评论管理
                </a>

                <a href="users.html" id="users-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    用户管理
                </a>

                <a href="media.html" id="media-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    媒体库
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">评论管理</h2>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold"></div>
                            <span id="userName" class="text-gray-700"></span>
                        </div>

                        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6">
                <div class="bg-white rounded-lg shadow mb-6 p-4">
                    <div class="flex flex-col lg:flex-row lg:items-center gap-4">
                        <div class="flex-1">
                            <div class="relative">
                                <input type="text" id="searchInput" placeholder="搜索评论内容、用户或文章标题"
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>

                        <div class="flex gap-3">
                            <select id="statusFilter" class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">全部状态</option>
                                <option value="0">待审核</option>
                                <option value="1">已通过</option>
                                <option value="2">垃圾评论</option>
                            </select>

                            <button onclick="loadComments()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                                刷新
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">评论</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">文章</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody id="commentsTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                        </table>
                    </div>

                    <div class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
                        <div class="text-sm text-gray-700">
                            显示 <span id="startCount">0</span> 到 <span id="endCount">0</span> 条，共 <span id="totalCount">0</span> 条
                        </div>
                        <div class="flex gap-2">
                            <button id="prevPage" onclick="changePage(-1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>上一页</button>
                            <button id="nextPage" onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>下一页</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">评论详情</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="detailContent" class="px-6 py-5 space-y-4"></div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button onclick="closeDetailModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md">关闭</button>
            </div>
        </div>
    </div>

    <script src="assets/js/admin.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let currentSearch = '';
        let currentStatus = '';
        let commentsData = [];

        document.addEventListener('DOMContentLoaded', async function() {
            const isAuth = await AdminUtils.checkAuth();
            if (!isAuth) return;

            try {
                const user = await AdminUtils.get('/auth/me');
                if (user.user) {
                    document.getElementById('userName').textContent = user.user.username;
                    document.getElementById('userAvatar').textContent = user.user.username.charAt(0).toUpperCase();
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }

            PageNavigator.setActiveNav('comments');
            await loadComments();

            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function(event) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = event.target.value.trim();
                    currentPage = 1;
                    loadComments();
                }, 300);
            });

            document.getElementById('statusFilter').addEventListener('change', function(event) {
                currentStatus = event.target.value;
                currentPage = 1;
                loadComments();
            });

            document.getElementById('logoutBtn').addEventListener('click', async function() {
                const confirmed = await Modal.confirm('确定要退出登录吗？');
                if (confirmed) {
                    await AdminUtils.logout();
                }
            });
        });

        async function loadComments() {
            try {
                let url = `/comments?page=${currentPage}&pageSize=${pageSize}`;
                if (currentSearch) {
                    url += `&keyword=${encodeURIComponent(currentSearch)}`;
                }
                if (currentStatus !== '') {
                    url += `&status=${encodeURIComponent(currentStatus)}`;
                }

                const result = await AdminUtils.get(url);
                commentsData = result.items || [];
                renderCommentsTable(commentsData);
                updatePagination(result.total || 0);
            } catch (error) {
                console.error('加载评论列表失败:', error);
                AdminUtils.showToast(`加载评论列表失败：${error.message}`, 'error');
            }
        }

        function renderCommentsTable(comments) {
            const tbody = document.getElementById('commentsTableBody');

            if (!comments.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-10 text-center text-gray-500">暂无评论数据</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = comments.map(comment => `
                <tr class="hover:bg-gray-50 align-top">
                    <td class="px-6 py-4">
                        <div class="max-w-xl">
                            ${comment.parentId ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 mb-2">回复评论</span>' : ''}
                            <p class="text-sm text-gray-900 leading-6">${escapeHtml(getExcerpt(comment.content))}</p>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(comment.postTitle || `文章 #${comment.postId}`)}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${escapeHtml(comment.userName || '游客')}</div>
                        <div class="text-xs text-gray-400">ID: ${comment.userId ?? '-'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${renderStatusBadge(comment.status)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${AdminUtils.formatDate(comment.createdAt)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="showCommentDetail(${comment.id})" class="text-gray-600 hover:text-gray-900 mr-3">详情</button>
                        <button onclick="updateCommentStatus(${comment.id}, 1)" class="text-green-600 hover:text-green-800 mr-3">通过</button>
                        <button onclick="updateCommentStatus(${comment.id}, 2)" class="text-yellow-600 hover:text-yellow-800 mr-3">标记垃圾</button>
                        <button onclick="deleteComment(${comment.id})" class="text-red-600 hover:text-red-800">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderStatusBadge(status) {
            const badges = {
                0: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">待审核</span>',
                1: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">已通过</span>',
                2: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">垃圾评论</span>'
            };
            return badges[status] || `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-700">状态 ${status}</span>`;
        }

        function updatePagination(total) {
            const start = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, total);

            document.getElementById('startCount').textContent = start;
            document.getElementById('endCount').textContent = end;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage * pageSize >= total;
        }

        function changePage(delta) {
            currentPage += delta;
            loadComments();
        }

        function showCommentDetail(commentId) {
            const comment = commentsData.find(item => item.id === commentId);
            if (!comment) return;

            document.getElementById('detailContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">评论 ID</p>
                        <p class="text-gray-900 font-mono">${comment.id}</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">所属文章</p>
                        <p class="text-gray-900">${escapeHtml(comment.postTitle || `文章 #${comment.postId}`)}</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">评论用户</p>
                        <p class="text-gray-900">${escapeHtml(comment.userName || '游客')}</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">当前状态</p>
                        <div class="mt-1">${renderStatusBadge(comment.status)}</div>
                    </div>
                </div>
                <div class="bg-gray-50 rounded-lg p-4">
                    <p class="text-sm text-gray-500 mb-2">评论内容</p>
                    <p class="text-gray-900 whitespace-pre-wrap break-words leading-7">${escapeHtml(comment.content)}</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">发布时间</p>
                        <p class="text-gray-900">${AdminUtils.formatDate(comment.createdAt)}</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-500 mb-1">父评论 ID</p>
                        <p class="text-gray-900 font-mono">${comment.parentId ?? '-'}</p>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        async function updateCommentStatus(commentId, status) {
            const actionText = status === 1 ? '通过' : '标记为垃圾评论';
            const confirmed = await Modal.confirm(`确定要${actionText}这条评论吗？`);
            if (!confirmed) return;

            try {
                await AdminUtils.put(`/comments/${commentId}`, { status });
                AdminUtils.showToast(`评论已${actionText}`, 'success');
                closeDetailModal();
                await loadComments();
            } catch (error) {
                console.error('更新评论状态失败:', error);
                AdminUtils.showToast(`更新评论状态失败：${error.message}`, 'error');
            }
        }

        async function deleteComment(commentId) {
            const confirmed = await Modal.confirm('确定要删除这条评论吗？此操作不可恢复。');
            if (!confirmed) return;

            try {
                await AdminUtils.delete(`/comments/${commentId}`);
                AdminUtils.showToast('评论已删除', 'success');
                closeDetailModal();
                await loadComments();
            } catch (error) {
                console.error('删除评论失败:', error);
                AdminUtils.showToast(`删除评论失败：${error.message}`, 'error');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function getExcerpt(text) {
            if (!text) return '';
            return text.length > 120 ? `${text.slice(0, 120)}...` : text;
        }
    </script>
</body>
</html>
