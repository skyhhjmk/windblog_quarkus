<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体库 - WindBlog 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-gray-800 text-white flex-shrink-0">
            <div class="p-4">
                <h1 class="text-2xl font-bold">WindBlog</h1>
                <p class="text-gray-400 text-sm mt-1">管理后台</p>
            </div>
            
            <nav class="mt-6">
                <a href="dashboard.html" id="dashboard-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    概览
                </a>
                
                <a href="posts.html" id="posts-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                    </svg>
                    文章管理
                </a>
                
                <a href="categories.html" id="categories-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    分类管理
                </a>
                
                <a href="tags.html" id="tags-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    标签管理
                </a>
                
                <a href="users.html" id="users-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    用户管理
                </a>
                
                <a href="media.html" id="media-nav" class="nav-item flex items-center px-4 py-3 bg-gray-700 text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    媒体库
                </a>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">媒体库</h2>
                    
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold"></div>
                            <span id="userName" class="text-gray-700"></span>
                        </div>
                        
                        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-6">
                <!-- 上传区域 -->
                <div class="bg-white rounded-lg shadow mb-6">
                    <div class="p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">上传文件</h3>
                        
                        <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition cursor-pointer">
                            <input type="file" id="fileInput" class="hidden" multiple accept="image/*,video/*,audio/*">
                            
                            <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            
                            <p class="text-gray-600 mb-2">拖拽文件到此处，或点击选择文件</p>
                            <p class="text-sm text-gray-500">支持图片、视频、音频文件</p>
                        </div>
                        
                        <!-- 上传进度 -->
                        <div id="uploadProgress" class="hidden mt-4">
                            <div class="bg-gray-200 rounded-full h-2">
                                <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                            <p id="uploadStatus" class="text-sm text-gray-600 mt-2 text-center">上传中...</p>
                        </div>
                    </div>
                </div>
                
                <!-- 媒体文件列表 -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-800">媒体文件</h3>
                        <button onclick="loadMedia()" class="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-md transition">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            刷新
                        </button>
                    </div>
                    
                    <!-- 网格视图 -->
                    <div class="p-6">
                        <div id="mediaGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
                            <!-- 动态加载媒体文件 -->
                        </div>
                        
                        <!-- 空状态 -->
                        <div id="emptyState" class="hidden text-center py-12">
                            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-gray-500">暂无媒体文件</p>
                        </div>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
                        <div class="text-sm text-gray-700">
                            显示 <span id="startCount">0</span> 到 <span id="endCount">0</span> 条，共 <span id="totalCount">0</span> 条
                        </div>
                        <div class="flex gap-2">
                            <button id="prevPage" onclick="changePage(-1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>上一页</button>
                            <button id="nextPage" onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed" disabled>下一页</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- 预览模态框 -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-90 hidden items-center justify-center z-50" onclick="closePreview()">
        <div class="max-w-4xl max-h-full p-4" onclick="event.stopPropagation()">
            <button onclick="closePreview()" class="absolute top-4 right-4 text-white hover:text-gray-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            
            <div class="bg-white rounded-lg p-4">
                <div id="previewContent" class="max-h-[70vh] overflow-auto"></div>
                <div class="mt-4 pt-4 border-t">
                    <p id="previewFilename" class="text-sm font-medium text-gray-800 mb-1"></p>
                    <p id="previewInfo" class="text-xs text-gray-500"></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="assets/js/admin.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 12;
        let mediaData = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            // 验证登录状态
            const isAuth = await AdminUtils.checkAuth();
            if (!isAuth) return;
            
            // 加载用户信息
            try {
                const user = await AdminUtils.get('/auth/me');
                if (user.user) {
                    document.getElementById('userName').textContent = user.user.username;
                    const firstLetter = user.user.username.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = firstLetter;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
            
            // 设置当前导航项
            PageNavigator.setActiveNav('media');
            
            // 初始化拖拽上传
            initDropZone();
            
            // 加载媒体列表
            await loadMedia();
            
            // 登出功能
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                const confirmed = await Modal.confirm('确定要退出登录吗？');
                if (confirmed) {
                    await AdminUtils.logout();
                }
            });
        });
        
        function initDropZone() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            
            // 点击上传
            dropZone.addEventListener('click', () => fileInput.click());
            
            // 文件选择
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                fileInput.value = '';
            });
            
            // 拖拽事件
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('border-blue-500', 'bg-blue-50'), false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-blue-500', 'bg-blue-50'), false);
            });
            
            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }, false);
        }
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        async function handleFiles(files) {
            if (files.length === 0) return;
            
            const uploadProgress = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            const uploadStatus = document.getElementById('uploadStatus');
            
            uploadProgress.classList.remove('hidden');
            
            let uploaded = 0;
            const total = files.length;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                uploadStatus.textContent = `正在上传 ${i + 1}/${total}: ${file.name}`;
                
                try {
                    await uploadFile(file);
                    uploaded++;
                    progressBar.style.width = `${(uploaded / total) * 100}%`;
                } catch (error) {
                    console.error(`上传失败 ${file.name}:`, error);
                    AdminUtils.showToast(`上传失败：${file.name}`, 'error');
                }
            }
            
            if (uploaded === total) {
                uploadStatus.textContent = '上传完成！';
                setTimeout(() => uploadProgress.classList.add('hidden'), 2000);
                await loadMedia();
                AdminUtils.showToast(`成功上传 ${uploaded} 个文件`, 'success');
            }
        }
        
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            const token = AdminUtils.getToken();
            
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                
                xhr.open('POST', `${AdminUtils.API_BASE}/media/upload`, true);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        resolve(JSON.parse(xhr.responseText));
                    } else {
                        reject(new Error(xhr.responseText || '上传失败'));
                    }
                };
                
                xhr.onerror = function() {
                    reject(new Error('网络错误'));
                };
                
                xhr.send(formData);
            });
        }
        
        async function loadMedia() {
            try {
                const result = await AdminUtils.get(`/media?page=${currentPage}&pageSize=${pageSize}`);
                mediaData = result.files || [];
                
                renderMediaGrid(mediaData);
                updatePagination(result.total);
            } catch (error) {
                console.error('加载媒体列表失败:', error);
                AdminUtils.showToast('加载媒体列表失败', 'error');
            }
        }
        
        function renderMediaGrid(files) {
            const grid = document.getElementById('mediaGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (files.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            grid.innerHTML = files.map(file => {
                const isImage = file.mimeType && file.mimeType.startsWith('image/');
                const isVideo = file.mimeType && file.mimeType.startsWith('video/');
                const isAudio = file.mimeType && file.mimeType.startsWith('audio/');
                
                let thumbnail = '';
                if (isImage) {
                    thumbnail = `<img src="${file.url}" alt="${escapeHtml(file.filename)}" class="w-full h-32 object-cover rounded-lg">`;
                } else if (isVideo) {
                    thumbnail = `
                        <div class="w-full h-32 bg-gray-800 rounded-lg flex items-center justify-center">
                            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    `;
                } else if (isAudio) {
                    thumbnail = `
                        <div class="w-full h-32 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                            </svg>
                        </div>
                    `;
                } else {
                    thumbnail = `
                        <div class="w-full h-32 bg-gray-200 rounded-lg flex items-center justify-center">
                            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                    `;
                }
                
                return `
                    <div class="group relative cursor-pointer" onclick="previewFile(${file.id})">
                        ${thumbnail}
                        <div class="mt-2">
                            <p class="text-sm font-medium text-gray-900 truncate" title="${escapeHtml(file.filename)}">${escapeHtml(file.filename)}</p>
                            <p class="text-xs text-gray-500">${formatFileSize(file.size)}</p>
                        </div>
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition rounded-lg flex items-center justify-center">
                            <button class="opacity-0 group-hover:opacity-100 bg-white rounded-full p-2 shadow-lg transition" onclick="event.stopPropagation(); previewFile(${file.id})">
                                <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updatePagination(total) {
            const start = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, total);
            
            document.getElementById('startCount').textContent = start;
            document.getElementById('endCount').textContent = end;
            document.getElementById('totalCount').textContent = total;
            
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage * pageSize >= total;
        }
        
        function changePage(delta) {
            currentPage += delta;
            loadMedia();
        }
        
        function previewFile(fileId) {
            const file = mediaData.find(f => f.id === fileId);
            if (!file) return;
            
            const previewContent = document.getElementById('previewContent');
            const previewFilename = document.getElementById('previewFilename');
            const previewInfo = document.getElementById('previewInfo');
            
            previewFilename.textContent = file.filename;
            previewInfo.textContent = `${formatFileSize(file.size)} - ${AdminUtils.formatDate(file.createdAt)}`;
            
            const isImage = file.mimeType && file.mimeType.startsWith('image/');
            const isVideo = file.mimeType && file.mimeType.startsWith('video/');
            const isAudio = file.mimeType && file.mimeType.startsWith('audio/');
            
            if (isImage) {
                previewContent.innerHTML = `<img src="${file.url}" alt="${escapeHtml(file.filename)}" class="max-w-full max-h-[70vh] object-contain">`;
            } else if (isVideo) {
                previewContent.innerHTML = `<video src="${file.url}" controls class="max-w-full max-h-[70vh]"></video>`;
            } else if (isAudio) {
                previewContent.innerHTML = `
                    <div class="flex items-center justify-center h-48">
                        <audio src="${file.url}" controls class="w-full"></audio>
                    </div>
                `;
            } else {
                previewContent.innerHTML = `
                    <div class="flex items-center justify-center h-48">
                        <div class="text-center">
                            <svg class="w-24 h-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="text-gray-500">此文件类型不支持预览</p>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }
        
        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewModal').classList.remove('flex');
            document.getElementById('previewContent').innerHTML = '';
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ESC 键关闭预览
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreview();
            }
        });
    </script>
</body>
</html>
