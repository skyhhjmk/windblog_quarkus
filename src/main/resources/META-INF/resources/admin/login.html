<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - WindBlog 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-lg shadow-md p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">WindBlog</h1>
                <p class="text-gray-600 mt-2">管理后台</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="account" class="block text-sm font-medium text-gray-700 mb-2">
                        账号（用户名或邮箱）
                    </label>
                    <input
                        type="text"
                        id="account"
                        name="account"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="请输入账号"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        密码
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="请输入密码"
                    >
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
                    <p class="text-sm"></p>
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    登录
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/" class="text-sm text-gray-600 hover:text-gray-800">
                    &larr; 返回博客首页
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/admin';
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';
            errorMessage.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ account, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    localStorage.setItem('admin_token', data.token);
                    window.location.href = '/admin/';
                } else {
                    throw new Error(data.message || '登录失败，请检查账号和密码');
                }
            } catch (error) {
                errorMessage.querySelector('p').textContent = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        });
        
        if (localStorage.getItem('admin_token')) {
            window.location.href = '/admin/';
        }
    </script>
</body>
</html>
