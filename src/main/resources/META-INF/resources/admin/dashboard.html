                    </svg>

                <a href="categories.html" id="categories-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>

                <a href="tags.html" id="tags-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    标签管理
                </a>
                
                <a href="comments.html" id="comments-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    评论管理
                </a>
                
                <a href="users.html" id="users-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    用户管理
                </a>
                
                <a href="media.html" id="media-nav" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    媒体库
                </a>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">概览</h2>
                    
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div id="userAvatar" class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold"></div>
                            <span id="userName" class="text-gray-700"></span>
                        </div>
                        
                        <button id="logoutBtn" class="text-gray-600 hover:text-red-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-6">
                <!-- 统计卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 bg-blue-500 rounded-md p-3">
                                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">文章总数</dt>
                                    <dd id="totalPosts" class="text-2xl font-semibold text-gray-900">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 bg-green-500 rounded-md p-3">
                                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">分类数量</dt>
                                    <dd id="totalCategories" class="text-2xl font-semibold text-gray-900">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 bg-yellow-500 rounded-md p-3">
                                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">标签数量</dt>
                                    <dd id="totalTags" class="text-2xl font-semibold text-gray-900">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 bg-purple-500 rounded-md p-3">
                                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">用户数量</dt>
                                    <dd id="totalUsers" class="text-2xl font-semibold text-gray-900">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 系统信息 -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-800">系统信息</h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <p class="text-sm text-gray-500">JVM 名称</p>
                                <p id="vmName" class="text-gray-800">-</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">可用处理器</p>
                                <p id="availableProcessors" class="text-gray-800">-</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">系统负载</p>
                                <p id="systemLoad" class="text-gray-800">-</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">运行时间</p>
                                <p id="uptime" class="text-gray-800">-</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script src="assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // 验证登录状态
            const isAuth = await AdminUtils.checkAuth();
            if (!isAuth) return;
            
            // 加载用户信息
            try {
                const user = await AdminUtils.get('/auth/me');
                if (user.user) {
                    document.getElementById('userName').textContent = user.user.username;
                    const firstLetter = user.user.username.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = firstLetter;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
            
            // 加载统计数据
            await loadStatistics();
            
            // 加载系统信息
            await loadSystemInfo();
            
            // 登出功能
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                const confirmed = await Modal.confirm('确定要退出登录吗？');
                if (confirmed) {
                    await AdminUtils.logout();
                }
            });
        });
        
        async function loadStatistics() {
            try {
                // 获取文章数量
                const posts = await AdminUtils.get('/posts?page=1&pageSize=1');
                document.getElementById('totalPosts').textContent = posts.total || 0;
                
                // 获取分类数量
                const categories = await AdminUtils.get('/categories');
                document.getElementById('totalCategories').textContent = categories.length || 0;
                
                // 获取标签数量
                const tags = await AdminUtils.get('/tags');
                document.getElementById('totalTags').textContent = tags.length || 0;
                
                // 获取用户数量
                const users = await AdminUtils.get('/users?page=1&pageSize=1');
                document.getElementById('totalUsers').textContent = users.total || 0;
            } catch (error) {
                console.error('加载统计数据失败:', error);
                AdminUtils.showToast('加载统计数据失败', 'error');
            }
        }
        
        async function loadSystemInfo() {
            try {
                // 使用 handle401=false，避免监控接口失败导致跳转登录页
                const monitor = await AdminUtils.request('/system/monitor', { method: 'GET' }, false);
                document.getElementById('vmName').textContent = monitor.vmName || '-';
                document.getElementById('availableProcessors').textContent = monitor.availableProcessors || '-';
                document.getElementById('systemLoad').textContent = monitor.systemLoadAverage !== undefined ? monitor.systemLoadAverage : '-';
                
                // 格式化运行时间
                if (monitor.uptime) {
                    const hours = Math.floor(monitor.uptime / 3600000);
                    const minutes = Math.floor((monitor.uptime % 3600000) / 60000);
                    document.getElementById('uptime').textContent = `${hours}小时 ${minutes}分钟`;
                }
            } catch (error) {
                console.error('加载系统信息失败:', error);
                // 静默失败，不影响页面其他功能
                document.getElementById('vmName').textContent = '-';
                document.getElementById('availableProcessors').textContent = '-';
                document.getElementById('systemLoad').textContent = '-';
                document.getElementById('uptime').textContent = '-';
            }
        }
    </script>
</body>
</html>
