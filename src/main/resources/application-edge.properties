# Edge nodes do not use RabbitMQ directly.
# The node runs in read-only / gRPC backhaul mode, so all messaging channels must stay disabled.
quarkus.messaging.health.enabled=false
quarkus.rabbitmq.devservices.enabled=false
windblog.edge.lightweight=true
windblog.outbox.enabled=false
windblog.storage.metrics.enabled=false
windblog.log.compression.enabled=false
quarkus.log.file.enabled=false

# Plain console logs preserve the original startup exception when native JSON formatting fails.
quarkus.log.console.json.enabled=false

mp.messaging.outgoing.ai-summary-tasks.enabled=false
mp.messaging.incoming.ai-summary-tasks-in.enabled=false

mp.messaging.outgoing.ai-audit-tasks.enabled=false
mp.messaging.incoming.ai-audit-tasks-in.enabled=false
mp.messaging.incoming.ai-audit-dead-letter-in.enabled=false
mp.messaging.incoming.ai-summary-dead-letter-in.enabled=false

mp.messaging.outgoing.es-sync-tasks.enabled=false
mp.messaging.incoming.es-sync-tasks-in.enabled=false
mp.messaging.incoming.es-sync-tasks-dlq-in.enabled=false

mp.messaging.outgoing.storage-sync-tasks.enabled=false
mp.messaging.incoming.storage-sync-in.enabled=false
mp.messaging.incoming.storage-sync-dlq.enabled=false
