tool.subnet-calculator.name=新一代智能子网掩码计算器
tool.subnet-calculator.desc=可视化 IP/CIDR 掩码计算与网络划分工具。支持 IPv4/IPv6、二/十/十六进制位图对比、通配符计算、可变长子网 (VLSM) 划分与层级可视化。
tool.subnet-calculator.tag=网络工具
tool.timestamp-converter.name=Unix 时间戳与时区转换器
tool.timestamp-converter.desc=毫秒(13位)/秒(10位)双向转换，全球跨国时区对照，相对时间推算及常见编程语言获取时间戳代码速查。
tool.timestamp-converter.tag=常用转换
tool.log-formatter.name=日志格式化与结构化清洗
tool.log-formatter.desc=支持 JSON/NDJSON 展开美化、Spring/Java 异常堆栈追踪提取、Nginx 访问日志解析、ERROR/WARN 着色及瞬时关键词筛选。
tool.log-formatter.tag=开发运维
tool.base-encoder.name=Base64 / Base 编码全家桶
tool.base-encoder.desc=支持标准 Base64、URL 安全 Base64、Base32、Base16(Hex)、Base58 (区块链/比特币变体)，完整支持中文字符与二进制安全。
tool.base-encoder.tag=常用转换
tool.cron-generator.name=Cron 表达式生成与执行模拟器
tool.cron-generator.desc=Linux Crontab 与 Quartz/Spring 6段式表达式可视化生成、人类自然语言释义、未来多次触发时间推算与语言模板速查。
tool.cron-generator.tag=开发运维
tool.regex-tester.name=正则表达式在线调试与速查
tool.regex-tester.desc=即时 RegExp 正则匹配、多色块高亮与捕获组拆解、字符串替换实时预览，内置常用经典正则速查库一键套用。
tool.regex-tester.tag=开发运维
tool.hash-calculator.name=现代哈希计算与文件本地校验
tool.hash-calculator.desc=支持 MD5、SHA-1/256/512 及国密 SM3 算法，纯本地浏览器沙箱极速计算、支持文本与大文件拖拽校验及 HMAC 密钥模式。
tool.hash-calculator.tag=安全加密
tool.json-diff.name=JSON 格式化与可视化对比 (Diff)
tool.json-diff.desc=JSON 语法美化、紧凑压缩、容错修复、转义清洗，以及双栏结构化差异可视化比对（增、删、改精准定位）。
tool.json-diff.tag=数据处理
