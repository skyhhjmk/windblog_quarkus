# Local-only test overlay.
# Keep the base Compose file unchanged for the normal deployment topology.
# An isolated Codex auth directory is supplied at runtime through
# CODEX_CREATOR_HOST_CODEX_DIR; the helper script prepares it from auth.json.
services:
  db:
    container_name: windblog-codex-test-db

  codex-creator-db-init:
    container_name: windblog-codex-test-db-init

  windblog:
    container_name: windblog-codex-test-windblog

  # Local-only edge: mirrors the production same-origin Grafana route without
  # creating an extra application component in Kubernetes.
  edge:
    container_name: windblog-codex-test-edge
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    depends_on:
      windblog:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - target: 8080
        published: "${WINDBLOG_HOST_PORT:-58080}"
        host_ip: "127.0.0.1"
    volumes:
      - ./deploy/nginx/windblog-local-test.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Nginx listens on IPv4 only; localhost can resolve to ::1 in Alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  codex-creator:
    container_name: windblog-codex-test-codex-creator
    environment:
      # Optional host proxy for environments where the container network cannot
      # reach the Codex service directly. Production Compose remains unchanged.
      HTTP_PROXY: "${CODEX_CREATOR_HTTP_PROXY:-}"
      HTTPS_PROXY: "${CODEX_CREATOR_HTTPS_PROXY:-}"
      ALL_PROXY: "${CODEX_CREATOR_ALL_PROXY:-}"
      NO_PROXY: "${CODEX_CREATOR_NO_PROXY:-localhost,127.0.0.1,windblog,db,redis}"
      # Some base images carry lower-case proxy variables. Set both spellings
      # explicitly so an image-level loopback proxy cannot leak into the test
      # container when the host proxy is disabled or translated by the helper.
      http_proxy: "${CODEX_CREATOR_HTTP_PROXY:-}"
      https_proxy: "${CODEX_CREATOR_HTTPS_PROXY:-}"
      all_proxy: "${CODEX_CREATOR_ALL_PROXY:-}"
      no_proxy: "${CODEX_CREATOR_NO_PROXY:-localhost,127.0.0.1,windblog,db,redis}"
    ports:
      - target: 8681
        published: "${CODEX_CREATOR_HOST_PORT:-58091}"
        host_ip: "127.0.0.1"
    volumes:
      - ${CODEX_CREATOR_HOST_CODEX_DIR:?CODEX_CREATOR_HOST_CODEX_DIR must point to an isolated local Codex auth directory}:/data/codex-creator/.codex:rw

  redis:
    container_name: windblog-codex-test-redis

  rabbitmq:
    container_name: windblog-codex-test-rabbitmq

  elasticsearch:
    container_name: windblog-codex-test-elasticsearch
    volumes:
      - windblog-codex-test-elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    container_name: windblog-codex-test-kibana
    volumes:
      - windblog-codex-test-kibana-data:/usr/share/kibana/data

  filebeat:
    container_name: windblog-codex-test-filebeat

  otel-collector:
    container_name: windblog-codex-test-otel-collector

  prometheus:
    container_name: windblog-codex-test-prometheus
    volumes:
      - windblog-codex-test-prometheus-data:/prometheus

  grafana-jwt-key-init:
    container_name: windblog-codex-test-grafana-jwt-key-init

  grafana:
    container_name: windblog-codex-test-grafana
    volumes:
      - windblog-codex-test-grafana-data:/var/lib/grafana

  cadvisor:
    profiles: ["observability-host"]

  clamav:
    container_name: windblog-codex-test-clamav

volumes:
  windblog-codex-test-elasticsearch-data:
  windblog-codex-test-kibana-data:
  windblog-codex-test-prometheus-data:
  windblog-codex-test-grafana-data:
