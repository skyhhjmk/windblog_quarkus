services:
  # 边缘节点专用数据库 (用于存储逻辑复制的只读副本)
  edge-db:
    container_name: windblog-edge-db
    image: postgres:18
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - target: 5432
        published: "${EDGE_DB_PORT:-5434}"
        host_ip: "${EDGE_HOST_BIND_IP:-0.0.0.0}"
    environment:
      POSTGRES_USER: ${EDGE_DB_USER}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD}
      POSTGRES_DB: ${EDGE_DB_NAME}
    volumes:
      - edge-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EDGE_DB_USER} -d ${EDGE_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 边缘节点专用缓存
  edge-redis:
    container_name: windblog-edge-redis
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - target: 6379
        published: "${EDGE_REDIS_PORT:-6381}"
        host_ip: "${EDGE_HOST_BIND_IP:-0.0.0.0}"
    environment:
      REDIS_PASSWORD: ${EDGE_REDIS_PASSWORD:?EDGE_REDIS_PASSWORD must be set}
    volumes:
      - edge-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--requirepass", "${EDGE_REDIS_PASSWORD:?EDGE_REDIS_PASSWORD must be set}"]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 边缘节点应用
  edge-node:
    container_name: windblog-edge-node
    image: ${WINDBLOG_EDGE_IMAGE:-ghcr.io/skyhhjmk/windblog_quarkus:latest}
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - target: ${EDGE_GRPC_PORT:-9001}
        published: "${EDGE_GRPC_PORT:-9001}"
        host_ip: "${EDGE_HOST_BIND_IP:-0.0.0.0}"
      - target: 8081
        published: "${EDGE_APP_HTTP_PORT:-8081}"
        host_ip: "${EDGE_HOST_BIND_IP:-0.0.0.0}"
    env_file:
      - .env.edge
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=${EDGE_DATASOURCE_URL}
      - QUARKUS_DATASOURCE_USERNAME=${EDGE_DB_USER}
      - QUARKUS_DATASOURCE_PASSWORD=${EDGE_DB_PASSWORD}
      # Keep the DB_* and POSTGRES_* aliases aligned with the primary service.
      - DB_JDBC_URL=${EDGE_DATASOURCE_URL}
      - DB_USERNAME=${EDGE_DB_USER}
      - DB_PASSWORD=${EDGE_DB_PASSWORD}
      - POSTGRES_HOST=edge-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${EDGE_DB_NAME}
      - POSTGRES_USER=${EDGE_DB_USER}
      - POSTGRES_PASSWORD=${EDGE_DB_PASSWORD}
      - QUARKUS_REDIS_HOSTS=${EDGE_REDIS_URL}
      - QUARKUS_REDIS_PASSWORD=${EDGE_REDIS_PASSWORD}
      - REDIS_URL=${EDGE_REDIS_URL}
      - REDIS_PASSWORD=${EDGE_REDIS_PASSWORD}
      - QUARKUS_HTTP_PORT=8081
      - QUARKUS_GRPC_SERVER_PORT=${EDGE_GRPC_PORT:-9001}
      - EDGE_NODE_CONNECTION_TYPE=${EDGE_CONNECTION_TYPE:-ACTIVE_POLL}
      # 证书路径 (使用 QUARKUS_ 环境变量直接覆盖，防止原生镜像构建时默认值被烘焙导致运行期不生效)
      - QUARKUS_GRPC_SERVER_PLAIN_TEXT=false
      - QUARKUS_GRPC_SERVER_SSL_CERTIFICATE=certs/ca/server.crt
      - QUARKUS_GRPC_SERVER_SSL_KEY=certs/ca/server.key
      - QUARKUS_GRPC_CLIENTS_MAIN_NODE_SSL_CERTIFICATE=certs/ca/client.crt
      - QUARKUS_GRPC_CLIENTS_MAIN_NODE_SSL_KEY=certs/ca/client.key
      - QUARKUS_GRPC_CLIENTS_MAIN_NODE_SSL_TRUST_CERTIFICATE=certs/ca/ca.crt
    volumes:
      - ./certs:/work/certs
    depends_on:
      edge-db:
        condition: service_healthy
      edge-redis:
        condition: service_healthy


networks:
  app-network:
    driver: bridge

volumes:
  edge-db-data:
  edge-redis-data:
