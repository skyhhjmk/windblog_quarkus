apiVersion: apps/v1
kind: Deployment
metadata:
  name: windblog
  labels:
    app.kubernetes.io/name: windblog
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: windblog-quarkus
  template:
    metadata:
      labels:
        app: windblog-quarkus
        app.kubernetes.io/name: windblog
        app.kubernetes.io/component: application
    spec:
      securityContext:
        fsGroup: 185
      containers:
        - name: windblog
          image: localhost/windblog-quarkus:k8s-dev
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS_APPEND
              value: >-
                -Dquarkus.profile=dev -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
            - name: QUARKUS_PROFILE
              value: dev
            - name: DB_JDBC_URL
              value: jdbc:postgresql://postgresql:5432/windblog
            - name: DB_USERNAME
              value: windblog
            - name: DB_PASSWORD
              value: ""
            - name: REDIS_URL
              value: redis://redis:6379
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: guest
            - name: RABBITMQ_PASSWORD
              value: guest
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_USERNAME
              value: ""
            - name: ELASTICSEARCH_PASSWORD
              value: ""
            - name: ELASTICSEARCH_SSL_VERIFY
              value: none
            - name: ELASTICSEARCH_SSL_TRUST_ALL
              value: "true"
            - name: WIND_BLOG_MEDIA_VIRUS_SCAN_ENABLED
              value: "true"
            - name: WIND_BLOG_MEDIA_VIRUS_SCAN_REQUIRED
              value: "false"
            - name: WIND_BLOG_MEDIA_VIRUS_SCAN_AUTO_DETECT
              value: "false"
            - name: WIND_BLOG_MEDIA_VIRUS_SCAN_HOST
              value: clamav
            - name: WIND_BLOG_MEDIA_VIRUS_SCAN_PORT
              value: "3310"
            - name: COOKIE_SECURE
              value: "false"
            - name: SECURITY_FAIL_ON_DEFAULT_SECRETS_IN_PROD
              value: "false"
            - name: GRPC_SERVER_CLIENT_AUTH
              value: required
            - name: GRPC_SERVER_PLAINTEXT
              value: "false"
            - name: GRPC_SERVER_CERTIFICATE
              value: /deployments/certs/ca/server.crt
            - name: GRPC_SERVER_KEY
              value: /deployments/certs/ca/server.key
            - name: GRPC_SERVER_TRUST_STORE
              value: /deployments/certs/ca/truststore.p12
            - name: GRPC_SERVER_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windblog-grpc-tls
                  key: truststore-password
            - name: GRPC_CLIENT_CA_CERTIFICATE
              value: /deployments/certs/ca/ca.crt
            - name: GRPC_CLIENT_CERTIFICATE
              value: /deployments/certs/ca/client.crt
            - name: GRPC_CLIENT_KEY
              value: /deployments/certs/ca/client.key
            - name: GRPC_CLIENT_ALLOW_PLAINTEXT_FALLBACK
              value: "false"
            - name: WINDBLOG_CODEX_CREATOR_ENDPOINT
              value: http://codex-creator:8090
            - name: WINDBLOG_CODEX_CREATOR_EVENTS_ENABLED
              value: "true"
            - name: WINDBLOG_CODEX_CREATOR_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: internal-shared-secret
            - name: QUARKUS_LOG_FILE_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: windblog-grpc-tls
              mountPath: /deployments/certs/ca
              readOnly: true
      volumes:
        - name: windblog-grpc-tls
          secret:
            secretName: windblog-grpc-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              - key: truststore.p12
                path: truststore.p12
