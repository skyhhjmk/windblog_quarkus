apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-creator
  labels:
    app.kubernetes.io/name: codex-creator
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-creator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-creator
        app.kubernetes.io/component: application
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: codex-creator-db-init
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: postgresql
            - name: POSTGRES_USER
              value: windblog
            - name: POSTGRES_DB
              value: windblog
            - name: CODEX_CREATOR_DB_NAME
              value: codex_creator
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do
                sleep 2
              done
              if ! psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
                  -tAc "SELECT 1 FROM pg_database WHERE datname = '$${CODEX_CREATOR_DB_NAME}'" | grep -q 1; then
                psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
                  -c "CREATE DATABASE \"$${CODEX_CREATOR_DB_NAME}\" OWNER \"$${POSTGRES_USER}\""
              fi
              psql -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${CODEX_CREATOR_DB_NAME}" \
                -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      containers:
        - name: codex-creator
          image: localhost/codex-creator:k8s-dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_CREATOR_DB_JDBC_URL
              value: jdbc:postgresql://postgresql:5432/codex_creator
            - name: CODEX_CREATOR_DB_USERNAME
              value: windblog
            - name: CODEX_CREATOR_DB_PASSWORD
              value: ""
            - name: CODEX_CREATOR_REDIS_URL
              value: redis://redis:6379
            - name: CODEX_CREATOR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: admin-token
            - name: CODEX_CREATOR_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: internal-shared-secret
            - name: CODEX_CREATOR_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: mcp-bearer-token
            - name: CODEX_APP_SERVER_ENABLED
              value: "true"
            - name: CODEX_COMMAND
              value: codex
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: openai-api-key
                  optional: true
            - name: CODEX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-creator-secrets
                  key: codex-access-token
                  optional: true
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: codex-creator-data
              mountPath: /data/codex-creator
      volumes:
        - name: codex-creator-data
          emptyDir: {}
