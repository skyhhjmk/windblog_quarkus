# Replace windblog.example.com in an environment overlay. This manifest assumes
# the community ingress-nginx controller and requires allow-snippet-annotations
# for the Grafana cookie-to-header bridge. It creates no Nginx Deployment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: windblog
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: windblog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: windblog
                port:
                  name: http
---
# Keep this separate so the sensitive response-header forwarding applies only
# to Grafana, not to the application routes above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: windblog-grafana
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The initial iframe URL contains a bearer token. Do not let the ingress
    # controller's default request log retain its query string.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $windblog_grafana_jwt $cookie_windblog_grafana_jwt;
      if ($arg_auth_token != "") {
        set $windblog_grafana_jwt $arg_auth_token;
        add_header Set-Cookie "windblog_grafana_jwt=$arg_auth_token; Path=/observability/grafana/; Max-Age=900; Secure; HttpOnly; SameSite=Strict" always;
      }
      proxy_set_header X-JWT-Assertion $windblog_grafana_jwt;
      add_header Cache-Control "no-store" always;
spec:
  ingressClassName: nginx
  rules:
    - host: windblog.example.com
      http:
        paths:
          - path: /observability/grafana/
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
