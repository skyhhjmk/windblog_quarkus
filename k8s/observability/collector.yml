extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  postgresql:
    endpoint: postgresql:5432
    username: "${env:POSTGRES_USER}"
    password: "${env:POSTGRES_PASSWORD}"
    databases: [windblog]
    collection_interval: 30s
    # `insecure: true` emits sslmode=disable for the plaintext PostgreSQL
    # Service. Replace this with a TLS configuration if the Service enables it.
    tls: {insecure: true}
  redis:
    endpoint: redis:6379
    password: "${env:REDIS_PASSWORD}"
    collection_interval: 30s
  rabbitmq:
    endpoint: http://rabbitmq:15672
    username: "${env:RABBITMQ_USERNAME}"
    password: "${env:RABBITMQ_PASSWORD}"
    collection_interval: 30s
  elasticsearch:
    endpoint: http://elasticsearch:9200
    username: "${env:ELASTICSEARCH_USERNAME}"
    password: "${env:ELASTIC_PASSWORD}"
    collection_interval: 30s
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256, spike_limit_mib: 64}
  resource/telemetry:
    attributes:
      - {key: deployment.environment.name, value: "${env:OTEL_DEPLOYMENT_ENVIRONMENT}", action: upsert}
      - {key: service.namespace, value: windblog, action: upsert}
      - {key: data_stream.dataset, value: windblog.otel, action: upsert}
      - {key: data_stream.namespace, value: "${env:OTEL_DEPLOYMENT_ENVIRONMENT}", action: upsert}
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: db.statement, action: delete}
  cumulativetodelta: {}
  batch: {timeout: 5s, send_batch_size: 1024}
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: true}
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    user: "${env:ELASTICSEARCH_USERNAME}"
    password: "${env:ELASTIC_PASSWORD}"
    mapping: {mode: otel}
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resource/telemetry, attributes/redact, batch], exporters: [elasticsearch]}
    metrics/prometheus: {receivers: [otlp, postgresql, redis, rabbitmq, elasticsearch], processors: [memory_limiter, resource/telemetry, attributes/redact, batch], exporters: [prometheus]}
    metrics/elasticsearch: {receivers: [otlp, postgresql, redis, rabbitmq, elasticsearch], processors: [memory_limiter, resource/telemetry, attributes/redact, cumulativetodelta, batch], exporters: [elasticsearch]}
