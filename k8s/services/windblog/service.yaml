apiVersion: v1
kind: Service
metadata:
  name: windblog
  labels:
    app.kubernetes.io/name: windblog
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app: windblog-quarkus
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      appProtocol: http
    - name: grpc
      protocol: TCP
      port: 9000
      targetPort: 9000
      appProtocol: grpc
