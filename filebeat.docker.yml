# Filebeat 配置文件（Docker 版本）
# 参考官方文档：https://www.elastic.co/docs/reference/beats/filebeat/running-on-docker

filebeat.inputs:
  # 应用日志输入（使用 filestream，Filebeat 9.x 强制要求）
  - type: filestream
    enabled: true
    id: windblog-app-logs
    paths:
      - /var/log/windblog/application.log       # 当前日志文件
      - /var/log/windblog/application.log.*     # 仅匹配重命名文件（不匹配其他.log文件）
    
    # 解析器配置，直接解析JSON
    parsers:
      - ndjson:
          keys_under_root: true
          overwrite_keys: true
          add_error_key: true
    
    # 日志标签
    fields:
      service: windblog-quarkus
      service_name: windblog
      log_type: application
      environment: ${ENVIRONMENT:-development}

# processors 配置
processors:
  # 添加主机元数据
  #  - add_host_metadata:
  #      when.not.contains.tags: forwarded
  
  # 添加云元数据（如果在云上运行）
  #  - add_cloud_metadata: ~

  - timestamp:
      field: timestamp
      layouts:
        # DO NOT CHANGE
        - '2006-01-02T15:04:05.9999999Z07:00'  # ISO8601 以及显式时区偏移+8 6位微秒精度
      ignore_missing: true
      remove_field: true

  - drop_fields:
      fields: [ "@timestamp" ]
      ignore_missing: true

  - drop_fields:
      fields: [ "agent", "ecs", "host.architecture", "host.containerized", "host.id", "host.ip", "host.mac", "input", "log.file", "ndc", "hostName" ]
      ignore_missing: true
  
  # 将 timestamp 字段重命名为 @timestamp（Elasticsearch 标准字段）
  - rename:
      fields:
        - from: "timestamp"
          to: "@timestamp"
      ignore_missing: true
      fail_on_error: false

# Elasticsearch 输出配置
output.elasticsearch:
  # Elasticsearch 地址
  hosts: [ "${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}" ]
  
  # 认证配置
  username: "${ELASTICSEARCH_USERNAME:-elastic}"
  password: "${ELASTICSEARCH_PASSWORD:-}"
  
  # SSL/TLS 配置
  ssl.verification_mode: "${ELASTICSEARCH_SSL_VERIFY:-none}"
  
  # 直接写入项目初始化脚本创建的写别名
  index: "windblog-logs"
  
  # 批量推送配置
  bulk_max_size: 100
  flush_interval: 5s
  
  # 重试配置
  max_retries: 5
  max_retries_window: 30s

# 日志输出配置（Filebeat 自身的日志）
logging.level: info
logging.to_stderr: true

# ILM (Index Lifecycle Management) 配置
# 该项目已经通过 src/main/resources/elasticsearch 下的初始化脚本管理
# windblog-logs 的 ILM、模板和写别名，Filebeat 只负责发送日志。
setup.ilm.enabled: false

# 模板配置
setup.template.enabled: false

# 队列配置
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

# 内部监控
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: [ "${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}" ]
  username: "${ELASTICSEARCH_USERNAME:-elastic}"
  password: "${ELASTICSEARCH_PASSWORD:-}"
