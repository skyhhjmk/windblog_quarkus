<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">用户注册</h1>

        <form action="/user/api/register" class="space-y-4" data-no-debounce="true" id="registerForm" method="post">
            <input name="redirect" type="hidden" value="{redirect}"/>

            <div>
                <label class="block text-sm mb-1" for="username">用户名</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="username"
                       maxlength="20"
                       minlength="3"
                       name="username"
                       pattern="[a-zA-Z0-9_]+"
                       placeholder="3-20位字母数字下划线"
                       required
                       type="text"/>
                <p class="text-xs text-gray-500 mt-1">仅支持字母、数字、下划线</p>
            </div>

            <div>
                <label class="block text-sm mb-1" for="email">邮箱</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="email"
                       name="email"
                       placeholder="请输入有效邮箱地址"
                       required
                       type="email"/>
            </div>

            <div>
                <label class="block text-sm mb-1" for="password">密码</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="password"
                       maxlength="32"
                       minlength="6"
                       name="password"
                       placeholder="6-32位密码"
                       required
                       type="password"/>
                <p class="text-xs text-gray-500 mt-1">建议使用字母、数字组合</p>
            </div>

            <div>
                <label class="block text-sm mb-1" for="confirmPassword">确认密码</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="confirmPassword"
                       minlength="6"
                       name="confirmPassword"
                       placeholder="再次输入密码"
                       required
                       type="password"/>
            </div>

            <div class="flex items-center gap-2">
                <input id="agreement" name="agreement" required type="checkbox"/>
                <label class="text-sm" for="agreement">
                    我已阅读并同意 <a class="text-[var(--accent)] hover:underline" href="#">用户协议</a>
                </label>
            </div>

            <div class="hidden text-red-400 text-sm text-center" id="errorMessage"></div>

            <button class="w-full py-2 bg-[var(--accent)] text-[var(--bg)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
                    id="registerSubmit"
                    type="submit">
                <span class="btn-text">注册</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>已有账号?</span>
            <a class="text-[var(--accent)] hover:underline ml-1" data-no-pjax="true"
               href="/user/login?redirect={redirect}">立即登录</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div class="hidden" data-page-title="用户注册"></div>
<div class="hidden" id="pjax-nav-path">~/windblog / user / register</div>
<div class="hidden" id="pjax-sidebar-html">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">注册须知</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>用户名唯一且不可修改</li>
                <li>邮箱用于找回密码</li>
                <li>注册即表示同意用户协议</li>
            </ul>
        </section>
    </div>
</div>
