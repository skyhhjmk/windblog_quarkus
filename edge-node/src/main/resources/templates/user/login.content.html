<div class="max-w-md mx-auto">
    <div class="border border-[var(--border)] bg-[var(--panel-bg)] p-6">
        <h1 class="text-xl font-bold mb-6 text-center">用户登录</h1>

        <form action="/user/api/login" class="space-y-4" data-no-debounce="true" id="loginForm" method="post">
            <input name="redirect" type="hidden" value="{redirect}"/>

            <div>
                <label class="block text-sm mb-1" for="account">账号 (用户名或邮箱)</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="account"
                       name="account"
                       placeholder="请输入用户名或邮箱"
                       required
                       type="text"/>
            </div>

            <div>
                <label class="block text-sm mb-1" for="password">密码</label>
                <input class="w-full px-3 py-2 bg-[var(--bg)] border border-[var(--border)] text-[var(--fg)] outline-none focus:border-[var(--accent)]"
                       id="password"
                       minlength="6"
                       name="password"
                       placeholder="请输入密码"
                       required
                       type="password"/>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm">
                    <input name="remember" type="checkbox" value="on"/>
                    <span>记住我</span>
                </label>
                <a class="text-sm text-[var(--accent)] hover:underline" href="#">忘记密码?</a>
            </div>

            <div class="hidden text-red-400 text-sm text-center" id="errorMessage"></div>

            <button class="w-full py-2 bg-[var(--accent)] text-[var(--bg)] font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
                    type="submit">
                <span class="btn-text">登录</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span>还没有账号?</span>
            <a class="text-[var(--accent)] hover:underline ml-1" data-no-pjax="true"
               href="/user/register?redirect={redirect}">立即注册</a>
        </div>
    </div>
</div>

<!-- PJAX 数据 -->
<div class="hidden" data-page-title="用户登录"></div>
<div class="hidden" id="pjax-nav-path">~/windblog / user / login</div>
<div class="hidden" id="pjax-sidebar-html">
    <div class="space-y-4">
        <section class="border border-[var(--border)] p-4 bg-[var(--panel-bg)]">
            <h3 class="font-bold mb-2">登录说明</h3>
            <ul class="text-sm space-y-1 list-disc list-inside">
                <li>支持用户名或邮箱登录</li>
                <li>密码区分大小写</li>
                <li>建议开启"记住我"功能</li>
            </ul>
        </section>
    </div>
</div>
