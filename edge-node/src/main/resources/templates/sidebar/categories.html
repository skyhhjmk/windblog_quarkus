<div class="sidebar-widget bg-card/40 backdrop-blur-md border border-border rounded-xl p-6 transition-all duration-300 hover:border-accent/30 group">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-1.5 h-6 bg-accent rounded-full"></div>
        <h3 class="text-sm font-bold tracking-wider text-main uppercase">文章分类</h3>
    </div>

    <div class="space-y-1">
        {#for cat in sidebar:categories}
        <a class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-accent/5 group/link transition-all"
           href="/category/{cat.slug}">
            <span class="text-sm text-body group-hover/link:text-main group-hover/link:translate-x-1 transition-all">
                {cat.name}
            </span>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-border/50 text-meta group-hover/link:bg-accent/20 group-hover/link:text-accent transition-colors">
                {cat.count}
            </span>
        </a>
        {/for}
    </div>
</div>
