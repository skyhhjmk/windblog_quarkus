        <h3 class="text-sm font-bold tracking-wider text-main uppercase">热门标签</h3>
    </div>

    <div class="flex flex-wrap gap-2">
        {#for tag in sidebar:tags}
        <a class="px-3 py-1.5 rounded-lg border border-border text-xs text-body hover:border-accent/50 hover:text-accent hover:bg-accent/5 transition-all duration-300"
           href="/tag/{tag.slug}">
            #{tag.name}
        </a>
        {/for}
    </div>
</div>
