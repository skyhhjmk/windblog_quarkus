# Edge Node Configuration
edge.node.id=${EDGE_NODE_ID:edge-node-01}
edge.node.region=${EDGE_NODE_REGION:global}

# gRPC Client configuration
quarkus.grpc.clients.main-node.host=${MAIN_NODE_GRPC_HOST:localhost}
quarkus.grpc.clients.main-node.port=${MAIN_NODE_GRPC_PORT:9000}
quarkus.grpc.clients.main-node.plain-text=true

# Datasource configuration (Read-only replica)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.url=${EDGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/windblog_edge}
quarkus.datasource.username=${EDGE_DATASOURCE_USERNAME:windblog}
quarkus.datasource.password=${EDGE_DATASOURCE_PASSWORD:windblog}

# Connection pool configuration
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=50
quarkus.datasource.jdbc.acquisition-timeout=30s
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.validation-query-timeout=5s

# Blog Configuration
blog.url=${BLOG_URL:http://localhost:8080}
media.upload.path=/uploads

# Liquibase configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/db.changelog-master.xml

# Hibernate configuration
quarkus.hibernate-orm.mapping.format.global=ignore

# Redis configuration
quarkus.redis.hosts=${EDGE_REDIS_HOSTS:redis://localhost:6379}

# User JWT configuration (Must match main node)
user.jwt.secret=${USER_JWT_SECRET:your-very-secure-jwt-secret-key-at-least-32-chars}
user.jwt.issuer=${USER_JWT_ISSUER:windblog}

# Cache configuration
quarkus.cache.enabled=true
quarkus.cache.type=redis

# HTTP configuration
quarkus.http.port=8082

# Native Build Configuration
quarkus.native.container-build=true
quarkus.native.additional-build-args=--initialize-at-run-time=com.vladsch.flexmark,--initialize-at-run-time=com.biliwind.blog.common.helper.MarkdownHelper$FlexmarkHolder,--initialize-at-run-time=com.biliwind.blog.common.markdown
