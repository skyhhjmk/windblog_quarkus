# Edge Node Configuration
edge.node.id=${EDGE_NODE_ID:edge-node-01}
edge.node.region=${EDGE_NODE_REGION:global}

# gRPC Client configuration
quarkus.grpc.clients.main-node.host=${MAIN_NODE_GRPC_HOST:localhost}
quarkus.grpc.clients.main-node.port=${MAIN_NODE_GRPC_PORT:9000}
quarkus.grpc.clients.main-node.plain-text=true

# Datasource configuration (Read-only replica)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${EDGE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/windblog_edge}
quarkus.datasource.username=${EDGE_DATASOURCE_USERNAME:windblog}
quarkus.datasource.password=${EDGE_DATASOURCE_PASSWORD:windblog}

# Liquibase configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/db.changelog-master.xml

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore

# Redis configuration
quarkus.redis.hosts=${EDGE_REDIS_HOSTS:redis://localhost:6379}

# HTTP configuration
quarkus.http.port=8081
