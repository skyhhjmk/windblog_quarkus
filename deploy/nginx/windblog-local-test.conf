# Local-only same-origin edge used by docker-compose.local-test.yml.
# It deliberately has no TLS, CIDR allow-list, or public listener: Compose binds
# it to 127.0.0.1 only. Production continues to use windblog-edge.conf.template
# and Kubernetes routes through its Ingress controller.

map $arg_auth_token $windblog_grafana_jwt {
    ""      $cookie_windblog_grafana_jwt;
    default $arg_auth_token;
}

map $arg_auth_token $windblog_grafana_set_cookie {
    ""      "";
    default "windblog_grafana_jwt=$arg_auth_token; Path=/observability/grafana/; Max-Age=900; HttpOnly; SameSite=Lax";
}

log_format windblog_grafana_safe '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    # The application container is recreated during local updates and receives
    # a new IP. Resolve the Compose service name periodically instead of
    # retaining the address that existed when nginx first started.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $windblog_upstream http://windblog:8080;

    location ^~ /observability/grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /observability/grafana;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-JWT-Assertion $windblog_grafana_jwt;
        proxy_no_cache 1;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie $windblog_grafana_set_cookie always;
        access_log /var/log/nginx/grafana_access.log windblog_grafana_safe;
    }

    location / {
        proxy_pass $windblog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
