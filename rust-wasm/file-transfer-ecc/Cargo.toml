[package]
name = "file-transfer-ecc"
version = "0.1.0"
edition = "2021"
description = "Isolated Rust WASM Reed-Solomon (GF(2^8) Cauchy MDS) ECC and CRC32 module for WindBlog P2P file transfer"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
